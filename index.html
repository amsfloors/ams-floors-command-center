<script>
  const PW = 'Sailor@22';
  const SK = 'ams_auth';
  function checkPW(){
    const v = document.getElementById('pw-input').value;
    if(v === PW){ sessionStorage.setItem(SK,'1'); document.getElementById('gate').style.display='none'; }
    else{ document.getElementById('pw-err').textContent='Incorrect password'; document.getElementById('pw-input').value=''; document.getElementById('pw-input').focus(); }
  }
  // Check on load
  if(sessionStorage.getItem(SK)!=='1'){
    document.getElementById('gate').style.display='flex';
    setTimeout(()=>document.getElementById('pw-input').focus(),100);
  } else {
    document.getElementById('gate').style.display='none';
  }
</script>

const money = (n, compact=false) => {
  if (n===null||n===undefined||isNaN(n)||n==='') return '—';
  if (n===0) return '$0';
  if (compact && Math.abs(n)>=1e6) return `$${(n/1e6).toFixed(2)}M`;
  if (compact && Math.abs(n)>=1e3) return `$${(n/1e3).toFixed(0)}K`;
  return '$'+Math.round(n).toLocaleString('en-US');
};
const pct=(n,d=0)=>(n===null||n===undefined||isNaN(n))?'—':`${(n*100).toFixed(d)}%`;
const todayStr=()=>new Date().toISOString().slice(0,10);
const daysBetween=(a,b)=>a&&b?Math.floor((new Date(b)-new Date(a))/86400000):null;
const daysSince=d=>daysBetween(d,todayStr());
const formatDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
const lastActivity=p=>p.lastTouched||p.submitted;
const overdueDays=(p,s)=>{
  if(!['Submitted','Negotiating','Bidding'].includes(p.status)) return null;
  const since=daysSince(lastActivity(p));
  if(since===null) return null;
  const sla=p.status==='Submitted'?s.slaSubmitted:s.slaNegotiating;
  return Math.max(0,since-sla);
};
const estMargin=p=>{
  const c=p.contractAmount||p.bidAmount||0;
  if(!c) return null;
  const costs=(p.estMaterial||0)+(p.estLabor||0)+(p.estOther||0);
  return costs?((c-costs)/c):null;
};
const actMargin=p=>{
  const c=p.contractAmount||p.bidAmount||0;
  if(!c) return null;
  const costs=(p.actMaterial||0)+(p.actLabor||0)+(p.actOther||0);
  return costs?((c-costs)/c):null;
};
const followUpScore=(p,s,wr)=>{
  const od=overdueDays(p,s)||0;
  const w=wr!==null&&wr!==undefined?Math.max(wr,0.1):0.3;
  return (p.bidAmount||0)*(1+od/7)*(1+w);
};

  const map=new Map();
  proposals.forEach(p=>{
    if(!p.gc) return;
    if(!map.has(p.gc)) map.set(p.gc,{gc:p.gc,proposals:0,totalVolume:0,won:0,lost:0,open:0,wonValue:0,lostValue:0,openValue:0,contacts:new Set(),firstSubmit:null,lastSubmit:null,projects:[]});
    const s=map.get(p.gc);
    s.proposals++; s.totalVolume+=(p.bidAmount||0); s.projects.push(p);
    if(p.contact) s.contacts.add(p.contact);
    if(p.submitted){if(!s.firstSubmit||p.submitted<s.firstSubmit)s.firstSubmit=p.submitted;if(!s.lastSubmit||p.submitted>s.lastSubmit)s.lastSubmit=p.submitted;}
    if(WON_STATUSES.includes(p.status)){s.won++;s.wonValue+=(p.contractAmount||p.bidAmount||0);}
    else if(LOST_STATUSES.includes(p.status)){s.lost++;s.lostValue+=(p.bidAmount||0);}
    else{s.open++;s.openValue+=(p.bidAmount||0);}
  });
  return Array.from(map.values()).map(s=>({...s,contacts:Array.from(s.contacts),winRate:(s.won+s.lost)>0?s.won/(s.won+s.lost):null,avgBid:s.proposals?s.totalVolume/s.proposals:0}));
};

const DashboardView=({proposals,settings,gcStats,onSelectProposal,onSelectGC,onNavigate})=>{
  const filtered=useMemo(()=>settings.yearFilter==='All'?proposals:proposals.filter(p=>p.submitted&&p.submitted.startsWith(String(settings.yearFilter))),[proposals,settings.yearFilter]);
  const kpis=useMemo(()=>{
    const open=filtered.filter(p=>OPEN_STATUSES.includes(p.status));
    const won=filtered.filter(p=>WON_STATUSES.includes(p.status));
    const lost=filtered.filter(p=>LOST_STATUSES.includes(p.status));
    const overdue=open.filter(p=>(overdueDays(p,settings)||0)>0);
    const settled=won.length+lost.length;
    return{openCount:open.length,openValue:open.reduce((s,p)=>s+(p.bidAmount||0),0),awardedValue:won.reduce((s,p)=>s+(p.contractAmount||p.bidAmount||0),0),awardedCount:won.length,winRate:settled>0?won.length/settled:null,overdueCount:overdue.length,overdueValue:overdue.reduce((s,p)=>s+(p.bidAmount||0),0)};
  },[filtered,settings]);
  const topFollowUps=useMemo(()=>{
    const gcWR=new Map(gcStats.map(g=>[g.gc,g.winRate]));
    return filtered.filter(p=>OPEN_STATUSES.includes(p.status)).map(p=>({...p,_od:overdueDays(p,settings)||0,_score:followUpScore(p,settings,gcWR.get(p.gc))})).sort((a,b)=>b._score-a._score).slice(0,8);
  },[filtered,settings,gcStats]);
  const topGCs=useMemo(()=>[...gcStats].filter(g=>filtered.some(p=>p.gc===g.gc)).sort((a,b)=>b.openValue-a.openValue).slice(0,8),[gcStats,filtered]);
  const insights=useMemo(()=>{
    const out=[];
    if(kpis.overdueCount>0) out.push({severity:'critical',icon:'phone',title:`${kpis.overdueCount} follow-ups overdue · ${money(kpis.overdueValue,true)} at stake`,body:`Bids past SLA with no logged contact. Queue sorted by $ × days overdue × win-rate.`,action:'Open Follow-Up Queue',onAction:()=>onNavigate('followups')});
    const hwr=gcStats.filter(g=>g.winRate!==null&&g.winRate>=0.7&&g.openValue>50000).sort((a,b)=>b.openValue-a.openValue)[0];
    if(hwr) out.push({severity:'opp',icon:'target',title:`${hwr.gc} — ${pct(hwr.winRate)} win rate, ${money(hwr.openValue,true)} open`,body:`You win ${hwr.won}/${hwr.won+hwr.lost} bids with ${hwr.gc}. Push open bids hard.`,action:'View GC scorecard',onAction:()=>onSelectGC(hwr.gc)});
    const leak=gcStats.filter(g=>g.winRate!==null&&g.winRate<=0.1&&(g.won+g.lost)>=2&&g.openValue>50000).sort((a,b)=>b.openValue-a.openValue)[0];
    if(leak) out.push({severity:'warn',icon:'trendDown',title:`${leak.gc} — ${pct(leak.winRate)} win rate, ${money(leak.openValue,true)} still bidding`,body:`You've won ${leak.won} of ${leak.won+leak.lost} settled bids. Consider raising the bar.`,action:'View GC scorecard',onAction:()=>onSelectGC(leak.gc)});
    const wonNoCost=filtered.filter(p=>WON_STATUSES.includes(p.status)&&!p.estMaterial&&!p.estLabor);
    if(wonNoCost.length) out.push({severity:'warn',icon:'alertTri',title:`${wonNoCost.length} active jobs · no cost data entered`,body:`Margin tracking is blind without estimated material + labor. Enter line items in each project drawer.`,action:'View Active Jobs',onAction:()=>onNavigate('active')});
    return out;
  },[filtered,gcStats,kpis,settings,onNavigate,onSelectGC,onSelectProposal]);
  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <KPICard label="Open Pipeline" value={money(kpis.openValue,true)} sublabel={`${kpis.openCount} active bids`} accent="bronze" icon="flame" onClick={()=>onNavigate('pipeline')}/>
        <KPICard label="Awarded Value" value={money(kpis.awardedValue,true)} sublabel={`${kpis.awardedCount} projects awarded`} accent="green" icon="check2" onClick={()=>onNavigate('active')}/>
        <KPICard label="Follow-Ups Overdue" value={String(kpis.overdueCount)} sublabel={`${money(kpis.overdueValue,true)} at stake`} accent="rose" icon="phone" onClick={()=>onNavigate('followups')}/>
        <KPICard label="Win Rate" value={kpis.winRate!==null?pct(kpis.winRate):'—'} sublabel="of settled bids" accent="blue" icon="trendUp" onClick={()=>onNavigate('gcs')}/>
      </div>
      {insights.length>0&&<div><h2 className="font-serif text-xl text-stone-800 mb-3 flex items-center gap-2"><Ico n="zap" className="text-orange-700"/>What needs your attention</h2><div className="grid md:grid-cols-2 gap-3">{insights.map((ins,i)=><InsightCard key={i} {...ins}/>)}</div></div>}
      <div className="grid lg:grid-cols-3 gap-6">
        <div className="lg:col-span-2 bg-white border border-stone-200">
          <div className="flex items-center justify-between px-4 py-3 border-b border-stone-200"><h3 className="font-serif text-lg text-stone-800">Top Follow-Up Queue</h3><button onClick={()=>onNavigate('followups')} className="text-xs text-stone-500 hover:text-stone-900 inline-flex items-center gap-1">View all <Ico n="chevRight" size={12}/></button></div>
          <table className="w-full text-sm">
            <thead><tr className="bg-stone-50"><TH>Project</TH><TH>GC</TH><TH className="text-right">Bid</TH><TH>Status</TH><TH className="text-right">Overdue</TH></tr></thead>
            <tbody>
              {topFollowUps.map(p=>(
                <tr key={p.id} className="border-b border-stone-100 hover:bg-stone-50 cursor-pointer" onClick={()=>onSelectProposal(p.id)}>
                  <td className="px-3 py-2.5"><div className="font-medium text-stone-900 truncate">{p.project||'—'}</div><div className="text-xs text-stone-500">#{p.id}·{p.location||'—'}</div></td>

                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div className="bg-white border border-stone-200">
          <div className="flex items-center justify-between px-4 py-3 border-b border-stone-200"><h3 className="font-serif text-lg text-stone-800">Top GCs · Open</h3><button onClick={()=>onNavigate('gcs')} className="text-xs text-stone-500 hover:text-stone-900 inline-flex items-center gap-1">All <Ico n="chevRight" size={12}/></button></div>
          <div className="divide-y divide-stone-100">
            {topGCs.map((g,i)=>(
              <button key={g.gc} onClick={()=>onSelectGC(g.gc)} className="w-full text-left px-4 py-3 hover:bg-stone-50 flex items-center justify-between group">
                <div className="min-w-0 flex-1"><div className="flex items-baseline gap-2"><span className="text-stone-400 font-mono text-[10px]">{String(i+1).padStart(2,'0')}</span><span className="font-medium text-stone-900 truncate group-hover:text-orange-800">{g.gc}</span></div><div className="text-xs text-stone-500">{g.proposals} bids · WR {g.winRate!==null?pct(g.winRate):'—'}</div></div>
                <MoneyCell amount={g.openValue} compact className="font-semibold text-stone-900 ml-3 flex-shrink-0"/>
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>

/* ── Pipeline ─────────────────────────────────────────────── */
const PipelineView=({proposals,onSelectProposal,onSelectGC,settings})=>{
  const [search,setSearch]=useState('');
  const [statusF,setStatusF]=useState('all');
  const [gcF,setGcF]=useState('all');
  const [sortBy,setSortBy]=useState('submitted_desc');
  const allGCs=useMemo(()=>Array.from(new Set(proposals.map(p=>p.gc).filter(Boolean))).sort(),[proposals]);
  const filtered=useMemo(()=>{
    let out=proposals;
    if(settings.yearFilter!=='All') out=out.filter(p=>p.submitted&&p.submitted.startsWith(String(settings.yearFilter)));
    if(statusF==='open') out=out.filter(p=>OPEN_STATUSES.includes(p.status));
    else if(statusF==='awarded') out=out.filter(p=>WON_STATUSES.includes(p.status));
    else if(statusF==='lost') out=out.filter(p=>LOST_STATUSES.includes(p.status));
    else if(statusF!=='all') out=out.filter(p=>p.status===statusF);
    if(gcF!=='all') out=out.filter(p=>p.gc===gcF);
    if(search.trim()){const q=search.toLowerCase();out=out.filter(p=>(p.project||'').toLowerCase().includes(q)||(p.gc||'').toLowerCase().includes(q)||(p.location||'').toLowerCase().includes(q)||(p.contact||'').toLowerCase().includes(q)||String(p.id).includes(q));}
    const sorted=[...out];
    if(sortBy==='submitted_desc') sorted.sort((a,b)=>(b.submitted||'').localeCompare(a.submitted||''));
    else if(sortBy==='submitted_asc') sorted.sort((a,b)=>(a.submitted||'').localeCompare(b.submitted||''));
    else if(sortBy==='amount_desc') sorted.sort((a,b)=>(b.bidAmount||0)-(a.bidAmount||0));
    else if(sortBy==='amount_asc') sorted.sort((a,b)=>(a.bidAmount||0)-(b.bidAmount||0));
    else if(sortBy==='gc') sorted.sort((a,b)=>(a.gc||'').localeCompare(b.gc||''));
    else if(sortBy==='status') sorted.sort((a,b)=>(STATUS_CONFIG[a.status]?.order||99)-(STATUS_CONFIG[b.status]?.order||99));
    return sorted;
  },[proposals,search,statusF,gcF,sortBy,settings.yearFilter]);
  return (
    <div className="space-y-3">
      <div className="bg-white border border-stone-200 px-3 py-2 flex flex-wrap items-center gap-2">
        <div className="relative" style={{minWidth:'200px',flex:1}}>
          <Ico n="search" className="absolute left-2.5 top-1/2 -translate-y-1/2 text-stone-400"/>
          <input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search project, GC, location, contact, ID…" className="w-full pl-8 pr-3 py-1.5 text-sm border border-stone-200 bg-stone-50 focus:bg-white focus:outline-none focus:border-stone-400 rounded-sm"/>
        </div>
        <select value={statusF} onChange={e=>setStatusF(e.target.value)} className="text-sm border border-stone-200 bg-stone-50 px-2 py-1.5 rounded-sm focus:outline-none"><option value="all">All statuses</option><option value="open">Open</option><option value="awarded">Awarded</option><option value="lost">Lost/Dead</option>{ALL_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}</select>
        <select value={gcF} onChange={e=>setGcF(e.target.value)} className="text-sm border border-stone-200 bg-stone-50 px-2 py-1.5 rounded-sm focus:outline-none" style={{maxWidth:'180px'}}><option value="all">All GCs</option>{allGCs.map(g=><option key={g} value={g}>{g}</option>)}</select>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="text-sm border border-stone-200 bg-stone-50 px-2 py-1.5 rounded-sm focus:outline-none"><option value="submitted_desc">Newest first</option><option value="submitted_asc">Oldest first</option><option value="amount_desc">$ high→low</option><option value="amount_asc">$ low→high</option><option value="gc">GC A→Z</option><option value="status">Status</option></select>
        <div className="text-xs text-stone-600 ml-auto whitespace-nowrap"><span className="font-mono font-semibold">{filtered.length}</span> rows · <span className="font-mono font-semibold">{money(filtered.reduce((s,p)=>s+(p.bidAmount||0),0),true)}</span></div>
      </div>
      <div className="bg-white border border-stone-200 overflow-x-auto">
        <table style={{tableLayout:'fixed',width:'100%'}} className="text-sm">
          <colgroup><col style={{width:'5%'}}/><col style={{width:'25%'}}/><col style={{width:'18%'}}/><col style={{width:'13%'}}/><col style={{width:'11%'}}/><col style={{width:'11%'}}/><col style={{width:'10%'}}/><col style={{width:'7%'}}/></colgroup>

                <tr key={p.id} className="border-b border-stone-100 hover:bg-stone-50 cursor-pointer" onClick={()=>onSelectProposal(p.id)}>

/* ── Follow-Ups ───────────────────────────────────────────── */
const FollowUpsView=({proposals,settings,gcStats,onSelectProposal,onSelectGC,onMarkContacted})=>{
  const [filter,setFilter]=useState('overdue');
  const [logOpen,setLogOpen]=useState(null);
  const [logNote,setLogNote]=useState('');
  const logRef=useRef();
  const gcWR=useMemo(()=>new Map(gcStats.map(g=>[g.gc,g.winRate])),[gcStats]);
  const queue=useMemo(()=>{
    let pool=proposals.filter(p=>OPEN_STATUSES.includes(p.status)&&p.bidAmount>0);
    if(settings.yearFilter!=='All') pool=pool.filter(p=>p.submitted&&p.submitted.startsWith(String(settings.yearFilter)));
    pool=pool.map(p=>({...p,_od:overdueDays(p,settings)||0,_score:followUpScore(p,settings,gcWR.get(p.gc)),_gcWR:gcWR.get(p.gc)}));
    if(filter==='overdue') pool=pool.filter(p=>p._od>0);
    else if(filter==='large') pool=pool.filter(p=>p.bidAmount>=100000);
    else if(filter==='highWR') pool=pool.filter(p=>p._gcWR!==null&&p._gcWR>=0.5);
    return pool.sort((a,b)=>b._score-a._score);
  },[proposals,settings,filter,gcWR]);
  const openLog=(id,e)=>{e.stopPropagation();setLogOpen(id);setLogNote('');setTimeout(()=>logRef.current?.focus(),50);};
  const submitLog=(id)=>{onMarkContacted(id,logNote.trim());setLogOpen(null);setLogNote('');};
  return (
    <div className="space-y-4">
      <div className="bg-gradient-to-br from-rose-50 to-amber-50 border border-rose-200 px-5 py-4">
        <div className="flex items-start gap-3"><Ico n="phone" size={18} className="text-rose-700 mt-1"/>
          <div><h2 className="font-serif text-2xl text-stone-900">Today's Call Queue</h2><p className="text-sm text-stone-700 mt-1">{queue.length} {filter==='overdue'?'overdue follow-ups':'bids'} · <strong>{money(queue.reduce((s,p)=>s+(p.bidAmount||0),0),true)}</strong> on the line. Sorted by priority: <span className="font-mono text-xs">bid × overdue × win-rate</span>.</p></div>
        </div>
      </div>
      <div className="flex items-center gap-2 flex-wrap">
        {[['overdue','🔥 Overdue'],['all','All open'],['large','$100K+ only'],['highWR','High win-rate GCs']].map(([val,lbl])=>(
          <button key={val} onClick={()=>setFilter(val)} className={`px-3 py-1.5 text-sm rounded-sm border ${filter===val?'bg-stone-900 text-white border-stone-900':'bg-white border-stone-300 text-stone-700 hover:bg-stone-100'}`}>{lbl}</button>
        ))}
      </div>
      <div className="space-y-2">
        {queue.length===0&&<Empty icon="check2" title="Inbox zero" body="No items match this filter."/>}
        {queue.map(p=>(
          <div key={p.id} className="bg-white border border-stone-200 hover:border-stone-400 transition-colors">
            <div className="flex items-stretch">
              <button onClick={()=>onSelectProposal(p.id)} className="flex-1 text-left px-4 py-3 min-w-0">
                <div className="flex items-baseline justify-between mb-1">
                  <div className="flex items-baseline gap-2 min-w-0"><span className="font-mono text-stone-400 text-[10px]">#{p.id}</span><span className="font-medium text-stone-900 truncate">{p.project}</span></div>
                  <MoneyCell amount={p.bidAmount} className="text-base font-semibold text-stone-900 flex-shrink-0 ml-3"/>
                </div>
                <div className="flex items-center gap-3 text-sm text-stone-600 flex-wrap">
                  <span className="inline-flex items-center gap-1"><Ico n="building2" size={13} className="text-stone-400"/><span onClick={e=>{e.stopPropagation();onSelectGC(p.gc);}} className="hover:underline hover:text-orange-800 cursor-pointer">{p.gc}</span></span>
                  {p.contact&&<span className="inline-flex items-center gap-1"><Ico n="user" size={13} className="text-stone-400"/>{p.contact}</span>}
                  {p.phone&&<span className="inline-flex items-center gap-1 font-mono text-xs"><Ico n="phone" size={13} className="text-stone-400"/>{p.phone}</span>}
                  <StatusPill status={p.status} size="xs"/>
                  {p._od>0&&<span className="inline-flex items-center gap-1 text-rose-700 font-semibold text-xs"><Ico n="clock" size={13}/>{p._od}d overdue</span>}
                  {p._gcWR!==null&&<span className="text-xs text-stone-500">GC WR <span className={p._gcWR>=0.5?'text-emerald-700 font-semibold':'text-stone-700'}>{pct(p._gcWR)}</span></span>}
                </div>
                {p.notes&&<div className="text-xs text-stone-500 mt-1.5 line-clamp-1 italic">{p.notes.split('\n')[0]}</div>}
              </button>
              <button onClick={e=>openLog(p.id,e)} className={`px-4 border-l border-stone-200 transition-colors text-sm flex items-center gap-1.5 flex-shrink-0 ${logOpen===p.id?'bg-emerald-50 text-emerald-800':'hover:bg-emerald-50 hover:text-emerald-800 text-stone-600'}`}>
                <Ico n="check2" size={15}/><span className="hidden md:inline text-xs font-medium">Log Call</span>
              </button>
            </div>
            {logOpen===p.id&&(
              <div className="border-t border-emerald-200 bg-emerald-50 px-4 py-3 flex items-center gap-2" onClick={e=>e.stopPropagation()}>
                <Ico n="phone" size={15} className="text-emerald-700 flex-shrink-0"/>
                <input ref={logRef} value={logNote} onChange={e=>setLogNote(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')submitLog(p.id);if(e.key==='Escape')setLogOpen(null);}} placeholder="What happened? e.g. Left VM, emailed pricing, discussed scope… (Enter to save)" className="flex-1 px-3 py-1.5 text-sm border border-emerald-300 bg-white rounded-sm focus:outline-none focus:border-emerald-600"/>
                <button onClick={()=>submitLog(p.id)} className="px-3 py-1.5 text-sm bg-emerald-700 text-white rounded-sm hover:bg-emerald-800 flex-shrink-0">Save</button>
                <button onClick={()=>setLogOpen(null)} className="text-stone-500 hover:text-stone-700"><Ico n="x" size={15}/></button>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
};

/* ── GC Intel ─────────────────────────────────────────────── */
const GCIntelView=({gcStats,onSelectGC})=>{
  const [sortBy,setSortBy]=useState('volume');
  const [search,setSearch]=useState('');
  const ranked=useMemo(()=>{
    let out=[...gcStats].filter(g=>g.gc);
    if(search.trim()){const q=search.toLowerCase();out=out.filter(g=>g.gc.toLowerCase().includes(q));}
    if(sortBy==='volume') out.sort((a,b)=>b.totalVolume-a.totalVolume);
    else if(sortBy==='open') out.sort((a,b)=>b.openValue-a.openValue);
    else if(sortBy==='wr') out.sort((a,b)=>(b.winRate??-1)-(a.winRate??-1));
    else if(sortBy==='count') out.sort((a,b)=>b.proposals-a.proposals);
    else if(sortBy==='won') out.sort((a,b)=>b.wonValue-a.wonValue);
    return out;
  },[gcStats,sortBy,search]);
  const verdict=g=>{
    if(g.winRate===null) return{label:'Unproven',color:'text-stone-500'};
    if(g.winRate>=0.7&&(g.won+g.lost)>=2) return{label:'Chase hard',color:'text-emerald-700'};
    if(g.winRate>=0.4) return{label:'Active',color:'text-sky-700'};
    if(g.winRate<=0.1&&(g.won+g.lost)>=3) return{label:'Raise bar',color:'text-rose-700'};
    return{label:'Selective',color:'text-amber-700'};
  };
  return (
    <div className="space-y-3">
      <div className="bg-white border border-stone-200 px-3 py-2 flex items-center gap-2 flex-wrap">
        <div className="relative" style={{maxWidth:'300px',flex:1}}>
          <Ico n="search" className="absolute left-2.5 top-1/2 -translate-y-1/2 text-stone-400"/>
          <input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search GCs…" className="w-full pl-8 pr-3 py-1.5 text-sm border border-stone-200 bg-stone-50 focus:bg-white focus:outline-none focus:border-stone-400 rounded-sm"/>
        </div>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)} className="text-sm border border-stone-200 bg-stone-50 px-2 py-1.5 rounded-sm"><option value="volume">Total volume</option><option value="open">Open pipeline</option><option value="won">Won value</option><option value="wr">Win rate</option><option value="count">Bid count</option></select>
        <span className="text-xs text-stone-600 ml-auto"><span className="font-mono font-semibold">{ranked.length}</span> GCs</span>
      </div>
      <div className="bg-white border border-stone-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead><tr className="bg-stone-50"><TH>GC</TH><TH className="text-right"># Bids</TH><TH className="text-right">Total Vol.</TH><TH className="text-right">Open</TH><TH className="text-right">Won</TH><TH className="text-right">Lost</TH><TH className="text-right">Win Rate</TH><TH>Verdict</TH><TH>Last Bid</TH></tr></thead>
          <tbody>
            {ranked.map(g=>{const v=verdict(g);return(
              <tr key={g.gc} className="border-b border-stone-100 hover:bg-stone-50 cursor-pointer" onClick={()=>onSelectGC(g.gc)}>
                <td className="px-3 py-2.5"><div className="font-medium text-stone-900">{g.gc}</div><div className="text-[10px] text-stone-500">{g.contacts.length} contact{g.contacts.length!==1?'s':''}</div></td>
                <td className="px-3 py-2.5 text-right font-mono">{g.proposals}</td>
                <td className="px-3 py-2.5 text-right whitespace-nowrap"><MoneyCell amount={g.totalVolume} compact/></td>
                <td className="px-3 py-2.5 text-right whitespace-nowrap"><MoneyCell amount={g.openValue} compact className={g.openValue>0?'text-orange-800 font-semibold':'text-stone-400'}/></td>
                <td className="px-3 py-2.5 text-right whitespace-nowrap"><MoneyCell amount={g.wonValue} compact className={g.wonValue>0?'text-emerald-700 font-semibold':'text-stone-400'}/></td>
                <td className="px-3 py-2.5 text-right font-mono"><span className={g.lost>0?'text-rose-600':'text-stone-400'}>{g.lost}</span></td>
                <td className="px-3 py-2.5 text-right font-mono font-semibold">{g.winRate!==null?<span className={g.winRate>=0.5?'text-emerald-700':g.winRate>=0.25?'text-amber-700':'text-rose-700'}>{pct(g.winRate)}</span>:<span className="text-stone-400">—</span>}</td>
                <td className="px-3 py-2.5"><span className={`text-xs font-medium ${v.color}`}>{v.label}</span></td>
                <td className="px-3 py-2.5 text-xs text-stone-600 whitespace-nowrap">{formatDate(g.lastSubmit)}</td>
              </tr>
            );})}
          </tbody>
        </table>
      </div>
    </div>
  );
};

const GCDetailView=({gc,proposals,gcStats,onBack,onSelectProposal,settings})=>{
  const stats=gcStats.find(g=>g.gc===gc);
  const projects=useMemo(()=>{let p=proposals.filter(x=>x.gc===gc);if(settings.yearFilter!=='All')p=p.filter(x=>x.submitted&&x.submitted.startsWith(String(settings.yearFilter)));return p.sort((a,b)=>(b.submitted||'').localeCompare(a.submitted||''));},[proposals,gc,settings.yearFilter]);
  const contacts=useMemo(()=>{const m=new Map();proposals.filter(p=>p.gc===gc).forEach(p=>{if(!p.contact)return;if(!m.has(p.contact))m.set(p.contact,{name:p.contact,email:p.email,phone:p.phone,count:0,lastSeen:null});const c=m.get(p.contact);c.count++;if(p.email&&!c.email)c.email=p.email;if(p.phone&&!c.phone)c.phone=p.phone;if(p.submitted&&(!c.lastSeen||p.submitted>c.lastSeen))c.lastSeen=p.submitted;});return Array.from(m.values()).sort((a,b)=>(b.lastSeen||'').localeCompare(a.lastSeen||''));},[proposals,gc]);
  if(!stats) return <div><button onClick={onBack} className="text-sm text-stone-600 hover:text-stone-900 mb-4 inline-flex items-center gap-1"><Ico n="chevLeft" size={14}/>Back</button><Empty title="GC not found"/></div>;
  return (
    <div className="space-y-5">
      <button onClick={onBack} className="text-sm text-stone-600 hover:text-stone-900 inline-flex items-center gap-1"><Ico n="chevLeft" size={14}/>Back to GC list</button>
      <div className="border-b border-stone-300 pb-4"><div className="flex items-baseline justify-between flex-wrap gap-2"><h1 className="font-serif text-4xl text-stone-900">{gc}</h1><div className="text-sm text-stone-600">First bid {formatDate(stats.firstSubmit)} · Last bid {formatDate(stats.lastSubmit)}</div></div></div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <KPICard label="Total Bids" value={String(stats.proposals)} sublabel={`${money(stats.totalVolume,true)} lifetime`} accent="default"/>
        <KPICard label="Open Pipeline" value={money(stats.openValue,true)} sublabel={`${stats.open} active`} accent="bronze"/>
        <KPICard label="Won Value" value={money(stats.wonValue,true)} sublabel={`${stats.won} won · ${stats.lost} lost`} accent="green"/>
        <KPICard label="Win Rate" value={stats.winRate!==null?pct(stats.winRate):'—'} sublabel={`${stats.won+stats.lost} settled`} accent={stats.winRate>=0.5?'green':'rose'}/>
      </div>
      <div className="grid lg:grid-cols-3 gap-5">
        <div className="lg:col-span-2 bg-white border border-stone-200">
          <div className="px-4 py-3 border-b border-stone-200"><h3 className="font-serif text-lg text-stone-800">All projects with {gc}</h3></div>
          <table className="w-full text-sm"><thead><tr className="bg-stone-50"><TH>Project</TH><TH>Submitted</TH><TH className="text-right">Bid</TH><TH>Status</TH></tr></thead>
          <tbody>{projects.map(p=><tr key={p.id} className="border-b border-stone-100 hover:bg-stone-50 cursor-pointer" onClick={()=>onSelectProposal(p.id)}><td className="px-3 py-2"><div className="font-medium text-stone-900 truncate">{p.project}</div><div className="text-xs text-stone-500">#{p.id}·{p.location}</div></td><td className="px-3 py-2 text-stone-600 text-xs whitespace-nowrap">{formatDate(p.submitted)}</td><td className="px-3 py-2 text-right whitespace-nowrap"><MoneyCell amount={p.bidAmount}/></td><td className="px-3 py-2"><StatusPill status={p.status} size="xs"/></td></tr>)}</tbody>
          </table>
        </div>
        <div className="bg-white border border-stone-200">
          <div className="px-4 py-3 border-b border-stone-200"><h3 className="font-serif text-lg text-stone-800">Contacts ({contacts.length})</h3></div>
          <div className="divide-y divide-stone-100">{contacts.length===0&&<div className="px-4 py-6 text-sm text-stone-500">No contacts</div>}{contacts.map(c=><div key={c.name} className="px-4 py-3"><div className="font-medium text-stone-900 text-sm">{c.name}</div>{c.email&&<a href={`mailto:${c.email}`} className="text-xs text-sky-700 hover:underline block mt-0.5 truncate">{c.email}</a>}{c.phone&&<a href={`tel:${c.phone}`} className="text-xs text-stone-600 font-mono block mt-0.5">{c.phone}</a>}<div className="text-[10px] text-stone-400 mt-1">{c.count} project{c.count!==1?'s':''} · last {formatDate(c.lastSeen)}</div></div>)}</div>
        </div>
      </div>
    </div>
  );
};

/* ── Active Jobs ──────────────────────────────────────────── */
const ActiveJobsView=({proposals,onSelectProposal,onSelectGC,settings})=>{

    let p=proposals.filter(x=>WON_STATUSES.includes(x.status));

    return p.map(x=>({...x,_em:estMargin(x),_am:actMargin(x),_contract:x.contractAmount||x.bidAmount||0,_ec:(x.estMaterial||0)+(x.estLabor||0)+(x.estOther||0),_ac:(x.actMaterial||0)+(x.actLabor||0)+(x.actOther||0)})).sort((a,b)=>b._contract-a._contract);

        <div><h2 className="font-serif text-2xl text-stone-900">Active Jobs · Margin Watch</h2><p className="text-sm text-stone-700 mt-1">{jobs.length} awarded · <strong>{money(jobs.reduce((s,j)=>s+j._contract,0),true)}</strong> contract value{jobs.filter(j=>j._ec===0).length>0?<span className="text-rose-700 ml-2">· {jobs.filter(j=>j._ec===0).length} missing cost data</span>:null}</p></div>

        <table className="w-full text-sm">
          <thead><tr className="bg-stone-50"><TH>Project</TH><TH>GC</TH><TH className="text-right">Contract</TH><TH className="text-right">Est. Cost</TH><TH className="text-right">Actual Cost</TH><TH className="text-right">Est. Margin</TH><TH className="text-right">Act. Margin</TH><TH>Status</TH><TH>Health <span title="Based on actual margin vs your target and risk floor. No data = cost tracking not started." className="cursor-help">ⓘ</span></TH></tr></thead>
          <tbody>
            {jobs.length===0&&<tr><td colSpan={9}><Empty icon="check2" title="No awarded projects" body="Projects with Won / Active / Complete status appear here."/></td></tr>}

              else if(j._em!==null){if(j._em<settings.riskMarginFloor)health={label:'Est. at risk',color:'text-rose-700 bg-rose-50',icon:'alertTri'};else if(j._em>=settings.targetMargin)health={label:'Est. on target',color:'text-emerald-700 bg-emerald-50',icon:'check2'};else health={label:'Est. below',color:'text-amber-700 bg-amber-50',icon:'clock'};}

/* ── Line Items ───────────────────────────────────────────── */
const LineItemRow=({item,itemList,onUpdate,onDelete})=>{
  const listId=`fl-${item.id}`;
  const inp=(field,opts={})=>(
    <input type={opts.type||'text'} value={item[field]??''} onChange={e=>{const v=opts.type==='number'?(e.target.value?Number(e.target.value):null):e.target.value;const next={...item,[field]:v};if(['qty','estUnit','actUnit'].includes(field)){const qty=field==='qty'?Number(v)||0:Number(item.qty)||0;const eu=field==='estUnit'?Number(v)||0:Number(item.estUnit)||0;const au=field==='actUnit'?Number(v)||0:Number(item.actUnit)||0;next.estTotal=qty*eu||null;next.actTotal=qty*au||null;}onUpdate(next);}} className={`w-full px-1 py-0.5 text-xs bg-transparent border-0 hover:bg-stone-100 focus:bg-white rounded-sm focus:outline focus:outline-1 focus:outline-stone-400 ${opts.right?'text-right font-mono':''}`} placeholder={opts.ph||''} step={opts.type==='number'?'0.01':undefined} style={opts.type==='number'?{minWidth:'60px'}:undefined}/>
  );

// ── Calculation engine (exact match to Peter's Excel) ────────────
const calcEstimateItem = (item, taxRate, markupRate) => {
  const qty = Number(item.qty) || 0;
  const costPerUnit = Number(item.costPerUnit) || 0;
  const freight = Number(item.freight) || 0;
  const laborRate = Number(item.laborRate) || 0;
  const amount = qty * costPerUnit;
  const salesTax = amount * (taxRate || 0.07);
  const amsTotalCost = amount + salesTax + freight;
  const markup = amount * (markupRate || 0.20);
  const material = amsTotalCost + markup;
  const labor = qty * laborRate;
  const total = material + labor;
  let orderQty = qty;
  let orderUnit = item.unit || 'SF';
  if (item.sfPerCtn && Number(item.sfPerCtn) > 0 && qty > 0) {
    orderQty = Math.ceil(qty / Number(item.sfPerCtn));
    orderUnit = 'CTN';
  }
  return { amount, salesTax, amsTotalCost, markup, material, labor, total, orderQty, orderUnit };
};

                          taxRate={taxRate} markupRate={markupRate} suggestions={suggestions} isChild={true} showMath={showMath}/>
                      ))}
                    </React.Fragment>
                  ))}
                </tbody>
                {/* Section subtotal row */}
                <tfoot>
                  <tr className="bg-stone-800 text-white">
                    <td colSpan={13} className="px-3 py-1.5 text-right text-xs text-stone-400 uppercase tracking-widest">Section total</td>
                    {showMath && <td colSpan={5}></td>}
                    <td className="px-2 py-1.5 text-right font-mono font-bold">{money(sectionTotal)}</td>
                    <td colSpan={2}></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          )}
        </>
      )}
    </div>
  );
};

// ── Main Estimate view ────────────────────────────────────────────
const EstimateView = ({ proposal, estimate, estimateItems, onSaveEstimate, onAddItem, onUpdateItem, onDeleteItem, onAddVE, allEstimateItems }) => {
  const [showAddSection, setShowAddSection] = useState(false);
  const [addingAlternate, setAddingAlternate] = useState(false);
  const [headerExpanded, setHeaderExpanded] = useState(false);
  const [draftHeader, setDraftHeader] = useState(estimate);
  const hSave = () => onSaveEstimate(draftHeader);

  useEffect(() => { setDraftHeader(estimate); }, [estimate?.id]);

  // Auto-populate header from proposal
  useEffect(() => {
    if (estimate && !estimate.projectName && proposal) {
      const updated = { ...estimate,
        projectName: proposal.project||'', projectAddressLine1: proposal.location||'',
        gcName: proposal.gc||'', gcContactName: proposal.contact||'',
        gcContactEmail: proposal.email||'', gcContactPhone: proposal.phone||'',
        proposalNumber: String(proposal.id),
      };
      onSaveEstimate(updated);
    }
  }, [estimate?.id]);

  // Suggestion pools from history
  const suggestions = useMemo(() => {
    const s = { itemCodes: new Set(), sizes: new Set(), manufacturers: new Set(MANUFACTURERS), descriptions: new Set(), colors: new Set() };
    allEstimateItems.forEach(i => {
      if (i.itemCode) s.itemCodes.add(i.itemCode);
      if (i.size) s.sizes.add(i.size);
      if (i.manufacturer) s.manufacturers.add(i.manufacturer);
      if (i.description) s.descriptions.add(i.description);
      if (i.color) s.colors.add(i.color);
    });
    return { itemCodes:[...s.itemCodes].sort(), sizes:[...s.sizes].sort(), manufacturers:[...s.manufacturers].sort(), descriptions:[...s.descriptions].sort(), colors:[...s.colors].sort() };
  }, [allEstimateItems]);

  // Group items into sections
  const sections = useMemo(() => {
    const map = new Map();
    estimateItems.forEach(item => {
      const key = `${item.sectionCode||'_'}|${item.isAlternate?'A':'B'}`;
      if (!map.has(key)) map.set(key, { code: item.sectionCode||'', name: item.sectionName||'Uncategorized', isAlternate: !!item.isAlternate, items:[] });
      map.get(key).items.push(item);
    });
    return Array.from(map.values());
  }, [estimateItems]);

  const baseSections = sections.filter(s => !s.isAlternate);
  const altSections = sections.filter(s => s.isAlternate);

  // Totals
  const totals = useMemo(() => {
    const t = estimate?.taxRate||0.07, m = estimate?.markupRate||0.20;
    return estimateItems.reduce((acc, item) => {
      if (item.isVeAlternative) return acc;
      const c = calcEstimateItem(item, t, m);
      if (item.isAlternate) return { ...acc, alt: acc.alt + c.total };
      return { ...acc, base: acc.base + c.total };
    }, { base:0, alt:0 });
  }, [estimateItems, estimate?.taxRate, estimate?.markupRate]);

  const handleDeleteSection = (section, items) => {
    if (!window.confirm(`Delete "${section.name}" and its ${items.length} item${items.length!==1?'s':''}?`)) return;
    items.forEach(it => onDeleteItem(it.id));
  };

  if (!estimate) return <div className="text-center py-12 text-stone-500">Loading estimate…</div>;

  return (
    <div className="space-y-4">
      {/* Header bar */}
      <div className="bg-white border border-stone-200">
        <div className="px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 flex-wrap">
            <div className="flex items-center gap-2">
              <span className="text-xs text-stone-500 font-semibold">Proposal #</span>
              <input value={draftHeader?.proposalNumber||''} onChange={e=>setDraftHeader({...draftHeader,proposalNumber:e.target.value})} onBlur={hSave}
                className="w-20 px-2 py-1 text-xs font-mono bg-white border border-stone-300 rounded-sm focus:outline-none focus:border-stone-600"/>
            </div>
            <span className="text-xs text-stone-500">Tax: <strong>{pct(estimate.taxRate||0.07)}</strong></span>
            <span className="text-xs text-stone-500">Markup: <strong>{pct(estimate.markupRate||0.20)}</strong></span>
          </div>
          <button onClick={() => setHeaderExpanded(!headerExpanded)}
            className="text-xs text-stone-600 hover:text-stone-900 flex items-center gap-1 border border-stone-300 px-3 py-1 rounded-sm hover:bg-stone-100">
            <Ico n="edit3" size={11}/>{headerExpanded ? 'Close header' : 'Edit project / GC info'}
          </button>
        </div>
        {headerExpanded && (
          <div className="px-4 pb-4 border-t border-stone-100 pt-3 grid grid-cols-3 gap-3 bg-stone-50/50">
            {[
              ['Project name', 'projectName', 'text'],
              ['Address', 'projectAddressLine1', 'text'],
              ['City', 'projectCity', 'text'],
              ['GC / Client', 'gcName', 'text'],
              ['GC Contact', 'gcContactName', 'text'],
              ['GC Email', 'gcContactEmail', 'text'],
              ['GC Phone', 'gcContactPhone', 'text'],
              ['Plans dated', 'plansDated', 'date'],
              ['Addendum', 'addendum', 'text'],
              ['Architect', 'architectName', 'text'],
              ['Tax rate', 'taxRate', 'number'],
              ['Markup rate', 'markupRate', 'number'],
            ].map(([lbl, field, type]) => (
              <div key={field}>
                <div className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold mb-1">{lbl}</div>
                <input type={type} step={type==='number'?'0.001':undefined}
                  value={draftHeader?.[field]||''} onChange={e=>setDraftHeader({...draftHeader,[field]:type==='number'?Number(e.target.value):e.target.value})}
                  onBlur={hSave}
                  className="w-full px-2 py-1 text-xs border border-stone-300 rounded-sm bg-white focus:outline-none focus:border-stone-600"/>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Base bid sections */}
      {baseSections.length === 0 && altSections.length === 0 ? (
        <div className="bg-white border-2 border-dashed border-stone-300 p-10 text-center">
          <div className="text-4xl mb-3">📋</div>
          <h3 className="font-serif text-xl text-stone-700 mb-2">Start your estimate</h3>
          <p className="text-sm text-stone-500 mb-5">Add a section for each flooring type in this project.<br/>Each section groups related line items together.</p>
          <button onClick={() => { setAddingAlternate(false); setShowAddSection(true); }}
            className="bg-stone-900 text-white px-5 py-2.5 rounded-sm hover:bg-stone-800 text-sm font-medium flex items-center gap-2 mx-auto">
            <Ico n="plus" size={14}/>Add First Section
          </button>
        </div>
      ) : (
        <>
          {baseSections.map(section => (
            <EstimateSection key={`${section.code}-base`} section={section} items={section.items}
              onUpdate={onUpdateItem} onDelete={onDeleteItem} onAddItem={onAddItem} onAddVE={onAddVE}
              taxRate={estimate.taxRate||0.07} markupRate={estimate.markupRate||0.20}
              suggestions={suggestions} onDeleteSection={handleDeleteSection}/>
          ))}

          {/* Alternates */}
          {altSections.length > 0 && (
            <div className="mt-2 mb-1 px-3 py-2 bg-amber-50 border border-amber-200 text-amber-900 text-sm font-serif flex items-center gap-2">
              <span>⚡</span> ALTERNATES — Owner selects one or more below
            </div>
          )}
          {altSections.map(section => (
            <EstimateSection key={`${section.code}-alt`} section={section} items={section.items}
              onUpdate={onUpdateItem} onDelete={onDeleteItem} onAddItem={onAddItem} onAddVE={onAddVE}
              taxRate={estimate.taxRate||0.07} markupRate={estimate.markupRate||0.20}
              suggestions={suggestions} onDeleteSection={handleDeleteSection}/>
          ))}

          {/* Add more section buttons */}
          <div className="flex items-center gap-2">
            <button onClick={() => { setAddingAlternate(false); setShowAddSection(true); }}
              className="text-sm border border-stone-300 bg-white text-stone-700 px-3 py-1.5 rounded-sm hover:bg-stone-100 flex items-center gap-1.5">
              <Ico n="plus" size={12}/>Add Section
            </button>
            <button onClick={() => { setAddingAlternate(true); setShowAddSection(true); }}
              className="text-sm border border-amber-400 bg-amber-50 text-amber-900 px-3 py-1.5 rounded-sm hover:bg-amber-100 flex items-center gap-1.5">
              <Ico n="plus" size={12}/>Add Alternate
            </button>
          </div>
        </>
      )}

      {/* Grand total sticky bar */}
      {(totals.base > 0 || totals.alt > 0) && (
        <div className="bg-stone-900 text-white p-5 grid grid-cols-3 gap-4 text-center sticky bottom-0 shadow-2xl">
          <div>
            <div className="text-[10px] uppercase tracking-widest text-stone-400 mb-1">Base Bid</div>
            <div className="font-serif text-3xl">{money(totals.base, true)}</div>
          </div>
          <div>
            <div className="text-[10px] uppercase tracking-widest text-stone-400 mb-1">Alternates</div>
            <div className="font-serif text-3xl text-amber-300">{totals.alt > 0 ? money(totals.alt, true) : '—'}</div>
          </div>
          <div>
            <div className="text-[10px] uppercase tracking-widest text-stone-400 mb-1">Grand Total</div>
            <div className="font-serif text-3xl text-emerald-300">{money(totals.base + totals.alt, true)}</div>
          </div>
        </div>
      )}

      {/* Display mode legend — compact */}
      <div className="text-[11px] text-stone-500 flex items-center gap-4 px-1">
        <span className="font-semibold text-stone-700">DM = Proposal display:</span>
        <span><span className="bg-stone-100 text-stone-700 font-bold px-1 rounded-sm">F</span> Full detail</span>
        <span><span className="bg-sky-100 text-sky-800 font-bold px-1 rounded-sm">T</span> Total only (hides mat/labor split)</span>
        <span><span className="bg-amber-100 text-amber-800 font-bold px-1 rounded-sm">L</span> Lump sum (hides quantities)</span>
      </div>

      {showAddSection && (
        <AddSectionModal
          onAdd={onAddItem}
          onClose={() => setShowAddSection(false)}
          isAlternate={addingAlternate}
        />
      )}
    </div>
  );
};


const Fld=({label,value,edit,type='text',onChange,render})=>(
  <div><div className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold mb-1">{label}</div>
  {edit?<input type={type} value={value??''} onChange={e=>onChange(e.target.value)} className="w-full px-2 py-1 text-sm border border-stone-300 bg-white rounded-sm focus:outline-none focus:border-stone-600"/>:<div className="text-sm text-stone-900">{render?render(value):(value||'—')}</div>}
  </div>
);
const FldSel=({label,value,edit,options,onChange,render})=>(
  <div><div className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold mb-1">{label}</div>
  {edit?<select value={value||''} onChange={e=>onChange(e.target.value)} className="w-full px-2 py-1 text-sm border border-stone-300 bg-white rounded-sm focus:outline-none focus:border-stone-600">{options.map(o=><option key={o} value={o}>{o}</option>)}</select>:<div className="text-sm text-stone-900">{render?render(value):(value||'—')}</div>}
  </div>
);

const ProjectDrawer=({proposal,lineItems,onClose,onSave,onAddLineItem,onUpdateLineItem,onDeleteLineItem,onAddNote,onSelectGC,estimate,estimateItems,onSaveEstimate,onAddEstimateItem,onUpdateEstimateItem,onDeleteEstimateItem,onAddVEAlternative,allEstimateItems,suppliers,installers,allGCs,gcs})=>{
  const [edit,setEdit]=useState(false);
  const [draft,setDraft]=useState(proposal);
  const [noteText,setNoteText]=useState('');
  const [activeTab,setActiveTab]=useState('details');
  useEffect(()=>{setDraft(proposal);setEdit(false);setActiveTab('details');},[proposal]);
  if(!proposal) return null;
  const save=()=>{onSave(draft);setEdit(false);};
  const materials=lineItems.filter(l=>l.type==='Material');
  const labor=lineItems.filter(l=>l.type==='Labor');
  const other=lineItems.filter(l=>l.type==='Other');
  const sumCol=(items,col)=>items.reduce((s,l)=>s+(Number(l[col])||0),0);
  const estTotal=sumCol(lineItems,'estTotal');
  const actTotal=sumCol(lineItems,'actTotal');
  const contract=draft.contractAmount||draft.bidAmount||0;
  const _em=estTotal>0?(contract-estTotal)/contract:null;
  const _am=actTotal>0?(contract-actTotal)/contract:null;
  // Calculate estimate total to show on bid card
  const estimateItemsForThis=estimateItems||[];
  const estimateBidTotal=estimateItemsForThis.reduce((s,it)=>{
    if(it.isVeAlternative||it.isAlternate) return s;
    const c=calcEstimateItem(it,estimate?.taxRate||0.07,estimate?.markupRate||0.20);
    return s+c.total;
  },0);
  return (
    <>
      {activeTab !== 'estimate' && <div className="fixed inset-0 bg-stone-900/30 z-40" onClick={onClose}/>}
      {activeTab === 'estimate' && <div className="fixed inset-0 bg-stone-900/60 z-40"/>}
      <aside className={`fixed top-0 right-0 bottom-0 bg-stone-50 z-50 border-l border-stone-300 shadow-2xl ${activeTab==='estimate' ? 'w-full overflow-hidden flex flex-col' : 'overflow-y-auto'}`} style={activeTab!=='estimate'?{width:'min(760px,100vw)'}:{}}>
        <div className="sticky top-0 z-10 bg-white border-b border-stone-200 px-5 py-3 flex items-center justify-between flex-shrink-0">
          <div className="flex items-center gap-3 min-w-0">
            <button onClick={onClose} className="text-stone-500 hover:text-stone-900 flex-shrink-0"><Ico n="x" size={18}/></button>
            <div className="min-w-0">
              <div className="text-xs text-stone-500 font-mono">#{proposal.id}</div>
              <div className="font-serif text-xl text-stone-900 truncate">{proposal.project||'Untitled'}</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            {activeTab !== 'estimate' && <>
              {!edit?<button onClick={()=>setEdit(true)} className="text-sm bg-stone-900 text-white px-3 py-1.5 rounded-sm hover:bg-stone-800 flex items-center gap-1.5"><Ico n="edit3" size={13}/>Edit</button>:
              <><button onClick={()=>{setDraft(proposal);setEdit(false);}} className="text-sm px-3 py-1.5 rounded-sm border border-stone-300 hover:bg-stone-100">Cancel</button>
              <button onClick={save} className="text-sm bg-emerald-700 text-white px-3 py-1.5 rounded-sm hover:bg-emerald-800 flex items-center gap-1.5"><Ico n="save" size={13}/>Save</button></>}
            </>}
            {activeTab === 'estimate' && (
              <span className="text-xs text-stone-500 italic">Full-screen estimating mode — click × to close</span>
            )}
          </div>
        </div>
        {/* Tab navigation */}
        <div className="border-b border-stone-200 bg-white px-3 pt-2 flex items-center gap-1 sticky top-0 z-10 flex-shrink-0">
          <button onClick={()=>setActiveTab('details')} className={`text-xs px-3 py-1.5 rounded-t-sm border-b-2 transition-colors ${activeTab==='details'?'border-stone-900 text-stone-900 font-semibold':'border-transparent text-stone-500 hover:text-stone-800'}`}>
            <Ico n="building2" size={11} className="inline mr-1"/>Project Details
          </button>
          <button onClick={()=>setActiveTab('estimate')} className={`text-xs px-3 py-1.5 rounded-t-sm border-b-2 transition-colors ${activeTab==='estimate'?'border-orange-800 text-orange-800 font-semibold':'border-transparent text-stone-500 hover:text-stone-800'}`}>
            <Ico n="zap" size={11} className="inline mr-1"/>Estimate / Bidsheet
            {estimateItemsForThis.length > 0 && <span className="ml-1 text-[10px] bg-stone-200 text-stone-700 px-1.5 py-0.5 rounded-full font-bold">{estimateItemsForThis.length}</span>}
          </button>
          <button onClick={()=>setActiveTab('execution')} className={`text-xs px-3 py-1.5 rounded-t-sm border-b-2 transition-colors ${activeTab==='execution'?'border-stone-900 text-stone-900 font-semibold':'border-transparent text-stone-500 hover:text-stone-800'}`}>
            <Ico n="flame" size={11} className="inline mr-1"/>Execution / Actuals
          </button>
          {activeTab==='estimate' && (
            <div className="ml-auto flex items-center gap-3 pb-1">
              <span className="font-serif text-sm text-stone-700 truncate max-w-xs">{proposal.project}</span>
              <span className="text-xs text-stone-500 font-mono">#{proposal.id}</span>
              <span className="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-sm font-semibold font-mono">
                {money(estimateBidTotal||0, true)} base bid
              </span>
            </div>
          )}
        </div>
        <div className={activeTab==='estimate' ? 'flex-1 overflow-y-auto p-5' : 'p-5 space-y-5'}>
          {activeTab==='details' && <>
          <div className="grid grid-cols-4 gap-3">
            {[['Bid (Estimate)',money(estimateBidTotal||contract,true),null],['Contract',money(contract,true),null],['Est. Margin',_em!==null?pct(_em,1):'—',_em],['Actual Margin',_am!==null?pct(_am,1):'—',_am]].map(([lbl,val,m])=>(
              <div key={lbl} className="bg-white border border-stone-200 p-3"><div className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold">{lbl}</div><div className={`font-serif text-2xl mt-1 ${m===null?'text-stone-400':m<0.05?'text-rose-700':m>=0.18?'text-emerald-700':'text-amber-700'}`}>{val}</div></div>
            ))}
          </div>
          <section className="bg-white border border-stone-200">
            <div className="px-4 py-2.5 border-b border-stone-200 bg-stone-50"><h3 className="font-serif text-base text-stone-800">Project details</h3></div>
            <div className="p-4 grid grid-cols-2 gap-x-4 gap-y-3 text-sm">
              <Fld label="Project name" value={draft.project} edit={edit} onChange={v=>setDraft({...draft,project:v})}/>
              <Fld label="Location" value={draft.location} edit={edit} onChange={v=>setDraft({...draft,location:v})}/>
              <Fld label="GC / Client" value={draft.gc} edit={edit} onChange={v=>setDraft({...draft,gc:v})} render={v=>v?<button onClick={()=>onSelectGC(v)} className="text-stone-900 hover:text-orange-800 hover:underline text-left">{v}</button>:'—'}/>
              <Fld label="Contact" value={draft.contact} edit={edit} onChange={v=>setDraft({...draft,contact:v})}/>
              <Fld label="Email" value={draft.email} edit={edit} onChange={v=>setDraft({...draft,email:v})} render={v=>v?<a href={`mailto:${v}`} className="text-sky-700 hover:underline">{v}</a>:'—'}/>
              <Fld label="Phone" value={draft.phone} edit={edit} onChange={v=>setDraft({...draft,phone:v})} render={v=>v?<a href={`tel:${v}`} className="text-stone-900 font-mono">{v}</a>:'—'}/>
              <Fld label="Submitted" value={draft.submitted} edit={edit} type="date" onChange={v=>setDraft({...draft,submitted:v})} render={formatDate}/>
              <FldSel label="Status" value={draft.status} edit={edit} options={ALL_STATUSES} onChange={v=>setDraft({...draft,status:v})} render={v=><StatusPill status={v}/>}/>
              <Fld label="Bid Amount" value={draft.bidAmount} edit={edit} type="number" onChange={v=>setDraft({...draft,bidAmount:v?Number(v):null})} render={money}/>
              <Fld label="Contract Amount" value={draft.contractAmount} edit={edit} type="number" onChange={v=>setDraft({...draft,contractAmount:v?Number(v):null})} render={money}/>
              <Fld label="Owner" value={draft.owner} edit={edit} onChange={v=>setDraft({...draft,owner:v})}/>
              <Fld label="SharePoint / Folder" value={draft.sharepoint||''} edit={edit} onChange={v=>setDraft({...draft,sharepoint:v})} render={v=>v?<a href={v} target="_blank" rel="noreferrer" className="text-sky-700 hover:underline inline-flex items-center gap-1">Open <Ico n="extLink" size={11}/></a>:'—'}/>
            </div>
          </section>
          <section className="bg-white border border-stone-200">
            <div className="px-4 py-2.5 border-b border-stone-200 bg-stone-50"><h3 className="font-serif text-base text-stone-800">Activity & notes</h3></div>
            <div className="p-4 space-y-3">
              <div className="flex gap-2">
                <input value={noteText} onChange={e=>setNoteText(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&noteText.trim()){onAddNote(proposal.id,noteText.trim());setNoteText('');}}} placeholder="Add a note — Enter to save with timestamp…" className="flex-1 px-3 py-1.5 text-sm border border-stone-200 bg-stone-50 focus:bg-white focus:outline-none focus:border-stone-400 rounded-sm"/>
                <button onClick={()=>{if(noteText.trim()){onAddNote(proposal.id,noteText.trim());setNoteText('');}}} className="text-sm bg-stone-900 text-white px-3 rounded-sm hover:bg-stone-800">Add</button>
              </div>
              {proposal.notes&&<div className="text-sm bg-stone-50 border border-stone-200 p-3 whitespace-pre-wrap text-stone-700 max-h-60 overflow-auto">{proposal.notes}</div>}
            </div>
          </section>
          </>}
          {activeTab==='estimate' && <EstimateView
            proposal={proposal}
            estimate={estimate}
            estimateItems={estimateItemsForThis}
            allEstimateItems={allEstimateItems||[]}
            onSaveEstimate={onSaveEstimate}
            onAddItem={onAddEstimateItem}
            onUpdateItem={onUpdateEstimateItem}
            onDeleteItem={onDeleteEstimateItem}
            onAddVE={onAddVEAlternative}
            suppliers={suppliers||[]}
            installers={installers||[]}
            allGCs={allGCs||[]}
            gcs={gcs||[]}
          />}
          {activeTab==='execution' && <div className="space-y-5">
            <div className="bg-amber-50 border border-amber-300 px-4 py-3 text-sm text-amber-900">
              <strong>Execution / Actuals tab</strong> — used after the project is awarded.
              Track real material costs, real labor costs, and procurement status here.
              The Estimate tab is the bid; this is what actually happened.
            </div>
            <LineItemSection title="Materials" type="Material" items={materials} onAdd={()=>onAddLineItem(proposal.id,'Material')} onUpdate={onUpdateLineItem} onDelete={onDeleteLineItem}/>
            <LineItemSection title="Labor" type="Labor" items={labor} onAdd={()=>onAddLineItem(proposal.id,'Labor')} onUpdate={onUpdateLineItem} onDelete={onDeleteLineItem}/>
            <LineItemSection title="Other costs" type="Other" items={other} onAdd={()=>onAddLineItem(proposal.id,'Other')} onUpdate={onUpdateLineItem} onDelete={onDeleteLineItem}/>
            {lineItems.length>0&&<div className="bg-stone-900 text-white p-4 grid grid-cols-3 gap-4 text-center">
              {[['Estimated',estTotal],['Actual',actTotal],['Variance',actTotal>0&&estTotal>0?actTotal-estTotal:null]].map(([lbl,val])=>(
                <div key={lbl}><div className="text-xs text-stone-400 uppercase tracking-widest">{lbl}</div><div className={`font-serif text-2xl mt-1 ${lbl==='Variance'?val>0?'text-rose-400':val<0?'text-emerald-400':'text-stone-500':''}`}>{val!==null?money(val,true):'—'}</div></div>
              ))}
            </div>}
          </div>}
        </div>
      </aside>
    </>
  );
};

/* ── New Project Modal ────────────────────────────────────── */
const NewProjectModal=({onClose,onSave,allGCs,proposals})=>{

  const [draft,setDraft]=useState({project:'',location:'',gc:'',contact:'',email:'',phone:'',submitted:todayStr(),bidAmount:'',status:'Lead',owner:'Paul',notes:''});
  const [gcQuery,setGcQuery]=useState('');
  const [showList,setShowList]=useState(false);
  const [dupWarn,setDupWarn]=useState(null);
  const filteredGCs=useMemo(()=>{if(!gcQuery.trim())return allGCs.slice(0,10);const q=gcQuery.toLowerCase();return allGCs.filter(g=>g.toLowerCase().includes(q)).slice(0,10);},[gcQuery,allGCs]);
  const checkDup=(proj,gc)=>{const key=`${proj.toLowerCase().trim()}|${gc.toLowerCase().trim()}`;const ex=proposals.find(p=>`${(p.project||'').toLowerCase().trim()}|${(p.gc||'').toLowerCase().trim()}`===key);setDupWarn(ex?`"${ex.project}" with ${ex.gc} already exists as #${ex.id}`:null);};
  const set=(k,v)=>{const n={...draft,[k]:v};setDraft(n);if(k==='project'||k==='gc')checkDup(k==='project'?v:draft.project,k==='gc'?v:draft.gc);};
  const submit=()=>{
    if(!draft.project.trim()&&!draft.gc.trim()) return;
    const isLead=draft.status==='Lead';
    const leadCount=proposals.filter(p=>typeof p.id==='string'&&p.id.startsWith('L')).length;
    const id=isLead?`L${String(leadCount+1).padStart(3,'0')}`:maxNumId+1;
    onSave({id,project:draft.project.trim(),location:draft.location.trim(),gc:draft.gc.trim(),contact:draft.contact.trim(),email:draft.email.trim(),phone:draft.phone.trim(),submitted:draft.submitted||todayStr(),bidAmount:parseFloat(String(draft.bidAmount).replace(/[$,]/g,''))||0,contractAmount:null,status:draft.status,owner:draft.owner||'Paul',notes:draft.notes.trim(),retainage:0.1,estMaterial:null,estLabor:null,estOther:null,actMaterial:null,actLabor:null,actOther:null});
    onClose();
  };
  return (
    <>
      <div className="fixed inset-0 bg-stone-900/40 z-50" onClick={onClose}/>
      <div className="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 bg-white border border-stone-300 shadow-2xl w-full max-w-xl" style={{maxHeight:'90vh',overflowY:'auto'}}>
        <div className="sticky top-0 bg-white border-b border-stone-200 px-5 py-3 flex items-center justify-between"><h2 className="font-serif text-xl text-stone-900">Add New Project</h2><button onClick={onClose}><Ico n="x" size={18} className="text-stone-500 hover:text-stone-900"/></button></div>
        <div className="p-5 space-y-4">
          {dupWarn&&<div className="bg-amber-50 border border-amber-300 text-amber-900 px-3 py-2 text-sm flex items-start gap-2"><Ico n="alertTri" size={15} className="mt-0.5 flex-shrink-0"/>{dupWarn}</div>}
          <div className="grid grid-cols-2 gap-3">
            <div className="col-span-2"><label className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold block mb-1">Project Name</label><input value={draft.project} onChange={e=>set('project',e.target.value)} placeholder="e.g. Factory Town Apartments" className="w-full px-3 py-2 text-sm border border-stone-300 rounded-sm focus:outline-none focus:border-stone-600"/></div>
            <div className="col-span-2 relative"><label className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold block mb-1">GC / Client</label>
              <input value={gcQuery||draft.gc} onChange={e=>{setGcQuery(e.target.value);set('gc',e.target.value);setShowList(true);}} onFocus={()=>setShowList(true)} onBlur={()=>setTimeout(()=>setShowList(false),150)} placeholder="Start typing GC name…" className="w-full px-3 py-2 text-sm border border-stone-300 rounded-sm focus:outline-none focus:border-stone-600"/>
              {showList&&filteredGCs.length>0&&<div className="absolute z-10 top-full left-0 right-0 bg-white border border-stone-300 shadow-lg max-h-48 overflow-y-auto">
                {filteredGCs.map(g=><button key={g} onMouseDown={()=>{set('gc',g);setGcQuery('');setShowList(false);}} className="w-full text-left px-3 py-2 text-sm hover:bg-stone-100 border-b border-stone-100 last:border-0">{g}</button>)}
                {gcQuery.trim()&&!allGCs.includes(gcQuery.trim())&&<button onMouseDown={()=>{set('gc',gcQuery.trim());setShowList(false);}} className="w-full text-left px-3 py-2 text-sm bg-stone-50 text-stone-600 hover:bg-stone-100 italic">+ Add new: "{gcQuery.trim()}"</button>}
              </div>}
            </div>
            <div><label className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold block mb-1">Status</label><select value={draft.status} onChange={e=>set('status',e.target.value)} className="w-full px-3 py-2 text-sm border border-stone-300 rounded-sm focus:outline-none focus:border-stone-600">{ALL_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
            <div><label className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold block mb-1">Bid Amount</label><input value={draft.bidAmount} onChange={e=>set('bidAmount',e.target.value)} placeholder="0" className="w-full px-3 py-2 text-sm border border-stone-300 rounded-sm focus:outline-none focus:border-stone-600"/></div>
            <div><label className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold block mb-1">Location</label><input value={draft.location} onChange={e=>set('location',e.target.value)} placeholder="City, State" className="w-full px-3 py-2 text-sm border border-stone-300 rounded-sm focus:outline-none focus:border-stone-600"/></div>
            <div><label className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold block mb-1">Date</label><input type="date" value={draft.submitted} onChange={e=>set('submitted',e.target.value)} className="w-full px-3 py-2 text-sm border border-stone-300 rounded-sm focus:outline-none focus:border-stone-600"/></div>
            <div><label className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold block mb-1">Contact Name</label><input value={draft.contact} onChange={e=>set('contact',e.target.value)} className="w-full px-3 py-2 text-sm border border-stone-300 rounded-sm focus:outline-none focus:border-stone-600"/></div>
            <div><label className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold block mb-1">Phone</label><input value={draft.phone} onChange={e=>set('phone',e.target.value)} className="w-full px-3 py-2 text-sm border border-stone-300 rounded-sm focus:outline-none focus:border-stone-600"/></div>
            <div className="col-span-2"><label className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold block mb-1">Email</label><input value={draft.email} onChange={e=>set('email',e.target.value)} className="w-full px-3 py-2 text-sm border border-stone-300 rounded-sm focus:outline-none focus:border-stone-600"/></div>
            <div className="col-span-2"><label className="text-[10px] uppercase tracking-widest text-stone-500 font-semibold block mb-1">Notes</label><textarea value={draft.notes} onChange={e=>set('notes',e.target.value)} rows={2} className="w-full px-3 py-2 text-sm border border-stone-300 rounded-sm focus:outline-none focus:border-stone-600 resize-none"/></div>
          </div>
          <div className="text-[10px] text-stone-500 bg-stone-50 px-3 py-2 border border-stone-200">{draft.status==='Lead'?'Lead status → ID assigned as L001, L002… Update to a real proposal # once it becomes an active bid.':`Will be assigned ID #${maxNumId+1}`}</div>
        </div>
        <div className="sticky bottom-0 bg-white border-t border-stone-200 px-5 py-3 flex justify-end gap-2">
          <button onClick={onClose} className="px-4 py-2 text-sm border border-stone-300 rounded-sm hover:bg-stone-100">Cancel</button>
          <button onClick={submit} disabled={!draft.project.trim()&&!draft.gc.trim()} className="px-4 py-2 text-sm bg-stone-900 text-white rounded-sm hover:bg-stone-800 disabled:opacity-40 flex items-center gap-1.5"><Ico n="plus" size={14}/>Add Project</button>
        </div>
      </div>
    </>
  );
};

          <button onClick={()=>fileRef.current?.click()} className="inline-flex items-center gap-2 bg-stone-900 text-white px-4 py-2 rounded-sm hover:bg-stone-800 text-sm"><Ico n="upload" size={14}/>Import Excel (bulk)</button>
          <button onClick={onExport} className="inline-flex items-center gap-2 bg-white border border-stone-300 text-stone-900 px-4 py-2 rounded-sm hover:bg-stone-100 text-sm"><Ico n="download" size={14}/>Export Everything to Excel</button>
