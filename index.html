  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; }

<body class="bg-stone-100 min-h-screen">
<div id="root"></div>
<div id="gate" style="display:flex;position:fixed;inset:0;background:#1c1917;z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#292524;border:1px solid #44403c;padding:40px;width:100%;max-width:360px;text-align:center;">
    <div style="font-family:'Instrument Serif',Georgia,serif;font-size:28px;color:#fafaf9;margin-bottom:6px;">AMS Floors</div>
    <div style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:#78716c;margin-bottom:28px;">Command Center</div>
    <input id="pw-input" type="password" placeholder="Enter password" style="width:100%;padding:10px 14px;font-size:14px;background:#1c1917;border:1px solid #57534e;color:#fafaf9;outline:none;box-sizing:border-box;margin-bottom:10px;" onkeydown="if(event.key==='Enter')checkPW()" />
    <div id="pw-err" style="color:#f87171;font-size:12px;min-height:18px;margin-bottom:10px;"></div>
    <button onclick="checkPW()" style="width:100%;padding:10px;background:#9a3412;color:white;border:none;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:0.05em;">Enter</button>
  </div>
</div>
<script>
  const PW = 'Sailor@22';
  const SK = 'ams_auth';
  function checkPW(){
    const v = document.getElementById('pw-input').value;
    if(v === PW){ sessionStorage.setItem(SK,'1'); document.getElementById('gate').style.display='none'; }
    else{ document.getElementById('pw-err').textContent='Incorrect password'; document.getElementById('pw-input').value=''; document.getElementById('pw-input').focus(); }
  }
  // Check on load
  if(sessionStorage.getItem(SK)!=='1'){
    document.getElementById('gate').style.display='flex';
    setTimeout(()=>document.getElementById('pw-input').focus(),100);
  } else {
    document.getElementById('gate').style.display='none';
  }
</script>

const generateProposalHTML = (estimate, items, proposalNotes) => {
  const tax=estimate.taxRate||0.07, mup=estimate.markupRate||0.20;
  const baseItems=items.filter(i=>!i.isAlternate&&!i.isVeAlternative);
  const altGroups=new Map();
  items.filter(i=>i.isAlternate&&!i.isVeAlternative).forEach(i=>{
    const k=i.alternateGroupName||i.sectionName||'Alternate';
    if(!altGroups.has(k))altGroups.set(k,[]);
    altGroups.get(k).push(i);
  });
  const sections=new Map();
  baseItems.forEach(i=>{
    const k=i.sectionName||'General';
    if(!sections.has(k))sections.set(k,[]);
    sections.get(k).push(i);
  });
  const totalMat=baseItems.reduce((s,i)=>s+calcItem(i,tax,mup).material,0);
  const totalLab=baseItems.reduce((s,i)=>s+calcItem(i,tax,mup).labor,0);
  const grandTotal=totalMat+totalLab;
  const renderLine=(item)=>{
    const c=calcItem(item,tax,mup);
    const dm=item.displayMode||'full';
    if(dm==='lump_sum') return `<tr><td colspan="4" style="padding:4px 8px;font-size:11px;">${item.itemCode?`<strong>${item.itemCode}</strong> `:''} ${item.description||''} ${item.color?`<em>${item.color}</em>`:''}</td><td style="padding:4px 8px;text-align:right;font-weight:600;">${money(c.total)}</td></tr>`;
    if(dm==='total_only') return `<tr><td style="padding:4px 8px;font-size:11px;">${item.itemCode?`<strong>${item.itemCode}</strong>`:''}</td><td style="padding:4px 8px;font-size:11px;">${item.description||''} ${item.color?`<em style="color:#666">${item.color}</em>`:''}</td><td style="padding:4px 8px;text-align:right;font-size:11px;">${item.qty||''}</td><td style="padding:4px 8px;text-align:left;font-size:11px;">${item.unit||''}</td><td style="padding:4px 8px;text-align:right;font-weight:600;">${money(c.total)}</td></tr>`;
    return `<tr><td style="padding:4px 8px;font-size:11px;">${item.itemCode?`<strong>${item.itemCode}</strong>`:''}</td><td style="padding:4px 8px;font-size:11px;">${item.description||''} ${item.color?`<em style="color:#666">${item.color}</em>`:''}</td><td style="padding:4px 8px;text-align:right;font-size:11px;">${item.qty||''}</td><td style="padding:4px 8px;font-size:11px;">${item.unit||''}</td><td style="padding:4px 8px;text-align:right;font-size:11px;">${money(c.material)}</td><td style="padding:4px 8px;text-align:right;font-size:11px;">${money(c.labor)}</td><td style="padding:4px 8px;text-align:right;font-weight:600;">${money(c.total)}</td></tr>`;
  };
  const renderSection=(sectionName,sectionItems,isAlt=false)=>{
    const hasFull=sectionItems.some(i=>(i.displayMode||'full')==='full');
    const secTotal=sectionItems.reduce((s,i)=>s+calcItem(i,tax,mup).total,0);
    const headers=hasFull?'<th style="padding:4px 8px;text-align:left;">Item</th><th style="padding:4px 8px;text-align:left;">Description</th><th style="padding:4px 8px;text-align:right;">QTY</th><th style="padding:4px 8px;text-align:left;">Unit</th><th style="padding:4px 8px;text-align:right;">Material</th><th style="padding:4px 8px;text-align:right;">Labor</th><th style="padding:4px 8px;text-align:right;">Line Total</th>':'<th style="padding:4px 8px;text-align:left;">Item</th><th style="padding:4px 8px;text-align:left;">Description</th><th style="padding:4px 8px;text-align:right;">QTY</th><th style="padding:4px 8px;text-align:left;">Unit</th><th style="padding:4px 8px;text-align:right;">Total</th>';
    return `<div style="margin-bottom:16px;">
      <div style="background:${isAlt?'#fef3c7':'#f5f5f4'};padding:6px 8px;font-weight:700;font-size:12px;border-left:3px solid ${isAlt?'#d97706':'#1c1917'};">${isAlt?'ALTERNATE: ':''}${sectionName}</div>
      <table style="width:100%;border-collapse:collapse;font-size:11px;">
        <thead><tr style="border-bottom:1px solid #e7e5e4;">${headers}</tr></thead>
        <tbody>${sectionItems.map(renderLine).join('')}</tbody>
        <tfoot><tr style="border-top:1px solid #e7e5e4;background:#f5f5f4;"><td colspan="${hasFull?5:3}" style="padding:4px 8px;text-align:right;font-size:11px;color:#666;">Section Total</td><td colspan="${hasFull?2:2}" style="padding:4px 8px;text-align:right;font-weight:700;">${money(secTotal)}</td></tr></tfoot>
      </table></div>`;
  };
  const today=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Proposal — ${estimate.projectName||''}</title>
  <style>

    .page{max-width:850px;margin:0 auto;padding:40px;}
    h1{font-family:Georgia,serif;font-size:28px;font-weight:400;margin:0 0 4px 0;}
    .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #1c1917;}
    .company{text-align:right;font-size:11px;color:#555;}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;font-size:11px;}
    .info-block{background:#fafaf9;padding:12px;border:1px solid #e7e5e4;}
    .info-label{font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:#888;font-weight:700;margin-bottom:4px;}
    .totals{background:#1c1917;color:white;padding:16px;display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;margin:20px 0;}
    .totals-label{font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:#aaa;margin-bottom:4px;}
    .totals-value{font-family:Georgia,serif;font-size:22px;}
    .notes{margin-top:24px;padding-top:16px;border-top:1px solid #e7e5e4;font-size:10px;color:#666;}
    .notes h4{font-size:11px;color:#333;margin-bottom:8px;}
    .note-item{margin-bottom:6px;padding-left:12px;border-left:2px solid #e7e5e4;}
    @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}.no-print{display:none;}}
  </style></head>
  <body><div class="page">
    <div class="no-print" style="background:#1c1917;color:white;padding:12px 16px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;">📄 Preview — click Print to save as PDF</span>

      <div class="info-block">
        <div class="info-label">General Contractor</div>

        ${estimate.gcContactName?`<div>${estimate.gcContactName}</div>`:''}
        ${estimate.gcContactEmail?`<div><a href="mailto:${estimate.gcContactEmail}" style="color:#1d4ed8;">${estimate.gcContactEmail}</a></div>`:''}
        ${estimate.gcContactPhone?`<div>${estimate.gcContactPhone}</div>`:''}
        ${estimate.gcAddressLine1?`<div style="color:#666;margin-top:4px;">${estimate.gcAddressLine1}</div>`:''}
      </div>

        ${estimate.plansDated?`<div>Plans dated: <strong>${estimate.plansDated}</strong></div>`:''}

        <div style="margin-top:4px;color:#888;font-size:10px;">State and Local Taxes Included in MATERIAL COSTS ONLY.</div>
      </div>
    </div>
    ${[...sections.entries()].map(([name,items])=>renderSection(name,items)).join('')}
    <div class="totals">
      <div><div class="totals-label">Total Material</div><div class="totals-value">${money(totalMat)}</div></div>
      <div><div class="totals-label">Total Labor</div><div class="totals-value">${money(totalLab)}</div></div>

/* ── Helpers ──────────────────────────────────────────────── */
const money = (n, compact = false) => {
  if (n === null || n === undefined || isNaN(n) || n === '') return '—';
  if (n === 0) return '$0';
  if (compact && Math.abs(n) >= 1e6) return `$${(n / 1e6).toFixed(2)}M`;
  if (compact && Math.abs(n) >= 1e3) return `$${(n / 1e3).toFixed(0)}K`;
  return '$' + Math.round(n).toLocaleString('en-US');
};
const pct = (n, d = 0) => n === null || n === undefined || isNaN(n) ? '—' : `${(n * 100).toFixed(d)}%`;
const todayStr = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => a && b ? Math.floor((new Date(b) - new Date(a)) / 86400000) : null;
const daysSince = d => daysBetween(d, todayStr());
const formatDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', {
  month: 'short',
  day: 'numeric',
  year: 'numeric'
}) : '—';
const lastActivity = p => p.lastTouched || p.submitted;
const overdueDays = (p, s) => {
  if (!['Submitted', 'Negotiating', 'Bidding'].includes(p.status)) return null;
  const since = daysSince(lastActivity(p));
  if (since === null) return null;
  const sla = p.status === 'Submitted' ? s.slaSubmitted : s.slaNegotiating;
  return Math.max(0, since - sla);
};
const estMargin = p => {
  const c = p.contractAmount || p.bidAmount || 0;
  if (!c) return null;
  const costs = (p.estMaterial || 0) + (p.estLabor || 0) + (p.estOther || 0);
  return costs ? (c - costs) / c : null;
};
const actMargin = p => {
  const c = p.contractAmount || p.bidAmount || 0;
  if (!c) return null;
  const costs = (p.actMaterial || 0) + (p.actLabor || 0) + (p.actOther || 0);
  return costs ? (c - costs) / c : null;
};
const followUpScore = (p, s, wr) => {
  const od = overdueDays(p, s) || 0;
  const w = wr !== null && wr !== undefined ? Math.max(wr, 0.1) : 0.3;
  return (p.bidAmount || 0) * (1 + od / 7) * (1 + w);
};
const computeGCStats = proposals => {
  const map = new Map();
  proposals.forEach(p => {
    if (!p.gc) return;
    if (!map.has(p.gc)) map.set(p.gc, {
      gc: p.gc,
      proposals: 0,
      totalVolume: 0,
      won: 0,
      lost: 0,
      open: 0,
      wonValue: 0,
      lostValue: 0,
      openValue: 0,
      contacts: new Set(),
      firstSubmit: null,
      lastSubmit: null,
      projects: []
    });
    const s = map.get(p.gc);
    s.proposals++;
    s.totalVolume += p.bidAmount || 0;
    s.projects.push(p);
    if (p.contact) s.contacts.add(p.contact);
    if (p.submitted) {
      if (!s.firstSubmit || p.submitted < s.firstSubmit) s.firstSubmit = p.submitted;
      if (!s.lastSubmit || p.submitted > s.lastSubmit) s.lastSubmit = p.submitted;
    }
    if (WON_STATUSES.includes(p.status)) {
      s.won++;
      s.wonValue += p.contractAmount || p.bidAmount || 0;
    } else if (LOST_STATUSES.includes(p.status)) {
      s.lost++;
      s.lostValue += p.bidAmount || 0;
    } else {
      s.open++;
      s.openValue += p.bidAmount || 0;
    }
  });
  return Array.from(map.values()).map(s => ({
    ...s,

// ── Calculation engine ────────────────────────────────────────────
const calcItem = (item, taxRate, markupRate) => {
  const qty = Number(item.qty) || 0,
    cpu = Number(item.costPerUnit) || 0;
  const freight = Number(item.freight) || 0,
    lr = Number(item.laborRate) || 0;
  const amount = qty * cpu,
    salesTax = amount * (taxRate || 0.07);
  const amsTotalCost = amount + salesTax + freight;
  const markup = amount * (markupRate || 0.20);
  const material = amsTotalCost + markup,
    labor = qty * lr,
    total = material + labor;
  let orderQty = qty,
    orderUnit = item.unit || 'SF';
  if (item.sfPerCtn && Number(item.sfPerCtn) > 0 && qty > 0) {
    orderQty = Math.ceil(qty / Number(item.sfPerCtn));
    orderUnit = 'CTN';
  }
  return {
    amount,
    salesTax,
    amsTotalCost,
    markup,
    material,
    labor,
    total,
    orderQty,
    orderUnit
  };
};
