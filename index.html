<script>
// Prevent browser from navigating when files are dragged onto the page.
// Must be in plain HTML (not React) so it's active from page load.
(function(){
  function blockNav(e){e.preventDefault();}
  document.addEventListener('dragover', blockNav, false);
  document.addEventListener('drop', blockNav, false);
})();
</script>

    <input id="pw-input" type="password" placeholder="Enter password" style="width:100%;padding:10px 14px;font-size:14px;background:#1c1917;border:1px solid #57534e;color:#fafaf9;outline:none;box-sizing:border-box;margin-bottom:10px;" onkeydown="if(event.key==='Enter')checkPW()" />

<script>
  const PW = 'Sailor@22';
  const SK = 'ams_auth';
  function checkPW(){
    const v = document.getElementById('pw-input').value;
    if(v === PW){ sessionStorage.setItem(SK,'1'); document.getElementById('gate').style.display='none'; }
    else{ document.getElementById('pw-err').textContent='Incorrect password'; document.getElementById('pw-input').value=''; document.getElementById('pw-input').focus(); }
  }
  // Check on load
  if(sessionStorage.getItem(SK)!=='1'){
    document.getElementById('gate').style.display='flex';
    setTimeout(()=>document.getElementById('pw-input').focus(),100);
  } else {
    document.getElementById('gate').style.display='none';
  }
</script>

async function fetchAll(table, opts){
 const pageSize=1000; let from=0; const all=[];
 for(;;){
  let q=sb.from(table).select('*');
  if(opts&&opts.order) q=q.order(opts.order,{ascending:opts.ascending!==false});

  const {data,error}=await q.range(from,from+pageSize-1);
  if(error) return {data:all.length?all:null,error};
  if(!data||!data.length) break;
  all.push(...data);
  if(data.length<pageSize) break;
  from+=pageSize;

}

   const od=overdueDays(p,settings)||0;

   return{...p,_od:od,_naOD:naOD,_score:followUpScore(p,settings,gcWR.get(p.gc))+(naOD*5000),_gcWR:gcWR.get(p.gc)};

// PATCH (v37.1): calcEstimateItem now uses orderQty for amount (Bug #1) and respects usedMaterial flag (Bug #3)

const calcEstimateItem = (item, taxRate, markupRate) => {

 // Effective qty: takeoff qty after multiplier/deduction/height (defaults = no-op for existing data)
 const multiplier = Number(item.multiplier) || 1;
 const deduction  = Number(item.deduction)  || 0;
 const height     = Number(item.height)     || 0;
 let effectiveQty = qty;
 if (deduction > 0)    effectiveQty = Math.max(0, effectiveQty - deduction);
 if (multiplier !== 1) effectiveQty = effectiveQty * multiplier;
 if (height > 0)       effectiveQty = effectiveQty * height;
 // PATCH (v38): §2 locked math — AMOUNT = ORDER × COST.
 // ORDER is the stored order qty (already in the cost's unit, e.g. 120 SF), NOT a
 // recomputed carton count. The prior v37.1a hotfix multiplied per-SF cost by the
 // CARTON count (ceil(qty/sfPerCtn)), understating every SF/LF line by the SF-per-carton
 // factor (CB $12,227.77 → $6,455). Use the stored orderQty; derive cartons only as a
 // fallback for manual lines with no stored order qty.
 let orderQty, orderUnit;
 if (item.orderQty != null && Number(item.orderQty) > 0) {
  orderQty  = Number(item.orderQty);
  orderUnit = item.orderUnit || item.unit || 'SF';

  orderQty  = Math.ceil(effectiveQty / item.sfPerCtn);
  orderUnit = item.syPerCtn ? 'SY' : 'CTN';

  orderQty  = effectiveQty;

 const amount = orderQty * costPerUnit;
 // FIX (Bug #3): if item came from MATERIAL-column import (parser already baked in tax+markup), skip both
 const effTaxRate    = item.usedMaterial ? 0 : (taxRate!=null    ? taxRate    : 0.07);
 // FIX (2026-06-11): markup is a LINE-ITEM property (decoded from each row's formula at migration).
 // Use lineMarkupRate when present; fall back to the estimate-level rate. Mixed-markup files
 // (e.g. Northside: 29 lines @10%, 6 @20%) displayed wrong with a single estimate-level rate.
 const effMarkupRate = item.usedMaterial ? 0 : (item.lineMarkupRate!=null ? Number(item.lineMarkupRate) : (markupRate!=null ? markupRate : 0.20));

  const r = inRef.current.getBoundingClientRect();

  const key = `${mfr}|||${desc}`;
  const hist = priceHistory.get(key);
  if (!hist || hist.length === 0) return null;
  const last = hist[0];
  const lastCost = last.costPerUnit;
  const daysAgo = last.date ? Math.round((Date.now() - new Date(last.date)) / 86400000) : null;
  const cutoff = Date.now() - 60 * 86400000;
  const recent = hist.filter(h => h.date && new Date(h.date) >= cutoff);
  const avg60 = recent.length > 0 ? recent.reduce((s, h) => s + h.costPerUnit, 0) / recent.length : lastCost;
  const current = Number(item.unitCost) || Number(item.costPerUnit) || 0;
  const drift = current > 0 && avg60 > 0 ? (current - avg60) / avg60 : null;
  return { lastCost, daysAgo, avg60, drift, count: hist.length };
 };

/* ===================== M15 — Bluebeam takeoff intake (Peter's front door) =====================
   CSV drop -> priced CANDIDATE draft -> Peter confirms/edits/adds missing lines -> save-back to
   proposals/estimates/estimate_items via a CLEAN unitCost writer.
   Idempotency anchor = Peter-assigned project number (one shared namespace with the historical 154;
   existence-checked on save -> explicit "update this one" vs cancel; never silent overwrite).
   Reader/pricer/unit-guard ported from M14 (m15_port.js, 20/20 regression incl. Seaside F-1 885.22 SF).
   NEVER writes costPerUnit to estimate_items. Forbidden baked columns omitted (their absence = the
   correct no-op in calcEstimateItem). ============================================================ */

// ---- CSV parser (RFC4180-ish: "" escapes, commas-in-quotes, CRLF, BOM) ----
function m15ParseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  const rows=[]; let row=[],field='',i=0,inQ=false; const n=text.length;
  while(i<n){ const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue;} field+=c;i++;continue; }
    if(c==='"'){inQ=true;i++;continue;}
    if(c===','){row.push(field);field='';i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}
    field+=c;i++;
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows;
}
const M15_GROUP_RE=/^(.*\S)\s*\((\d+)\)\s*$/;
const M15_UNNAMED_RE=/^\(\d+\)$/;
const m15Num=s=>{ if(s==null)return 0; s=String(s).trim().replace(/,/g,''); if(s==='')return 0; const v=parseFloat(s); return isNaN(v)?0:v; };
const m15r2=x=>Math.round(x*100)/100;

function m15ReadTakeoff(text,fileName){
  const rows=m15ParseCSV(text);
  if(!rows.length) return {file:fileName,error:'empty file',items:[],junk_rows:0};
  const header=rows[0].map(h=>h.trim());
  const col={}; header.forEach((nm,idx)=>{ if(!(nm in col)) col[nm]=idx; });
  const cell=(r,nm)=>{ const idx=col[nm]; return (idx!=null&&idx<r.length)?r[idx]:''; };
  const details=new Map(); const headers={}; let junk=0;
  for(let k=1;k<rows.length;k++){
    const r=rows[k];
    if(!r.some(c=>String(c).trim()!=='')) continue;
    const label=String(cell(r,'Label')).trim();
    const subject=String(cell(r,'Subject')).trim();
    // PETER 6/10 #1: Bluebeam export now carries SIZE / MFR / ITEM COLOR columns.
    // Mapping rule from Peter: CSV "Subject" = AMS "description". Blank cells fall back to
    // the existing pulldown-history (catalog candidate) behavior downstream.
    const csvSize=String(cell(r,'Size')).trim();
    const csvMfr=String(cell(r,'MFR')).trim();
    const csvColor=String(cell(r,'Item Color')).trim();
    const area=m15Num(cell(r,'Area')), length=m15Num(cell(r,'Length')), count=m15Num(cell(r,'Count'));
    const m=label.match(M15_GROUP_RE);
    if(m&&subject===''){ const tag=m[1].trim(); if(tag==='')continue;
      headers[tag]={group_count:parseInt(m[2],10),area_sf:area,length_lf:length}; continue; }
    if(label===''||M15_UNNAMED_RE.test(label)){ junk++; continue; }
    if(!details.has(label)) details.set(label,{subjects:new Set(),sizes:new Set(),mfrs:new Set(),colors:new Set(),area_sf:0,length_lf:0,count:0,n_measures:0});
    const d=details.get(label);
    if(subject) d.subjects.add(subject);
    if(csvSize) d.sizes.add(csvSize);
    if(csvMfr) d.mfrs.add(csvMfr);
    if(csvColor) d.colors.add(csvColor);
    d.area_sf+=area; d.length_lf+=length; d.count+=count; d.n_measures+=1;
  }
  const items=[];
  for(const [tag,d] of details){
    const hdr=headers[tag]||{}; let measure,qty,unit;
    if(d.area_sf>0){measure='area';qty=m15r2(d.area_sf);unit='SF';}
    else if(d.length_lf>0){measure='length';qty=m15r2(d.length_lf);unit='LF';}
    else if(d.count>0){measure='count';qty=m15r2(d.count);unit='EA';}
    else {measure='none';qty=0;unit='';}
    let recon=null;
    if(Object.keys(hdr).length){ const hv=measure==='area'?hdr.area_sf:(measure==='length'?hdr.length_lf:null); if(hv!=null)recon=m15r2(qty-hv); }
    items.push({tag,subject:d.subjects.size?[...d.subjects].sort().join(' / '):'',
      size:d.sizes&&d.sizes.size?[...d.sizes].sort().join(' / '):'',
      mfr:d.mfrs&&d.mfrs.size?[...d.mfrs].sort().join(' / '):'',
      color:d.colors&&d.colors.size?[...d.colors].sort().join(' / '):'',
      measure,qty,unit,n_measures:d.n_measures,recon_delta:recon});
  }
  items.sort((a,b)=>a.tag<b.tag?-1:a.tag>b.tag?1:0);
  return {file:fileName,header,items,junk_rows:junk};
}

// ---- unit-family guard (M15: blocks the SC-1 SF->EA $77k garbage multiply) ----
const M15_FAMILY={SF:'area',SY:'area',SQFT:'area',LF:'length',LNFT:'length',EA:'count',PC:'count',PCS:'count',CTN:'count',CTNS:'count',ROLL:'count',ROLLS:'count',BX:'count',BOX:'count',GAL:'count',LB:'count',LBS:'count','':''};
const m15UnitsCompatible=(mu,ou)=>{ const a=M15_FAMILY[(mu||'').toUpperCase()],b=M15_FAMILY[(ou||'').toUpperCase()]; if(!a||!b)return false; return a===b; };

// ---- catalog from estimate_items in app state (keyed by manufacturer|||description, most-recent) ----
function m15BuildCatalog(estimateItems){
  const map=new Map();
  (estimateItems||[]).forEach(it=>{
    const cost=Number(it.unitCost)||Number(it.costPerUnit)||0;        // unitCost is truth; costPerUnit fallback is harmless (never exists live)
    if(!(cost>0)) return;
    const mfr=(it.manufacturer||'').trim(), desc=(it.description||'').trim();
    if(!mfr&&!desc) return;
    const key=(mfr+'|||'+desc).toLowerCase();
    const date=it.updatedAt||it.createdAt||'';
    const qty=Number(it.qty)||0, orderQty=Number(it.orderQty)||0;
    const cov=(qty>0&&orderQty>0)?m15r2(orderQty/qty):null;
    const prev=map.get(key);
    if(!prev||date>prev.date){
      map.set(key,{ key, label:(mfr?mfr+' ':'')+desc, manufacturer:mfr, description:desc,
        itemCode:(it.itemCode||'').trim(), unitCost:m15r2(cost), orderUnit:(it.orderUnit||it.unit||'').trim(),
        coverageFactor:cov, laborRate:Number(it.laborRate)||0, freight:Number(it.freight)||0, date, n:1 });
    } else { prev.n+=1; }
  });
  const arr=[...map.values()].sort((a,b)=>a.label.localeCompare(b.label));
  const byCode={}; arr.forEach(e=>{ if(e.itemCode) byCode[e.itemCode.toLowerCase()]=e; });
  return {arr, byKey:map, byCode};
}
function m15Candidates(subject, catArr, limit=6){
  const stop=new Set(['the','and','of','to','in','for','with']);
  const toks=new Set(String(subject).toLowerCase().split(/[^a-z0-9]+/).filter(t=>t.length>=2&&!stop.has(t)));
  if(!toks.size) return [];
  const scored=[];
  catArr.forEach(e=>{ const d=e.label.toLowerCase(); let h=0; toks.forEach(t=>{ if(d.includes(t))h++; }); if(h)scored.push([h,e]); });
  scored.sort((a,b)=> b[0]-a[0] || a[1].label.localeCompare(b[1].label));
  return scored.slice(0,limit).map(s=>s[1]);
}

// ---- PURE payload builder (node-tested): lines+job -> rows for proposals/estimates/estimate_items ----
// Writes unitCost (never costPerUnit); omits forbidden baked columns; stores materialActual + lineMarkupRate.
function m15BuildPayloads({lines, job, propId, estId, isUpdate}){
  const tax=Number(job.tax), markup=Number(job.markup);
  const included=lines.filter(l=>l.include);
  let estMat=0, estLab=0, base=0, ord=0;
  const itemRows=included.map(l=>{
    const qty=Number(l.measured_qty)||0;
    const orderQty=m15r2(qty*(Number(l.coverage)||1));
    const item={ qty, unitCost:Number(l.unitCost)||0, freight:Number(l.freight)||0,
                 laborRate:Number(l.laborRate)||0, orderQty, orderUnit:l.orderUnit||l.measured_unit, unit:l.measured_unit };
    const c=calcEstimateItem(item, tax, markup);
    estMat+=c.material; estLab+=c.labor; base+=c.total;
    return { id:'ei_'+propId+'_'+l.tag+'_'+(ord++), estimateId:estId, proposalId:propId,
      sortOrder:ord, sectionCode:l.sectionCode||'', sectionName:l.sectionName||'Flooring',
      itemCode:l.tag||'', size:l.size||'', manufacturer:l.manufacturer||'',
      // PETER'S RULE (6/10): CSV "SUBJECT" = AMS "description"
      description:l.subject||l.product||'',
      color:l.color||'', qty, unit:l.measured_unit, orderQty, orderUnit:item.orderUnit,
      unitCost:item.unitCost, freight:item.freight, laborRate:item.laborRate,
      materialActual:m15r2(c.material), lineMarkupRate:markup, displayMode:'full', source:'M15 takeoff: '+job.fileName };
  });
  const proposalRow={ id:propId, project:job.projectName, location:job.location||'', gc:job.gc||'',
    contact:job.contact||'', email:job.email||'', phone:job.phone||'', submitted:job.submitted,
    bidAmount:Math.round(base), status:job.status||'Bidding',
    owner:'Peter', estimator:'Peter', bdOwner:'Paul', pm:'', projectNumber:propId,
    notes:'Takeoff intake from '+job.fileName, retainage:0.1,
    estMaterial:Math.round(estMat), estLabor:Math.round(estLab), estOther:null,
    actMaterial:null, actLabor:null, actOther:null };
  const estimateRow={ id:estId, proposalId:propId, proposalNumber:propId, projectName:job.projectName,
    gcName:job.gc||'', gcContactName:job.contact||'', gcContactEmail:job.email||'', gcContactPhone:job.phone||'',
    taxRate:tax, markupRate:markup, baseBidTotal:Math.round(base),
    preparedByName:'Peter Laitres', preparedByEmail:'peter@amsfloors.com', preparedByPhone:'9417401555' };
  return { proposalRow, estimateRow, itemRows, totals:{base:Math.round(base),estMat:Math.round(estMat),estLab:Math.round(estLab)}, isUpdate:!!isUpdate };
}

const TakeoffIntake = ({ sb, estimateItems, proposals, onImported, lock, onDone }) => {
  const blankJob = lock
    ? {tax:0.07,markup:0.20,projectNumber:String(lock.id),projectName:lock.project||'',gc:lock.gc||'',contact:lock.contact||'',email:lock.email||'',phone:lock.phone||'',location:lock.location||'',status:'Bidding',fileName:''}
    : {tax:0.07,markup:0.20,projectNumber:'',projectName:'',gc:'',contact:'',email:'',phone:'',location:'',status:'Bidding',fileName:''};
  const [lines,setLines]=React.useState(null);
  const [job,setJob]=React.useState(blankJob);
  const [status,setStatus]=React.useState(null);
  const [saving,setSaving]=React.useState(false);
  const [collision,setCollision]=React.useState(null);   // {existing} pending Peter's confirm
  const fileRef=React.useRef(null);
  const catalog=React.useMemo(()=>m15BuildCatalog(estimateItems||[]),[estimateItems]);

  const resetAll=()=>{ setLines(null); setCollision(null); setStatus(null);
    setJob(blankJob);
    if(fileRef.current) fileRef.current.value=''; };

  const onFile=async(file)=>{
    if(!file) return;
    if(!/\.csv$/i.test(file.name)){ setStatus({ok:false,msg:'M15 takes a Bluebeam CSV export — not '+file.name}); return; }
    setStatus({ok:true,msg:'Reading '+file.name+'…'});
    try{
      const text=await file.text();
      const parsed=m15ReadTakeoff(text,file.name);
      if(parsed.error){ setStatus({ok:false,msg:parsed.error}); return; }
      const priceable=parsed.items.filter(i=>i.measure!=='none');
      const newLines=priceable.map(it=>{
        // PETER 6/10 #1: MFR+Subject from the CSV give a higher-confidence exact catalog match
        // (the catalog is keyed manufacturer|||description) — try it before the tag-code match.
        const keyMatch = (it.mfr||it.subject) ? catalog.byKey.get(((it.mfr||'')+'|||'+(it.subject||'')).toLowerCase()) : null;
        const exact = keyMatch || (it.tag ? catalog.byCode[it.tag.toLowerCase()] : null);
        const kw = m15Candidates(it.subject||it.tag, catalog.arr);
        const cands = exact ? [exact, ...kw.filter(c=>c.key!==exact.key)] : kw;
        // CSV values win when present ("ready to go" per Peter); blanks keep the existing
        // pulldown-history behavior (catalog prefill from an exact match, candidates otherwise).
        return {
          tag:it.tag, subject:it.subject, measured_qty:it.qty, measured_unit:it.unit, recon:it.recon_delta,
          candidates:cands,
          product: it.subject || (exact?exact.label:''),
          manufacturer: it.mfr || (exact?exact.manufacturer:''),
          unitCost: exact?exact.unitCost:'', orderUnit: exact?(exact.orderUnit||it.unit):it.unit,
          coverage: exact&&exact.coverageFactor?exact.coverageFactor:1,
          laborRate: exact?exact.laborRate:0, freight: exact?exact.freight:0,
          sectionCode:'', sectionName:'Flooring',
          include:true,
          size: it.size || '',
          color: it.color || '',
        };
      });
      setJob(j=>({...j,fileName:file.name}));
      setLines(newLines);
      setStatus({ok:true,msg:'Parsed '+priceable.length+' priceable line'+(priceable.length===1?'':'s')+' · '+parsed.junk_rows+' annotation rows skipped. Every line is a CANDIDATE — confirm product + cost before saving.'});
    }catch(e){ setStatus({ok:false,msg:'Read failed: '+e.message}); }
  };

  const updateLine=(idx,patch)=>setLines(ls=>ls.map((l,i)=>i===idx?{...l,...patch}:l));
  const pickProduct=(idx,key)=>{ const e=catalog.byKey.get(key); if(!e)return;
    updateLine(idx,{product:e.label,manufacturer:e.manufacturer,unitCost:e.unitCost,
      orderUnit:e.orderUnit||lines[idx].measured_unit,coverage:e.coverageFactor||1,laborRate:e.laborRate,freight:e.freight,include:true}); };
  const addLine=()=>setLines(ls=>[...(ls||[]),{tag:'NEW-'+((ls||[]).length+1),subject:'',measured_qty:0,measured_unit:'SF',recon:null,candidates:[],product:'',manufacturer:'',unitCost:'',orderUnit:'SF',coverage:1,laborRate:0,freight:0,sectionCode:'',sectionName:'Flooring',include:true,size:'',color:''}]);
  const removeLine=idx=>setLines(ls=>ls.filter((_,i)=>i!==idx));

  const lineState=l=>{
    if(!l.include) return {label:'excluded',cls:'text-stone-400'};
    if(!l.product||!(Number(l.unitCost)>0)) return {label:'needs product+cost',cls:'text-rose-700 font-semibold'};
    // Cross-unit (e.g. SF measured, EA ordered) is fine WHEN a coverage factor converts it.
    // Block only the unconverted case — coverage = 1 across unit families is the SC-1 $77k bug.
    if(!m15UnitsCompatible(l.measured_unit,l.orderUnit) && (Number(l.coverage)||1)===1)
      return {label:'set coverage →',cls:'text-amber-700 font-semibold'};
    return {label:'ready',cls:'text-emerald-700'};
  };
  const linePreview=l=>{ const qty=Number(l.measured_qty)||0;
    const item={qty,unitCost:Number(l.unitCost)||0,freight:Number(l.freight)||0,laborRate:Number(l.laborRate)||0,orderQty:m15r2(qty*(Number(l.coverage)||1)),orderUnit:l.orderUnit||l.measured_unit,unit:l.measured_unit};
    return calcEstimateItem(item,Number(job.tax),Number(job.markup)); };
  const totals=React.useMemo(()=>{ if(!lines)return{base:0,mat:0,lab:0,nReady:0,nIncl:0};
    let base=0,mat=0,lab=0,nReady=0,nIncl=0;
    lines.forEach(l=>{ if(!l.include)return; nIncl++; if(lineState(l).label==='ready'){nReady++; const c=linePreview(l); base+=c.total;mat+=c.material;lab+=c.labor;} });
    return{base,mat,lab,nReady,nIncl}; },[lines,job.tax,job.markup]);

  const blockers=()=>{ const b=[];
    if(!lock && !job.projectNumber.trim()) b.push('Assign a project number');
    if(!lock && !job.projectName.trim()) b.push('Enter a project name');
    if(lines){ const bad=lines.filter(l=>l.include&&lineState(l).label!=='ready'); if(bad.length) b.push(bad.length+' included line(s) not ready'); }
    if(totals.nIncl===0) b.push('Include at least one line');
    return b; };

  // Supabase returns {error} instead of throwing — so EVERY write must be checked or a failed
  // save reports false success (the test9999 silent-failure bug). chk() makes failures loud.
  const chk=async(label,p)=>{ const {data,error}=await p; if(error) throw new Error(label+' — '+(error.message||error.details||error.code||'rejected by database')); return data; };
  const doSave=async(confirmedUpdate)=>{
    const propId=lock?String(lock.id):String(job.projectNumber).trim();
    setSaving(true); setStatus({ok:true,msg:'Saving…'});
    try{
      let existing=null;
      if(lock){ existing={id:propId}; }   // known existing project — never clobber its metadata
      else {
        // existence-check guard: shared namespace, so a reused number may hit a real project
        existing=await chk('number lookup',sb.from('proposals').select('id,project').eq('id',propId).maybeSingle());
        if(existing && !confirmedUpdate){ setCollision({existing}); setSaving(false); setStatus(null); return; }
      }
      const estId='est_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
      const {proposalRow,estimateRow,itemRows,totals:t}=m15BuildPayloads({lines,job:{...job,submitted:new Date().toISOString().slice(0,10)},propId,estId,isUpdate:!!existing});
      if(lock){
        // import into an EXISTING project — preserve its status/gc/notes/owner; only refresh the
        // estimate-derived money fields so the import never overwrites project metadata.
        await chk('refresh project totals',sb.from('proposals').update({bidAmount:proposalRow.bidAmount,estMaterial:proposalRow.estMaterial,estLabor:proposalRow.estLabor,updatedAt:new Date().toISOString()}).eq('id',propId));
      } else if(existing){ await chk('save proposal',sb.from('proposals').upsert(proposalRow)); }
      else { await chk('save proposal',sb.from('proposals').insert(proposalRow)); }
      // clean replace of any prior estimate + items for this proposal (idempotent re-save), writes unitCost
      const oldEsts=await chk('check existing estimates',sb.from('estimates').select('id').eq('proposalId',propId));
      if(oldEsts&&oldEsts.length){ for(const oe of oldEsts) await chk('clear old items',sb.from('estimate_items').delete().eq('estimateId',oe.id)); await chk('clear old estimates',sb.from('estimates').delete().eq('proposalId',propId)); }
      await chk('clear old items',sb.from('estimate_items').delete().eq('proposalId',propId));
      await chk('save estimate',sb.from('estimates').insert(estimateRow));
      for(let i=0;i<itemRows.length;i+=50) await chk('save line items',sb.from('estimate_items').insert(itemRows.slice(i,i+50)));
      if(onImported) await onImported();
      setCollision(null); setSaving(false);
      setStatus({ok:true,msg:'✓ Saved '+(lock?'into ':(existing?'(updated) ':''))+'#'+propId+' "'+job.projectName+'" — '+itemRows.length+' items · base '+money(t.base)+(lock?'.':'. Open the project to generate proposal / PO / WO.')});
      setLines(null);
      if(lock&&onDone) setTimeout(onDone,1200);
    }catch(e){ setSaving(false); setStatus({ok:false,msg:'Save failed: '+e.message+(/bigint|integer|invalid input syntax|numeric/i.test(e.message)?' — the project number must be numeric (match your existing project numbers, e.g. 1898).':'')}); }
  };

  const cellCls='px-2 py-1.5 align-top';
  const inp='w-full border border-stone-300 rounded-sm px-1.5 py-1 text-sm focus:outline-none focus:border-orange-700';
  return (
    <div style={lines?{gridColumn:'1 / -1'}:undefined}>
      <h4 className="font-serif text-base text-stone-800 mb-1">{lock?'Import takeoff into #'+lock.id:'New takeoff (Bluebeam CSV)'}</h4>
      <p className="text-sm text-stone-600 mb-3">Drop a Bluebeam CSV export. Quantities reconcile automatically; every line is a <strong>candidate</strong> you confirm before it saves. Catalog suggestions come from {catalog.arr.length} known materials.</p>
      <div className="flex items-center gap-3 mb-3">
        <input ref={fileRef} type="file" accept=".csv,text/csv" onChange={e=>onFile(e.target.files&&e.target.files[0])}
          className="text-sm file:mr-3 file:px-3 file:py-1.5 file:border-0 file:bg-orange-800 file:text-white file:rounded-sm file:cursor-pointer hover:file:bg-orange-900"/>
        {lines&&<button onClick={resetAll} className="text-xs text-stone-500 underline hover:text-stone-800">Clear</button>}
      </div>
      {status&&!lines&&<div className={`text-sm mb-3 px-3 py-2 rounded-sm ${status.ok?'bg-emerald-50 text-emerald-800':'bg-rose-50 text-rose-800'}`}>{status.msg}</div>}

      {lines&&<div className="fixed inset-0 z-50 bg-stone-50 overflow-auto" style={{padding:'18px 24px'}}>
        <div className="mx-auto" style={{maxWidth:'1640px'}}>
          <div className="flex items-start justify-between mb-3">
            <div>
              <h3 className="font-serif text-xl text-stone-800">Takeoff intake — {job.fileName}</h3>
              <p className="text-xs text-stone-500 mt-0.5 max-w-3xl">Each line is a candidate from the takeoff. For each: <strong>pick a catalog product</strong> from the dropdown, <strong>or type a brand-new product name</strong> in the field below it and enter its unit cost. Use <strong>“+ add a line”</strong> for accessories the takeoff never measures (clips, grout, mortar, adhesive, base). Nothing saves until you confirm — uncheck any line you’re not bidding.</p>
            </div>
            <button onClick={resetAll} className="px-3 py-1.5 bg-white border border-stone-300 text-sm rounded-sm hover:bg-stone-100 whitespace-nowrap">✕ Close</button>
          </div>
          {status&&<div className={`text-sm mb-3 px-3 py-2 rounded-sm ${status.ok?'bg-emerald-50 text-emerald-800':'bg-rose-50 text-rose-800'}`}>{status.msg}</div>}
          <div className="bg-white border border-stone-200 rounded-sm overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr className="bg-stone-100 text-stone-500 text-left">
                <th className={cellCls} style={{width:'34px'}}>✓</th>
                <th className={cellCls} style={{width:'160px'}}>Tag / measured</th>
                <th className={cellCls}>Product — pick from catalog, or type a new one</th>
                <th className={cellCls} style={{width:'92px'}}>Unit cost</th>
                <th className={cellCls} style={{width:'150px'}}>Cov. → Order</th>
                <th className={cellCls} style={{width:'84px'}}>Labor rate</th>
                <th className={cellCls + ' text-right'} style={{width:'104px'}}>Line $</th>
                <th className={cellCls} style={{width:'124px'}}>State</th>
                <th className={cellCls} style={{width:'30px'}}></th>
              </tr></thead>
              <tbody>
                {lines.map((l,idx)=>{ const st=lineState(l); const pv=st.label==='ready'?linePreview(l):null;
                  return (<tr key={idx} className="border-t border-stone-100 align-top">
                    <td className={cellCls}><input type="checkbox" checked={l.include} onChange={e=>updateLine(idx,{include:e.target.checked})}/></td>
                    <td className={cellCls}><div className="font-mono font-semibold text-stone-800">{l.tag}</div><div className="text-[11px] text-stone-400">{l.subject}</div>{(l.size||l.color)&&<div className="text-[11px] text-stone-500">{[l.size,l.color].filter(Boolean).join(' · ')}</div>}<div className="font-mono text-stone-600 mt-0.5">{Number(l.measured_qty).toLocaleString()} {l.measured_unit}{l.recon!=null&&Math.abs(l.recon)>0.01?<span className="text-amber-600" title="detail vs Bluebeam subtotal"> ({l.recon>0?'+':''}{l.recon})</span>:null}</div></td>
                    <td className={cellCls}>
                      {(()=>{ const candKeys=new Set((l.candidates||[]).map(c=>c.key));
                        const rest=catalog.arr.filter(e=>!candKeys.has(e.key));
                        return (
                        <select className={inp + ' mb-1'} value="" onChange={e=>e.target.value&&pickProduct(idx,e.target.value)}>
                          <option value="">— pick from catalog ({(l.candidates||[]).length} suggested · {catalog.arr.length} total) —</option>
                          {l.candidates&&l.candidates.length>0&&<optgroup label="Suggested for this tag/description">
                            {l.candidates.map(c=><option key={c.key} value={c.key}>{c.label.slice(0,72)} · {money(c.unitCost)}/{c.orderUnit||'?'}</option>)}
                          </optgroup>}
                          <optgroup label={'All catalog ('+rest.length+')'}>
                            {rest.map(e=><option key={e.key} value={e.key}>{e.label.slice(0,72)} · {money(e.unitCost)}/{e.orderUnit||'?'}</option>)}
                          </optgroup>
                        </select>); })()}
                      <input className={inp} placeholder="…or type a NEW product (not in catalog) — then set its unit cost" value={l.product} onChange={e=>updateLine(idx,{product:e.target.value})}/>
                    </td>
                    <td className={cellCls}><input className={inp + ' text-right font-mono'} type="number" step="0.01" value={l.unitCost} onChange={e=>updateLine(idx,{unitCost:e.target.value})} placeholder="$/unit"/></td>
                    <td className={cellCls}>
                      <div className="flex items-center gap-1">
                        <input className={inp + ' text-right font-mono'} type="number" step="0.01" value={l.coverage} onChange={e=>updateLine(idx,{coverage:e.target.value})} style={{width:'62px'}} title="ORDER = measured × coverage/waste"/>
                        <input className={inp} value={l.orderUnit} onChange={e=>updateLine(idx,{orderUnit:e.target.value})} style={{width:'52px'}} title="order unit"/>
                      </div>
                      <div className="text-[10px] text-stone-400 mt-0.5 font-mono">= {(Number(l.measured_qty)*(Number(l.coverage)||1)).toLocaleString(undefined,{maximumFractionDigits:2})} {l.orderUnit}</div>
                    </td>
                    <td className={cellCls}><input className={inp + ' text-right font-mono'} type="number" step="0.01" value={l.laborRate} onChange={e=>updateLine(idx,{laborRate:e.target.value})}/></td>
                    <td className={cellCls + ' text-right font-mono'}>{pv?money(pv.total):'—'}</td>
                    <td className={cellCls + ' ' + st.cls}>{st.label}</td>
                    <td className={cellCls}><button onClick={()=>removeLine(idx)} className="text-stone-400 hover:text-rose-700">✕</button></td>
                  </tr>); })}
              </tbody>
            </table>
          </div>
          <button onClick={addLine} className="mt-2 text-sm text-orange-800 hover:text-orange-900 font-medium">+ add a line the takeoff didn’t measure (clips, grout, mortar, adhesive, base…)</button>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4 bg-white border border-stone-200 p-3 rounded-sm">
            <label className="text-xs text-stone-600">Project number <span className="text-rose-600">*</span><input className={inp+(lock?' bg-stone-100 text-stone-500':'')} value={job.projectNumber} disabled={!!lock} onChange={e=>{setCollision(null);setJob(j=>({...j,projectNumber:e.target.value}));}} placeholder="Peter assigns (numeric)"/>{lock&&<span className="text-[10px] text-stone-400">Locked to this project</span>}</label>
            <label className="text-xs text-stone-600">Project name <span className="text-rose-600">*</span><input className={inp+(lock?' bg-stone-100 text-stone-500':'')} value={job.projectName} disabled={!!lock} onChange={e=>setJob(j=>({...j,projectName:e.target.value}))}/></label>
            <label className="text-xs text-stone-600">GC<input className={inp} value={job.gc} onChange={e=>setJob(j=>({...j,gc:e.target.value}))}/></label>
            {!lock&&<label className="text-xs text-stone-600">Status<select className={inp} value={job.status} onChange={e=>setJob(j=>({...j,status:e.target.value}))}>{M15_STATUS_OPTS.map(s=><option key={s}>{s}</option>)}</select></label>}
            <label className="text-xs text-stone-600">Tax rate<input className={inp + ' font-mono'} type="number" step="0.001" value={job.tax} onChange={e=>setJob(j=>({...j,tax:e.target.value}))}/></label>
            <label className="text-xs text-stone-600">Markup rate<input className={inp + ' font-mono'} type="number" step="0.01" value={job.markup} onChange={e=>setJob(j=>({...j,markup:e.target.value}))}/></label>
            <label className="text-xs text-stone-600">Contact<input className={inp} value={job.contact} onChange={e=>setJob(j=>({...j,contact:e.target.value}))}/></label>
            <label className="text-xs text-stone-600">Email<input className={inp} value={job.email} onChange={e=>setJob(j=>({...j,email:e.target.value}))}/></label>
          </div>

          <div className="flex items-center justify-between mt-3 pb-8">
            <div className="text-sm text-stone-600">Base bid (ready lines): <span className="font-mono font-semibold text-stone-900">{money(totals.base)}</span> · {totals.nReady}/{totals.nIncl} ready · tax {Math.round(Number(job.tax)*100)}% markup {Math.round(Number(job.markup)*100)}%{blockers().length>0&&<span className="text-stone-500"> · before saving: {blockers().join(' · ')}</span>}</div>
            <button disabled={saving||blockers().length>0} onClick={()=>doSave(false)}
              className="px-5 py-2 bg-orange-800 text-white text-sm rounded-sm disabled:opacity-40 hover:bg-orange-900">
              {saving?'Saving…':'Save to Supabase'}
            </button>
          </div>

          {collision&&<div className="mb-8 bg-amber-50 border border-amber-300 p-3 rounded-sm text-sm">
            <div className="text-amber-900">Project number <strong>#{collision.existing.id}</strong> already exists: <strong>"{collision.existing.project}"</strong>. Saving will replace its estimate and line items.</div>
            <div className="flex gap-2 mt-2">
              <button onClick={()=>doSave(true)} className="px-3 py-1.5 bg-amber-700 text-white text-xs rounded-sm hover:bg-amber-800">Update "{collision.existing.project}"</button>
              <button onClick={()=>setCollision(null)} className="px-3 py-1.5 bg-white border border-stone-300 text-xs rounded-sm hover:bg-stone-100">Cancel — I'll pick a different number</button>
            </div>
          </div>}
        </div>
      </div>}
    </div>
  );
};

const SettingsView=({proposals,lineItemsAll,settings,onSaveSettings,onExport,setShowNewProject,onSaveProposal,sb,onImported,estimateItems})=>{
 const [bfReason,setBfReason]=useState({});
 const [bfSaving,setBfSaving]=useState(false);
 const [bfSaved,setBfSaved]=useState(0);
 const lostUntagged=useMemo(()=>proposals.filter(p=>LOST_STATUSES.includes(p.status)&&!p.lostReason),[proposals]);
 const LOST_REASONS=['Price','Relationship','Scope','Timing','No award','Unknown'];
 const saveBfAll=async()=>{setBfSaving(true);let saved=0;for(const p of lostUntagged){const r=bfReason[p.id];if(r){await onSaveProposal({...p,lostReason:r});saved++;}}setBfSaved(saved);setBfSaving(false);};
 return (
  <div className="space-y-5 max-w-3xl">
   <div><h2 className="font-serif text-2xl text-stone-900">Settings</h2><p className="text-sm text-stone-600 mt-1">Everyday actions on top. Thresholds below — set once, rarely touched.</p></div>
   {/* [SETTINGS REDESIGN 2026-06-11 — Ben] What you DO comes first; what you tune comes second. */}
   {/* [SETTINGS 2026-06-11 — Ben] The three everyday features sit side by side, equal weight. */}
   <section className="grid grid-cols-3 gap-4" style={{alignItems:'stretch'}}>
    <div className="bg-white border border-stone-200 p-4">
     <h4 className="font-serif text-base text-stone-800 mb-1">New Project</h4>
     <p className="text-sm text-stone-600 mb-3">Add a single project to the pipeline by hand.</p>
     <button onClick={()=>setShowNewProject(true)} className="inline-flex items-center gap-2 bg-orange-800 text-white px-4 py-2 rounded-sm hover:bg-orange-900 text-sm"><Ico n="plus" size={14}/>New Project</button>
    </div>
    <div className="bg-white border border-stone-200 p-4">
     <h4 className="font-serif text-base text-stone-800 mb-1">Export</h4>
     <p className="text-sm text-stone-600 mb-3">Everything — proposals, items, GC stats — to one Excel file.</p>
     <button onClick={onExport} className="inline-flex items-center gap-2 bg-white border border-stone-300 text-stone-900 px-4 py-2 rounded-sm hover:bg-stone-100 text-sm"><Ico n="download" size={14}/>Export to Excel</button>
    </div>
    <div className="bg-white border border-stone-200 p-4" style={{minWidth:0}}>
     <TakeoffIntake sb={sb} estimateItems={estimateItems} proposals={proposals} onImported={onImported}/>
    </div>
   </section>
   <section className="bg-white border border-stone-200 p-5">
    <h3 className="font-serif text-lg text-stone-800 mb-1">Thresholds</h3>
    <p className="text-sm text-stone-500 mb-3">A bid turns <span className="text-rose-700 font-semibold">overdue</span> in Follow-Ups when it sits longer than its SLA with no logged contact (logging a call resets the clock). Margins below the floor flag red in Active Jobs.</p>
    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">

 // rename can never silently orphan or drop data.
 const renumberProposal=async(oldId,rawNew)=>{
  const oId=String(oldId);
  const nId=String(rawNew||'').trim();
  if(!nId){ alert('Enter a new project number.'); return; }
  if(nId===oId) return;
  if(proposals.some(p=>String(p.id)===nId)){ alert('Project #'+nId+' already exists — pick a different number.'); return; }
  const src=proposals.find(p=>String(p.id)===oId);
  if(!src){ alert('Could not find project #'+oId+' to renumber.'); return; }
  const ce=async(label,p)=>{const{error}=await p; if(error) throw new Error(label+' — '+(error.message||error.details||error.code||'rejected by database'));};
  let createdNew=false;
  try{
   await ce('create renumbered proposal',sb.from('proposals').insert(toDbProposal({...src,id:nId,updatedAt:new Date().toISOString()})));
   createdNew=true;
   await ce('repoint estimates',sb.from('estimates').update({proposalId:nId,proposalNumber:nId}).eq('proposalId',oId));
   await ce('repoint estimate_items',sb.from('estimate_items').update({proposalId:nId}).eq('proposalId',oId));
   await ce('repoint line items',sb.from('line_items').update({proposalId:nId}).eq('proposalId',oId));
   await ce('repoint documents',sb.from('proposal_documents').update({proposalId:nId}).eq('proposalId',oId));
   await ce('remove old proposal',sb.from('proposals').delete().eq('id',oId));
  }catch(err){
   // Roll everything back to the old number. The old proposal is only deleted in the very
   // last step, so on any earlier failure it still exists — move every child back to it and
   // drop the half-created new row, leaving no duplicate and no orphan.
   if(createdNew){
    try{await sb.from('estimate_items').update({proposalId:oId}).eq('proposalId',nId);}catch(e){}
    try{await sb.from('line_items').update({proposalId:oId}).eq('proposalId',nId);}catch(e){}
    try{await sb.from('estimates').update({proposalId:oId,proposalNumber:oId}).eq('proposalId',nId);}catch(e){}
    try{await sb.from('proposal_documents').update({proposalId:oId}).eq('proposalId',nId);}catch(e){}
    try{await sb.from('proposals').delete().eq('id',nId);}catch(e){}
   }
   alert('Renumber failed — '+err.message+'\n\nThe change was rolled back: project #'+oId+' is unchanged, and nothing was duplicated or deleted.');
   return;
  }
  setProposals(ps=>ps.map(p=>String(p.id)===oId?{...p,id:nId}:p));
  setEstimates(es=>es.map(e=>String(e.proposalId)===oId?{...e,proposalId:nId,proposalNumber:nId}:e));
  setEstimateItems(eis=>eis.map(i=>String(i.proposalId)===oId?{...i,proposalId:nId}:i));
  setLineItems(ls=>ls.map(l=>String(l.proposalId)===oId?{...l,proposalId:nId}:l));
  setSelectedId(nId);
 };

 const deleteEstimateItem = async (id) => {
  const children = estimateItems.filter(i => i.parentItemId === id);
  for (const child of children) {
   setEstimateItems(eis => eis.filter(i => i.id !== child.id));
   await sb.from('estimate_items').delete().eq('id', child.id);
  }
  setEstimateItems(eis => eis.filter(i => i.id !== id));
  await sb.from('estimate_items').delete().eq('id', id);
 };
 const addVEAlternative = async (parentId) => {
  const parent = estimateItems.find(i => i.id === parentId);
  if (!parent) return;
  const newItem = {
   id: `ei_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
   estimateId: parent.estimateId,
   proposalId: parent.proposalId,
   parentItemId: parentId,
   sectionCode: parent.sectionCode,
   sectionName: parent.sectionName,
   isAlternate: parent.isAlternate,
   isVeAlternative: true,
   sortOrder: parent.sortOrder + 0.5,
   itemCode: parent.itemCode + '-VE',
   size: parent.size,
   manufacturer: '',
   description: 'VE: ' + (parent.description || ''),
   color: '',
   qty: parent.qty,
   unit: parent.unit,
   unitCost: 0,
   freight: 0,
   laborRate: parent.laborRate,
   displayMode: 'full',
   veNote: 'Same scope, value-engineered alternative',
   // PATCH (v37.1): inherit parent's calc-adjustment fields so VE alternative matches its parent's math
   usedMaterial: false, source: 'Manual', multiplier: Number(parent.multiplier)||1, deduction: Number(parent.deduction)||0,
  };
  setEstimateItems(eis => [...eis, newItem]);
  await sb.from('estimate_items').insert(toDbEstimateItem(newItem));
 };
 // FIX (2026-06-11): REMOVED the auto-sync effect that recomputed the base-bid total and wrote it
 // back to proposals.bidAmount whenever it differed by >$0.50. Opening a proposal silently
 // overwrote migrated stored bidAmounts (wrong for mixed-markup files and CO documents).
 // bidAmount is now stored data, edited only deliberately in the Details tab.
 const allGCNames = useMemo(() => Array.from(new Set(proposals.map(p => p.gc).filter(Boolean))).sort(), [proposals]);
 const handleExport=()=>{
  const wb=window.XLSX.utils.book_new();
  const ws1=window.XLSX.utils.json_to_sheet(proposals.map(p=>({'#':p.id,'Project':p.project,'Location':p.location,'GC':p.gc,'Contact':p.contact,'Email':p.email,'Phone':p.phone,'Submitted':p.submitted,'Bid Amount':p.bidAmount,'Contract Amt':p.contractAmount,'Status':p.status,'Estimator':p.estimator||p.owner||'','BD Owner':p.bdOwner||p.owner||'','PM':p.pm||'','Next Action':p.nextAction||'','Next Action Date':p.nextActionDate||'','Lost Reason':p.lostReason||'','Notes':p.notes})));
  window.XLSX.utils.book_append_sheet(wb,ws1,'Pipeline');
  if(lineItems.length){const ws2=window.XLSX.utils.json_to_sheet(lineItems.map(l=>({'Proposal #':l.proposalId,'Type':l.type,'Item':l.item,'Vendor':l.vendor,'Qty':l.qty,'Unit':l.unit,'Est $/Unit':l.estUnit,'Est Total':l.estTotal,'Act $/Unit':l.actUnit,'Act Total':l.actTotal,'Status':l.status})));window.XLSX.utils.book_append_sheet(wb,ws2,'Line Items');}
  const ws3=window.XLSX.utils.json_to_sheet(gcStats.map(g=>({'GC':g.gc,'# Bids':g.proposals,'Total Volume':g.totalVolume,'Open Value':g.openValue,'Won':g.won,'Won Value':g.wonValue,'Lost':g.lost,'Win Rate':g.winRate,'Last Bid':g.lastSubmit})));
  window.XLSX.utils.book_append_sheet(wb,ws3,'GC Intel');
  window.XLSX.writeFile(wb,`AMS_Floors_${new Date().toISOString().slice(0,10)}.xlsx`);
 };
 const overdueCount=proposals.filter(p=>OPEN_STATUSES.includes(p.status)&&(overdueDays(p,settings)||0)>0).length;
 const navItems=[{id:'dashboard',label:'Dashboard',icon:'barChart'},{id:'followups',label:'Follow-Ups',icon:'phone',badge:overdueCount},{id:'pipeline',label:'Pipeline',icon:'listFilter'},{id:'active',label:'Active Jobs',icon:'flame'},{id:'gcs',label:'GC Intel',icon:'building2'},{id:'intelligence',label:'Intelligence',icon:'zap'},{id:'settings',label:'Settings',icon:'settings'}];
 if(!loaded) return (
  <div className="min-h-screen flex items-center justify-center bg-stone-100">
   <div className="text-center"><Ico n="loader" size={32} className="mx-auto mb-3 text-stone-400 animate-spin"/><p className="text-sm text-stone-600">Loading AMS Floors Command Center…</p>{syncing&&<p className="text-xs text-stone-500 mt-1">Setting up database for first time…</p>}</div>
  </div>
 );
 return (
  <div className="min-h-screen bg-stone-100">
   {}
   <header className="bg-white border-b border-stone-200 sticky top-0 z-30">
    <div className="px-5 py-3 flex items-center gap-4 flex-wrap">
     <div className="flex items-center gap-2">
      <div className="w-7 h-7 bg-stone-900 text-white flex items-center justify-center font-serif text-sm">A</div>
      <div><div className="font-serif text-lg leading-none text-stone-900">AMS Floors</div><div className="text-[10px] uppercase tracking-widest text-stone-500 leading-none mt-0.5">Command Center</div></div>
     </div>
     <nav className="flex items-center gap-1 flex-1 flex-wrap">
      {navItems.map(item=>{
       const active=view===item.id;
       return <button key={item.id} onClick={()=>{setView(item.id);setSelectedGC(null);}} className={`text-sm px-3 py-1.5 rounded-sm inline-flex items-center gap-1.5 transition-colors ${active?'bg-stone-900 text-white':'text-stone-700 hover:bg-stone-100'}`}><Ico n={item.icon} size={13}/>{item.label}{item.badge>0&&<span className={`text-[10px] px-1.5 py-0.5 rounded-full font-bold ${active?'bg-rose-300 text-rose-900':'bg-rose-100 text-rose-700'}`}>{item.badge}</span>}</button>;
      })}
     </nav>
     <div className="flex items-center gap-2 ml-auto">
      <button onClick={async()=>{const{data:fp}=await sb.from('proposals').select('*').order('submitted',{ascending:false});if(fp)setProposals(fp.map(p=>({...p,bidAmount:Number(p.bidAmount)||0,estMaterial:Number(p.estMaterial)||0,estLabor:Number(p.estLabor)||0})));}} className={`flex items-center gap-1 text-[10px] font-medium cursor-pointer hover:opacity-70 ${online?'text-emerald-700':'text-stone-400'}`} title="Click to refresh data from database">
       <Ico n={online?'wifi':'wifiOff'} size={12}/><span className="hidden sm:inline">{online?'Live sync':'Offline'}</span>
      </button>
      <YearFilter proposals={proposals} value={settings.yearFilter} onChange={v=>setSettings({...settings,yearFilter:v})}/>
      {/* [UX 2026-06-11 — Ben] New Project removed from the global top bar — it lives in Settings → Actions. */}
     </div>
    </div>
   </header>
   {}
   <main className="px-5 py-5" style={{maxWidth:'1600px',margin:'0 auto'}}>
    {view==='dashboard'&&<DashboardView proposals={proposals} settings={settings} gcStats={gcStats} onSelectProposal={setSelectedId} onSelectGC={g=>{setView('gcs');setSelectedGC(g);}} onNavigate={v=>{setView(v);setSelectedGC(null);}}/>}
    {view==='pipeline'&&<PipelineView proposals={proposals} onSelectProposal={setSelectedId} onSelectGC={g=>{setView('gcs');setSelectedGC(g);}} settings={settings} onSaveProposal={saveProposal}/>}
    {view==='followups'&&<FollowUpsView proposals={proposals} settings={settings} gcStats={gcStats} onSelectProposal={setSelectedId} onSelectGC={g=>{setView('gcs');setSelectedGC(g);}} onMarkContacted={markContacted} onSaveProposal={saveProposal}/>}
    {view==='gcs'&&!selectedGC&&<GCIntelView gcStats={gcStats} proposals={proposals} onSelectGC={setSelectedGC} settings={settings}/>}
    {view==='gcs'&&selectedGC&&<GCDetailView gc={selectedGC} proposals={proposals} gcStats={gcStats} onBack={()=>setSelectedGC(null)} onSelectProposal={setSelectedId} settings={settings}/>}
    {view==='active'&&<ActiveJobsView proposals={proposals} onSelectProposal={setSelectedId} onSelectGC={g=>{setView('gcs');setSelectedGC(g);}} settings={settings} onSaveProposal={saveProposal}/>}
    {view==='settings'&&<SettingsView proposals={proposals} lineItemsAll={lineItems} settings={settings} onSaveSettings={saveSettings} onExport={handleExport} setShowNewProject={setShowNewProject} onSaveProposal={saveProposal} sb={sb} estimateItems={estimateItems} onImported={reloadData}/>}
    {view==='intelligence'&&<IntelligenceView proposals={proposals} gcStats={gcStats} estimateItems={estimateItems} settings={settings} onSelectGC={g=>{setSelectedGC(g);setView('gcs');}} onNavigate={v=>{setView(v);setSelectedGC(null);}} onSaveProposal={saveProposal}/>}
   </main>
   {selectedProposal&&<ProjectDrawer
    proposal={selectedProposal}
    lineItems={selectedLineItems}
    onClose={()=>setSelectedId(null)}
    onSave={saveProposal}
    onDelete={deleteProposal}
    onRenumber={renumberProposal}
    onImported={reloadData}
    onAddLineItem={addLineItem}
    onUpdateLineItem={updateLineItem}
    onDeleteLineItem={deleteLineItem}
    onAddNote={addNote}
    onSelectGC={g=>{setSelectedId(null);setView('gcs');setSelectedGC(g);}}
    estimate={selectedEstimate}
    estimateItems={selectedEstimateItems}
    allEstimateItems={estimateItems}
    onSaveEstimate={saveEstimate}
    onAddEstimateItem={addEstimateItem}
    onUpdateEstimateItem={updateEstimateItem}
    onDeleteEstimateItem={deleteEstimateItem}
    onAddVEAlternative={addVEAlternative}
    suppliers={suppliers}
    installers={installers}
    allGCs={allGCNames}
    gcs={gcs}
    gcStats={gcStats}
   />}
   {showNewProject&&<NewProjectModal onClose={()=>setShowNewProject(false)} onSave={addNewProject} allGCs={Array.from(new Set(proposals.map(p=>p.gc).filter(Boolean))).sort()} proposals={proposals}/>}
  </div>
 );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script>
