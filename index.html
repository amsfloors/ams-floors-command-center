<script>
// Prevent browser from navigating when files are dragged onto the page.
// Must be in plain HTML (not React) so it's active from page load.
(function(){
  function blockNav(e){e.preventDefault();}
  document.addEventListener('dragover', blockNav, false);
  document.addEventListener('drop', blockNav, false);
})();
</script>

    <input id="pw-input" type="password" placeholder="Enter password" style="width:100%;padding:10px 14px;font-size:14px;background:#1c1917;border:1px solid #57534e;color:#fafaf9;outline:none;box-sizing:border-box;margin-bottom:10px;" onkeydown="if(event.key==='Enter')checkPW()" />

<script>
  const PW = 'Sailor@22';
  const SK = 'ams_auth';
  function checkPW(){
    const v = document.getElementById('pw-input').value;
    if(v === PW){ sessionStorage.setItem(SK,'1'); document.getElementById('gate').style.display='none'; }
    else{ document.getElementById('pw-err').textContent='Incorrect password'; document.getElementById('pw-input').value=''; document.getElementById('pw-input').focus(); }
  }
  // Check on load
  if(sessionStorage.getItem(SK)!=='1'){
    document.getElementById('gate').style.display='flex';
    setTimeout(()=>document.getElementById('pw-input').focus(),100);
  } else {
    document.getElementById('gate').style.display='none';
  }
</script>

window.parseBidsheetFile=async(file)=>{
  // Universal Peter bidsheet parser - header-name lookups, layout-tolerant
  const buf=await file.arrayBuffer();
  let wb;
  try{wb=window.XLSX.read(buf,{type:'array',cellDates:true});}
  catch(e){try{wb=window.XLSX.read(buf,{type:'array'});}catch(e2){result.warnings.push('Cannot read file: '+e2.message);return result;}}
  const result={file:file.name,ok:false,warnings:[],proposalId:null,projectNumber:'',project:'',location:'',gc:'',gcAddress:'',contact:'',email:'',phone:'',plansDated:null,submittedDate:null,items:[],totals:{material:0,labor:0,total:0}};
  // Pull metadata from "Proposal Summary" or any sheet with "Proposal #"
  let meta=null;
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn];
    const data=window.XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
    for(let r=0;r<Math.min(data.length,20);r++){
      const row=data[r]||[];
      for(let c=0;c<row.length;c++){
        const v=String(row[c]||'').replace(/^'+/,'').replace(/'+$/,'').trim();
        if(v==='Proposal #'){
          const num=row[c+1]||data[r][c+1];
          if(num){meta={sheet:sn,data,startRow:r};result.proposalId=String(num).replace(/\D/g,'');break;}
        }
      }
      if(meta)break;
    }
    if(meta)break;
  }
  if(!meta){result.warnings.push('No "Proposal #" found in any sheet');return result;}
  const md=meta.data;
  const findVal=(label,scanRows=20)=>{
    for(let r=0;r<Math.min(md.length,scanRows);r++){
      const row=md[r]||[];
      for(let c=0;c<row.length;c++){
        const cv=String(row[c]||'').replace(/^'+/,'').replace(/'+$/,'').trim();
        if(cv.toLowerCase()===label.toLowerCase()){
          for(let cc=c+1;cc<row.length;cc++){
            if(row[cc]!=null){return String(row[cc]).replace(/^'+/,'').replace(/'+$/,'').trim();}
          }
        }
      }
    }
    return null;
  };
  // Project & GC blocks - typical layout: rows 6-13
  // Row 6: project name | (col 4) GC name
  // Row 7: project addr1 | GC addr1
  // Row 8: project city/zip | GC city/zip
  // Row 11: prepared by | attention/contact
  // Row 12: prep email | contact email
  // Row 13: prep phone | contact phone
  const safeRow=(r)=>md[r]||[];
  const safeCell=(r,c)=>{const row=safeRow(r);return String(row[c]!=null?row[c]:'').replace(/^'+/g,'').replace(/'+$/g,'').trim();};
  result.project=safeCell(5,0)||safeCell(5,1);
  const addr1=safeCell(6,0),addr2=safeCell(7,0);
  result.location=[addr1,addr2].filter(Boolean).join(', ');
  result.gc=safeCell(5,3)||safeCell(5,5);
  const gcAddr1=safeCell(6,3),gcAddr2=safeCell(7,3);
  result.gcAddress=[gcAddr1,gcAddr2].filter(Boolean).join(', ');
  result.contact=safeCell(10,3);
  result.email=safeCell(11,3);
  result.phone=safeCell(12,3);
  const pd=findVal('Plans Dated:')||findVal('Plans Dated');
  if(pd){const d=new Date(pd);if(!isNaN(d))result.plansDated=d.toISOString().slice(0,10);}
  const pjn=findVal('Project #')||findVal('Project#');
  if(pjn)result.projectNumber=String(pjn).trim();
  // Try file modified date as submitted-date hint
  try{if(file.lastModified){result.submittedDate=new Date(file.lastModified).toISOString().slice(0,10);}}catch(e){}
  // Now find Bidsheet tab for line items
  const bidSheet=wb.SheetNames.find(n=>/bidsheet/i.test(n));
  if(!bidSheet){result.warnings.push('No "Bidsheet" tab found');return result;}
  const ws=wb.Sheets[bidSheet];
  const data=window.XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  // Strip leading apostrophes Excel adds for text-formatted cells
  const clean=(v)=>String(v||'').replace(/^'+/,'').replace(/'+$/,'').trim().toUpperCase();
  // Find header row - contains both "ITEM" and "MFR" or "DESCRIPTION"
  let hdrRow=-1;
  for(let r=0;r<Math.min(data.length,30);r++){
    const row=(data[r]||[]).map(clean);
    if(row.includes('ITEM')&&(row.includes('MFR')||row.includes('DESCRIPTION'))){hdrRow=r;break;}
  }
  if(hdrRow<0){
    const preview=data.slice(0,15).map((r,i)=>`R${i+1}:[${(r||[]).filter(Boolean).slice(0,5).map(clean).join('|')}]`).join(' ');
    result.warnings.push('Could not find header row. Rows: '+preview);
    return result;
  }
  // Build column map from cleaned header names
  const hdrs=(data[hdrRow]||[]).map(clean);
  const col=(name)=>{const i=hdrs.indexOf(name);return i>=0?i:-1;};
  const cols={item:col('ITEM'),size:col('SIZE'),mfr:col('MFR'),desc:col('DESCRIPTION'),color:col('COLOR'),qty:col('QTY'),unit:col('UNIT'),sfctn:col('SF/CTN'),syctn:col('SY/CTN'),order:col('ORDER'),cost:col('COST'),amount:col('AMOUNT'),tax:col('SALES TAX'),freight:col('FREIGHT'),material:col('MATERIAL'),laborRate:col('LABOR RATE'),labor:col('LABOR'),total:col('TOTAL')};
  const hasMaterialCol=cols.material>=0;
  // Auto-detect markup rate from column header e.g. "30% MARKUP" -> 0.30
  var detectedMarkup=0.20;
  for(var hi=0;hi<hdrs.length;hi++){var hm=hdrs[hi].match(/^(\d+(?:\.\d+)?)\s*%\s*MARKUP$/i);if(hm){detectedMarkup=parseFloat(hm[1])/100;break;}}
  result.markupRate=detectedMarkup;
  // Auto-detect tax rate from SALES TAX column: tax/amount ratio on first data row
  var detectedTax=0.07;
  for(var ri=hdrRow+1;ri<Math.min(data.length,hdrRow+10);ri++){
    var row0=data[ri]||[];
    var a0=cols.amount>=0?Number(row0[cols.amount]):0;
    var t0=cols.tax>=0?Number(row0[cols.tax]):0;
    if(a0>0&&t0>0){detectedTax=Math.round((t0/a0)*1000)/1000;break;}
  }
  result.taxRate=detectedTax;
  // Parse line items - rows after header
  let curSection=null;
  for(let r=hdrRow+1;r<data.length;r++){
    const row=data[r]||[];
    const rawItem=row[cols.item];
    const itemVal=clean(rawItem);
    // Section header: numeric CSI code in ITEM col, no cost
    const rawCost=row[cols.cost];
    const rawQty=row[cols.qty];
    if(itemVal&&!rawCost&&!rawQty){
      if(/^\d{4,6}/.test(itemVal)){
        curSection={code:itemVal,name:clean(row[cols.size]||row[cols.desc]||'')};
        continue;
      }
    }
    const qty=Number(rawQty)||0;
    // Use MATERIAL column (Peter's final sell price incl. markup+tax+freight) as costPerUnit.
    // This gives exact per-item match to Peter's numbers regardless of his multiplier formula.
    // When MATERIAL is used: store freight=0, and estimate taxRate=0/markupRate=0 so
    // system total = qty x costPerUnit = Peter's MATERIAL exactly.
    const rawMaterial=hasMaterialCol?row[cols.material]:null;
    const rawAmount=cols.amount>=0?row[cols.amount]:null;
    const rawCostCol=row[cols.cost];
    let costPerUnit=0;
    let freightForItem=0;
    let usedMaterial=false;
    if(qty>0){
      if(rawMaterial!=null&&Number(rawMaterial)>0){
        costPerUnit=Number(rawMaterial)/qty;
        freightForItem=0; // already baked into MATERIAL
        usedMaterial=true;
      } else if(rawAmount!=null&&Number(rawAmount)>0){
        costPerUnit=Number(rawAmount)/qty;
        freightForItem=cols.freight>=0?Number(row[cols.freight])||0:0;
      } else {
        costPerUnit=Number(rawCostCol)||0;
        freightForItem=cols.freight>=0?Number(row[cols.freight])||0:0;
      }
    }
    if(qty<=0||costPerUnit<=0)continue;
    const mfr=clean(row[cols.mfr]);
    const desc=clean(row[cols.desc]);
    if(!mfr&&!desc)continue;
    result.items.push({
      itemCode:itemVal||'',
      size:clean(row[cols.size]),
      manufacturer:cols.mfr>=0?String(row[cols.mfr]||'').replace(/^'+/g,'').replace(/'+$/g,'').trim():'',
      description:cols.desc>=0?String(row[cols.desc]||'').replace(/^'+/g,'').replace(/'+$/g,'').trim():'',
      color:cols.color>=0?String(row[cols.color]||'').replace(/^'+/g,'').replace(/'+$/g,'').trim():'',
      qty,
      unit:cols.unit>=0?String(row[cols.unit]||'SF').replace(/^'+/g,'').replace(/'+$/g,'').trim():'SF',
      sfPerCtn:cols.sfctn>=0?Number(row[cols.sfctn])||null:null,
      costPerUnit,
      freight:freightForItem,
      laborRate:cols.laborRate>=0?Number(row[cols.laborRate])||0:0,
      usedMaterial,
      sectionCode:curSection?curSection.code:null,
      sectionName:curSection?curSection.name:null,
    });
  }
  // Totals from last row with TOTAL in it, or grand total in summary
  const gt=findVal('TOTAL:',60);
  if(gt){result.totals.total=Number(String(gt).replace(/[,$]/g,''))||0;}
  result.items.forEach(i=>{
    const amt=i.qty*i.costPerUnit;
    result.totals.material+=amt+amt*0.07+i.freight+amt*0.20;
    result.totals.labor+=i.qty*i.laborRate;
  });
  if(!result.totals.total) result.totals.total=Math.round(result.totals.material+result.totals.labor);
  result.ok=result.items.length>0;
  return result;
};

  if(gcF!=='all') out=out.filter(p=>p.gc===gcF);
  if(roleF==='Peter') out=out.filter(p=>(p.estimator||p.owner)==='Peter');
  else if(roleF==='Paul') out=out.filter(p=>(p.bdOwner||p.owner)==='Paul');
  else if(roleF==='David') out=out.filter(p=>p.pm==='David');
  if(search.trim()){const q=search.toLowerCase();out=out.filter(p=>(p.project||'').toLowerCase().includes(q)||(p.gc||'').toLowerCase().includes(q)||(p.location||'').toLowerCase().includes(q)||(p.contact||'').toLowerCase().includes(q)||String(p.id).includes(q));}
  const sorted=[...out];
  if(sortBy==='submitted_desc') sorted.sort((a,b)=>(b.submitted||'').localeCompare(a.submitted||''));
  else if(sortBy==='submitted_asc') sorted.sort((a,b)=>(a.submitted||'').localeCompare(b.submitted||''));

  else if(sortBy==='status') sorted.sort((a,b)=>(STATUS_CONFIG[a.status]?.order||99)-(STATUS_CONFIG[b.status]?.order||99));

 },[proposals,search,statusF,gcF,roleF,sortBy,settings.yearFilter]);

 },[proposals,settings,filter,gcWR,today]);

const GCIntelView=({gcStats,onSelectGC})=>{

 },[gcStats,sortBy,search]);

const calcEstimateItem = (item, taxRate, markupRate) => {
 const qty = Number(item.qty) || 0;
 const costPerUnit = Number(item.costPerUnit) || 0;
 const freight = Number(item.freight) || 0;
 const laborRate = Number(item.laborRate) || 0;
 const amount = qty * costPerUnit;
 const salesTax = amount * (taxRate || 0.07);
 const amsTotalCost = amount + salesTax + freight;
 const markup = amount * (markupRate || 0.20);
 const material = amsTotalCost + markup;
 const labor = qty * laborRate;
 const total = material + labor;
 let orderQty = qty;
 let orderUnit = item.unit || 'SF';
 if (item.sfPerCtn && item.sfPerCtn > 0 && qty > 0) {
  orderQty = Math.ceil(qty / item.sfPerCtn);
  orderUnit = item.syPerCtn ? 'SY' : 'CTN';

 return { amount, salesTax, amsTotalCost, markup, material, labor, total, orderQty, orderUnit };

const IntelligenceView=({proposals,gcStats,estimateItems,settings,onSelectGC,onNavigate,onSaveProposal})=>{

const BulkIntakeView=({proposals,gcs,onImported,sb})=>{
 const [status,setStatus]=useState('idle'); // idle|parsing|ready|importing|done|error
 const [parsed,setParsed]=useState(null);
 const [gcMatch,setGcMatch]=useState('');
 const [outcome,setOutcome]=useState('Submitted');
 const [recent,setRecent]=useState([]);
 const [errMsg,setErrMsg]=useState('');
 const fileInputRef=useRef(null);
 const processFile=async(file)=>{
  if(!file||!/\.xlsx?$/i.test(file.name))return;
  setStatus('parsing');setParsed(null);setErrMsg('');
  try{
   const result=await window.parseBidsheetFile(file);
   if(result.ok){setParsed(result);setGcMatch(result.gc||'');setOutcome('Submitted');setStatus('ready');}
   else{setErrMsg(result.warnings.join(' · ')||'No line items found');setStatus('error');}
  }catch(e){setErrMsg(e.message||'Parse error');setStatus('error');}
 };
 const onFilePick=(e)=>{const f=e.target.files[0];if(f)processFile(f);e.target.value='';};
 const approve=async()=>{
  if(!parsed)return;
  setStatus('importing');
  const propId=String(parsed.proposalId);
  const gcName=gcMatch||parsed.gc;
  const existingProp=proposals.find(p=>String(p.id)===propId);
  // When MATERIAL col used: costPerUnit already is sell price, no tax/markup to add
  const allUsedMat=parsed.items.length>0&&parsed.items.every(i=>i.usedMaterial);
  const detTax=allUsedMat?0:(parsed.taxRate||0.07);
  const detMu=allUsedMat?0:(parsed.markupRate||0.20);
  let sumMatCost=0,sumLab=0;
  parsed.items.forEach(it=>{
   const a=it.qty*it.costPerUnit;
   sumMatCost+=a+a*detTax+it.freight+a*detMu;
   sumLab+=it.qty*it.laborRate;
  });
  const propRecord={
   id:propId,project:parsed.project||(existingProp&&existingProp.project)||'',
   location:parsed.location||(existingProp&&existingProp.location)||'',
   gc:gcName,contact:parsed.contact||(existingProp&&existingProp.contact)||'',
   email:parsed.email||(existingProp&&existingProp.email)||'',
   phone:parsed.phone||(existingProp&&existingProp.phone)||'',
   submitted:parsed.submittedDate||(existingProp&&existingProp.submitted)||new Date().toISOString().slice(0,10),
   status:existingProp?existingProp.status:outcome,
   bidAmount:parsed.totals.total||0,
   estimator:'Peter',bdOwner:(existingProp&&existingProp.bdOwner)||'Paul',
   projectNumber:parsed.projectNumber||(existingProp&&existingProp.projectNumber)||'',
   updatedAt:new Date().toISOString(),
   estMaterial:Math.round(sumMatCost),estLabor:Math.round(sumLab),
  };
  if(!existingProp) propRecord.status=outcome;
  const existingContract=existingProp&&existingProp.contractAmount;
  if(!existingContract) propRecord.contractAmount=parsed.totals.total||Math.round(sumMatCost*(1+(parsed.markupRate||0.20))+sumLab);
  try{
   await sb.from('proposals').upsert(propRecord);
   const estId='est_'+propId;
   // If MATERIAL col was used, tax/markup are baked into costPerUnit → store 0 so formula = qty×cost×1
   const allUsedMaterial=parsed.items.length>0&&parsed.items.every(i=>i.usedMaterial);
   const estTaxRate=allUsedMaterial?0:(parsed.taxRate||0.07);
   const estMarkupRate=allUsedMaterial?0:(parsed.markupRate||0.20);
   await sb.from('estimates').upsert({id:estId,proposalId:propId,proposalNumber:propId,projectName:parsed.project,gcName,taxRate:estTaxRate,markupRate:estMarkupRate,plansDated:parsed.plansDated,updatedAt:new Date().toISOString()});
   // Delete ALL items for this proposal (by proposalId, not estimateId - catches any format)
   await sb.from('estimate_items').delete().eq('proposalId',propId);
   await new Promise(r=>setTimeout(r,300)); // brief pause to ensure delete completes
   const itemRows=parsed.items.map((it,idx)=>({id:estId+'_'+idx,estimateId:estId,proposalId:propId,itemCode:it.itemCode,size:it.size,manufacturer:it.manufacturer,description:it.description,color:it.color,qty:it.qty,unit:it.unit,sfPerCtn:it.sfPerCtn,costPerUnit:it.costPerUnit,freight:it.freight,laborRate:it.laborRate,sectionCode:it.sectionCode||'',sectionName:it.sectionName||'',displayMode:'full',sortOrder:idx,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}));
   if(itemRows.length) await sb.from('estimate_items').insert(itemRows);
   setRecent(r=>[{id:propId,project:parsed.project,outcome,items:parsed.items.length,total:parsed.totals.total},...r].slice(0,15));
   setStatus('done');setParsed(null);
   onImported&&onImported();
  }catch(e){setErrMsg('Import failed: '+e.message);setStatus('error');}
 };
 const reset=()=>{setStatus('idle');setParsed(null);setErrMsg('');};
 const existingProposal=parsed?proposals.find(p=>String(p.id)===String(parsed.proposalId)):null;
 const gcSuggestions=parsed?gcs.filter(g=>{const a=g.toLowerCase().replace(/[^a-z0-9]/g,''),b=(parsed.gc||'').toLowerCase().replace(/[^a-z0-9]/g,'');return a.includes(b.slice(0,8))||b.includes(a.slice(0,8));}).slice(0,8):[];
 return(
  <div className="space-y-4">
   {/* Drop zone — plain click-to-upload, no drag state complexity */}
   <div onClick={()=>fileInputRef.current?.click()} style={{border:'2px dashed #d6d3d1',background:'#fafaf9',cursor:'pointer',padding:'20px',textAlign:'center'}}>
    <Ico n="upload" size={24} className="text-stone-400 mx-auto mb-2"/>
    <div className="text-sm text-stone-700">Click to select a .xlsx bidsheet file</div>
    <div className="text-xs text-stone-400 mt-1">(drag-and-drop disabled — browser limitation on this site)</div>
    <input ref={fileInputRef} type="file" accept=".xlsx,.xls" onChange={onFilePick} className="hidden"/>
   </div>
   {/* Status */}
   {status==='parsing'&&<div className="bg-stone-50 border border-stone-200 p-4 text-sm text-stone-600 flex items-center gap-2"><Ico n="clock" size={16} className="text-stone-400"/>Parsing file...</div>}
   {status==='error'&&<div className="bg-rose-50 border border-rose-200 p-4"><div className="font-medium text-rose-900 text-sm">Parse failed</div><div className="text-xs text-rose-700 mt-1">{errMsg}</div><button onClick={reset} className="mt-2 text-xs text-rose-700 underline">Try another file</button></div>}
   {status==='done'&&<div className="bg-emerald-50 border border-emerald-200 p-4 flex items-center justify-between"><span className="text-emerald-800 font-medium text-sm">✓ Imported successfully</span><button onClick={reset} className="text-xs bg-emerald-700 text-white px-3 py-1.5">Import next file</button></div>}
   {status==='ready'&&parsed&&<div className="bg-white border border-stone-200">
    {/* Approve button FIRST — always visible without scrolling */}
    <div className="p-3 border-b border-stone-200 bg-orange-50 flex items-center gap-3">
     {!existingProposal&&<div className="flex gap-1 flex-shrink-0">{['Won','Lost','Dead','Submitted'].map(o=><button key={o} onClick={()=>setOutcome(o)} style={{background:outcome===o?'#1c1917':'white',color:outcome===o?'white':'#44403c',fontSize:'11px',padding:'3px 8px',border:'1px solid #d6d3d1'}}>{o}</button>)}</div>}
     <button onClick={approve} disabled={status==='importing'} style={{background:'#c2410c',color:'white',padding:'8px 20px',fontWeight:700,fontSize:'14px',border:'none',cursor:'pointer',flex:1,opacity:status==='importing'?0.5:1}}>
      {status==='importing'?'Importing...' : '✓ APPROVE + IMPORT'}
     </button>
    </div>
    {/* Card details below */}
    <div className="p-4 space-y-3">
     <div className="flex items-center gap-3 pb-2 border-b border-stone-100">
      <div className="text-xl font-serif font-bold">#{parsed.proposalId}</div>
      <div className="flex-1"><div className="font-semibold text-stone-900">{parsed.project}</div><div className="text-xs text-stone-500">{parsed.location}{parsed.projectNumber?' · Job #'+parsed.projectNumber:''}</div></div>
      {existingProposal?<span className="text-[10px] px-2 py-0.5 bg-amber-50 text-amber-700 border border-amber-200 rounded-full">⚠ Existing · will overwrite line items</span>:<span className="text-[10px] px-2 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full">✓ New</span>}
     </div>
     <div className="grid grid-cols-2 gap-3 text-sm">
      <div>
       <div className="text-[10px] uppercase text-stone-500 font-semibold mb-1">GC</div>
       <input value={gcMatch} onChange={e=>setGcMatch(e.target.value)} list="gc-list" className="w-full px-2 py-1.5 text-sm border border-stone-300 focus:border-sky-400 focus:outline-none rounded-sm"/>
       <datalist id="gc-list">{gcs.map(g=><option key={g} value={g}/>)}</datalist>
       <div className="text-[10px] mt-1">{gcSuggestions.length?<span className="text-emerald-700">✓ matches existing GC</span>:<span className="text-amber-600">⚠ new GC will be created</span>}</div>
      </div>
      <div>
       <div className="text-[10px] uppercase text-stone-500 font-semibold mb-1">Contact</div>
       <div className="text-sm font-medium">{parsed.contact||'—'}</div>
       <div className="text-xs text-stone-500">{parsed.email}</div>
      </div>
     </div>
     <div className="bg-stone-50 px-3 py-2 text-xs text-stone-700 rounded"><strong>{parsed.items.length} items</strong> · {money(parsed.totals.total,true)} · {Object.entries(parsed.items.reduce((m,i)=>{if(i.manufacturer)m[i.manufacturer]=(m[i.manufacturer]||0)+1;return m;},{})).map(([k,v])=>k+' ('+v+')').join(', ')}</div>
    </div>
   </div>}
   {recent.length>0&&<div className="bg-white border border-stone-200"><div className="px-3 py-2 border-b border-stone-100 text-xs font-semibold text-stone-600">Recently imported</div>{recent.map((r,i)=><div key={i} className="px-3 py-2 border-b border-stone-100 text-xs flex items-center justify-between"><span className="font-medium">#{r.id} {r.project}</span><span className="text-stone-500">{r.items} items · {money(r.total,true)} · <span className={r.outcome==='Won'?'text-emerald-700':r.outcome==='Lost'?'text-rose-700':'text-stone-500'}>{r.outcome}</span></span></div>)}</div>}
  </div>
 );
};

    propId=existingProp?String(existingProp.id):(proposalNum||String(nextId++));
    if(!existingProp){
     const np={id:propId,project:projName,location:location||'',gc:gcName,contact:gcContact,email:gcEmail,phone:gcPhone,submitted:todayStr(),bidAmount:0,contractAmount:null,status:'Submitted',owner:'Peter',estimator:'Peter',bdOwner:'Paul',pm:'',notes:'Imported from '+file.name,retainage:0.1,estMaterial:null,estLabor:null,estOther:null,actMaterial:null,actLabor:null,actOther:null};
     await sb.from('proposals').insert(np);
    }
    const {data:oldEsts}=await sb.from('estimates').select('id').eq('proposalId',propId);
    if(oldEsts&&oldEsts.length){
     for(const oe of oldEsts){
      await sb.from('estimate_items').delete().eq('estimateId',oe.id);
     }
     await sb.from('estimates').delete().eq('proposalId',propId);
    }
    await sb.from('estimate_items').delete().eq('proposalId',propId);
    const estId='est_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
    const freshEst={
     id:estId, proposalId:propId, proposalNumber:proposalNum||propId,
     projectName:projName, gcName:gcName,
     gcContactName:gcContact, gcContactEmail:gcEmail, gcContactPhone:gcPhone,
     taxRate:0.07, markupRate:0.20,
     preparedByName:'Peter Laitres', preparedByEmail:'peter@amsfloors.com', preparedByPhone:'9417401555'
    };
    // Auto-detect markup from column header e.g. "30% MARKUP"
    const hdrsForMu=(bsRaw[bsHdrIdx]||[]).map(v=>String(v||'').replace(/^'+/g,'').replace(/'+$/g,'').trim().toUpperCase());
    const muHdr=hdrsForMu.find(h=>/^\d+(\.\d+)?%\s*MARKUP$/.test(h));
    if(muHdr){const muPct=parseFloat(muHdr.match(/^(\d+(?:\.\d+)?)/)[1]);if(muPct>0&&muPct<100)freshEst.markupRate=muPct/100;}
    // Auto-detect tax from AMOUNT/SALES TAX ratio on first data row
    const amtIdx=hdrsForMu.indexOf('AMOUNT'),taxIdx=hdrsForMu.indexOf('SALES TAX');
    if(amtIdx>=0&&taxIdx>=0){for(let ri=bsHdrIdx+1;ri<Math.min(bsRaw.length,bsHdrIdx+10);ri++){const r=bsRaw[ri]||[];const a=Number(r[amtIdx]),t=Number(r[taxIdx]);if(a>0&&t>0){freshEst.taxRate=Math.round((t/a)*1000)/1000;break;}}}
    await sb.from('estimates').insert(freshEst);
    const headers=(bsRaw[bsHdrIdx]||[]).map(v=>(v||'').toString().trim());
    const hC={};headers.forEach((h,i)=>{hC[h.toUpperCase()]=i;});
    const iItem=hC['ITEM']??0, iSize=hC['SIZE']??1, iMfr=hC['MFR']??2, iDesc=hC['DESCRIPTION']??3, iColor=hC['COLOR']??4;
    const iQty=hC['QTY']??5, iUnit=hC['UNIT']??6, iSfCtn=hC['SF/CTN']??7, iSyCtn=hC['SY/CTN']??8;
    const iCost=hC['COST']??11, iFreight=hC['FREIGHT']??14, iLabRate=hC['LABOR RATE']??18;
    let sec='', secName='', ord=0;
    const items=[];
    const now=Date.now();
    for(let ri=bsHdrIdx+1;ri<bsRaw.length;ri++){
     const row=bsRaw[ri]||[];
     const c0=(row[iItem]||'').toString().trim();
     const c1=(row[iSize]||'').toString().trim();
     const qty=parseFloat((row[iQty]||'').toString().replace(/[^0-9.]/g,''))||0;
     if(/^\d{6}$/.test(c0)&&qty===0){sec=c0;secName=c1||c0;continue;}
     if(!c0||!/[A-Za-z]/.test(c0)) continue;
     if(/TOTAL|BASE BID/i.test(c0)) continue;
     items.push({
      id:'ei_'+now+'_'+Math.random().toString(36).slice(2,9)+'_'+ri,
      estimateId:estId, proposalId:propId,
      sectionCode:sec, sectionName:secName,
      isAlternate:false, isVeAlternative:false, sortOrder:ord++,
      itemCode:c0,
      size:(row[iSize]||'').toString().trim(),
      manufacturer:(row[iMfr]||'').toString().trim(),
      description:(row[iDesc]||'').toString().trim(),
      color:(row[iColor]||'').toString().trim(),
      qty:qty, unit:(row[iUnit]||'SF').toString().trim(),
      sfPerCtn:parseFloat((row[iSfCtn]||'').toString())||null,
      syPerCtn:parseFloat((row[iSyCtn]||'').toString())||null,
      costPerUnit:parseFloat((row[iCost]||'').toString().replace(/[^0-9.]/g,''))||0,
      freight:parseFloat((row[iFreight]||'').toString().replace(/[^0-9.]/g,''))||0,
      laborRate:parseFloat((row[iLabRate]||'').toString().replace(/[^0-9.]/g,''))||0,
      displayMode:'full',
     });
    }
    for(let i=0;i<items.length;i+=50) await sb.from('estimate_items').insert(items.slice(i,i+50));
    const [{data:fE},{data:fI},{data:fP}]=await Promise.all([
     sb.from('estimates').select('*'),
     sb.from('estimate_items').select('*'),
     sb.from('proposals').select('*').order('submitted',{ascending:false}),
    ]);
    if(fE) setEstimates(fE);
    if(fI) setEstimateItems(fI);
    if(fP) setProposals(fP.map(p=>({...p,bidAmount:Number(p.bidAmount)||0})));
    const tax=0.07, mu=0.20;
    let sumMatCost=0, sumMatSell=0, sumLab=0;
    items.forEach(it=>{
     const qty=Number(it.qty)||0, cpu=Number(it.costPerUnit)||0;
     const fr=Number(it.freight)||0, lr=Number(it.laborRate)||0;
     const amt=qty*cpu;
     const amsCost=amt+amt*tax+fr;
     const matSell=amsCost+amt*mu;
     sumMatCost+=amsCost;
     sumMatSell+=matSell;
     sumLab+=qty*lr;
    });
    const grandTotal=Math.round(sumMatSell+sumLab);
    const estMat=Math.round(sumMatCost);
    const estLab=Math.round(sumLab);
    const {data:curProp}=await sb.from('proposals').select('*').eq('id',propId).maybeSingle();
    const mergedProp={...(curProp||existingProp||{}),id:propId,bidAmount:grandTotal,estMaterial:estMat,estLabor:estLab,updatedAt:new Date().toISOString()};
        if(!mergedProp.contractAmount) mergedProp.contractAmount=grandTotal;
    await sb.from('proposals').upsert(mergedProp);
    setProposals(ps=>ps.map(p=>String(p.id)===propId?{...p,bidAmount:grandTotal,contractAmount:p.contractAmount||grandTotal,estMaterial:estMat,estLabor:estLab}:p));
    const {data:fP2}=await sb.from('proposals').select('*').order('submitted',{ascending:false});
    if(fP2) setProposals(fP2.map(p=>({...p,bidAmount:Number(p.bidAmount)||0,estMaterial:Number(p.estMaterial)||0,estLabor:Number(p.estLabor)||0})));
    const marginPct=grandTotal>0?Math.round((grandTotal-estMat-estLab)/grandTotal*100):0;
    setImportStatus({ok:true,message:'✓ Bidsheet imported — '+items.length+' items · '+money(grandTotal)+' total · Est. Margin ~'+marginPct+'% → proposal #'+propId+' "'+projName+'" ('+gcName+'). Open the project → Estimate / Bidsheet tab.'});
    return;
   }
   for(const sheetName of wb.SheetNames){
    const ws=wb.Sheets[sheetName];
    let rows=[];
    for(let hdr=1;hdr<=4;hdr++){
     const attempt=window.XLSX.utils.sheet_to_json(ws,{defval:null,raw:false,range:hdr-1});
     if(attempt.length>0){
      const keys=Object.keys(attempt[0]).map(k=>k.toLowerCase().trim());
      const hasProject=keys.some(k=>k.includes('project')||k.includes('name'));
      const hasGC=keys.some(k=>k==='gc'||k.includes('client')||k.includes('contractor'));
      const hasId=keys.some(k=>k==='#'||k==='id'||k.includes('proposal'));
      if(hasProject||hasGC||hasId){rows=attempt;break;}
     }
    }
    if(!rows.length) continue;
    for(const r of rows){
     const norm={};
     Object.keys(r).forEach(k=>{
      const v=r[k];
      if(v!==null&&v!==undefined&&String(v).trim()!=='')
       norm[k.toLowerCase().trim()]=v;
     });
     const rawProj=norm['project']??norm['project name']??norm['name']??norm['job name']??'';
     const project=cleanProject(String(rawProj).split(';')[0].split('http')[0].trim());
     const gc=String(norm['gc']??norm['client']??norm['gc / client']??norm['general contractor']??norm['contractor']??'').trim();
     if(!project&&!gc) continue;
     const idVal=norm['proposal #']??norm['proposal#']??norm['#']??norm['id']??norm['project number']??norm['project #']??null;
     let id=idVal?String(Math.round(Number(String(idVal).replace(/[^0-9.]/g,'')))):'';
     if(id==='0'||id==='NaN') id='';
     const rawStatus=String(norm['status']??norm['awarded']??'').trim();
     const status=rawStatus?mapStatus(rawStatus):'Lead';
     const submitted=parseDate(norm['submitted']??norm['date submitted']??norm['date']??norm['bid date']??null);
     const dateAwarded=parseDate(norm['date awarded']??norm['awarded date']??null);
     const bidAmount=parseNumber(norm['bid amount']??norm['bid']??norm['amount']??norm['proposal amount']??null)??0;
     const contractAmount=parseNumber(norm['contract amount']??norm['contract amt']??norm['contract']??null)??null;
     const contact=String(norm['contact']??norm['contact name']??norm['name']??'').trim();
     const email=String(norm['email']??'').trim();
     const phone=String(norm['phone']??'').trim();
     const location=String(norm['location']??norm['city']??norm['address']??'').trim();
     const owner=String(norm['owner']??norm['bd owner']??norm['bd']??'Paul').trim();
     const estimator=String(norm['estimator']??norm['est']??'Peter').trim();
     const bdOwner=String(norm['bd owner']??norm['bd']??norm['owner']??'Paul').trim();
     const pm=String(norm['pm']??norm['project manager']??'').trim();
     const notes=String(norm['notes']??norm['comments']??'').trim();
     if(id&&existingIds.has(id)){
      newRecs.push({_action:'update',id,project,gc,contact,email,phone,location,submitted,bidAmount,contractAmount,status,owner,estimator,bdOwner,pm,notes});
      updated++;continue;
     }
     const key=`${project.toLowerCase()}|${gc.toLowerCase()}`;
     if(existingKeys.has(key)) continue;
     existingKeys.add(key);
     if(!id||id==='0') id=String(nextId++);
     newRecs.push({_action:'insert',id,project,gc,contact,email,phone,location,submitted:submitted||(dateAwarded?null:null),bidAmount,contractAmount,status,owner,estimator,bdOwner,pm,notes,retainage:0.1,estMaterial:null,estLabor:null,estOther:null,actMaterial:null,actLabor:null,actOther:null});
     added++;
    }
   }
   if(newRecs.length){
    const inserts=newRecs.filter(r=>r._action==='insert').map(({_action,...r})=>r);
    const updates=newRecs.filter(r=>r._action==='update').map(({_action,...r})=>r);
    if(inserts.length){for(let i=0;i<inserts.length;i+=50)await sb.from('proposals').insert(inserts.slice(i,i+50));}
    if(updates.length){for(const u of updates)await sb.from('proposals').upsert(u);}
    const {data}=await sb.from('proposals').select('*').order('submitted',{ascending:false});
    if(data) setProposals(data.map(p=>({...p,bidAmount:Number(p.bidAmount)||0})));
    setImportStatus({ok:true,message:`Done — ${added} added, ${updated} updated.`});
   } else {
    setImportStatus({ok:false,message:`No new records found. Checked ${wb.SheetNames.length} sheet(s). Make sure your file has Project and/or GC columns.`});
   }
  }catch(e){setImportStatus({ok:false,message:`Import failed: ${e.message}`});}
 };
 const handleExport=()=>{
  const wb=window.XLSX.utils.book_new();
  const ws1=window.XLSX.utils.json_to_sheet(proposals.map(p=>({'#':p.id,'Project':p.project,'Location':p.location,'GC':p.gc,'Contact':p.contact,'Email':p.email,'Phone':p.phone,'Submitted':p.submitted,'Bid Amount':p.bidAmount,'Contract Amt':p.contractAmount,'Status':p.status,'Estimator':p.estimator||p.owner||'','BD Owner':p.bdOwner||p.owner||'','PM':p.pm||'','Next Action':p.nextAction||'','Next Action Date':p.nextActionDate||'','Lost Reason':p.lostReason||'','Notes':p.notes})));
  window.XLSX.utils.book_append_sheet(wb,ws1,'Pipeline');
  if(lineItems.length){const ws2=window.XLSX.utils.json_to_sheet(lineItems.map(l=>({'Proposal #':l.proposalId,'Type':l.type,'Item':l.item,'Vendor':l.vendor,'Qty':l.qty,'Unit':l.unit,'Est $/Unit':l.estUnit,'Est Total':l.estTotal,'Act $/Unit':l.actUnit,'Act Total':l.actTotal,'Status':l.status})));window.XLSX.utils.book_append_sheet(wb,ws2,'Line Items');}
  const ws3=window.XLSX.utils.json_to_sheet(gcStats.map(g=>({'GC':g.gc,'# Bids':g.proposals,'Total Volume':g.totalVolume,'Open Value':g.openValue,'Won':g.won,'Won Value':g.wonValue,'Lost':g.lost,'Win Rate':g.winRate,'Last Bid':g.lastSubmit})));
  window.XLSX.utils.book_append_sheet(wb,ws3,'GC Intel');
  window.XLSX.writeFile(wb,`AMS_Floors_${new Date().toISOString().slice(0,10)}.xlsx`);
 };
 const overdueCount=proposals.filter(p=>OPEN_STATUSES.includes(p.status)&&(overdueDays(p,settings)||0)>0).length;
 const navItems=[{id:'dashboard',label:'Dashboard',icon:'barChart'},{id:'followups',label:'Follow-Ups',icon:'phone',badge:overdueCount},{id:'pipeline',label:'Pipeline',icon:'listFilter'},{id:'active',label:'Active Jobs',icon:'flame'},{id:'gcs',label:'GC Intel',icon:'building2'},{id:'intelligence',label:'Intelligence',icon:'zap'},{id:'settings',label:'Settings',icon:'settings'}];
 if(!loaded) return (
  <div className="min-h-screen flex items-center justify-center bg-stone-100">
   <div className="text-center"><Ico n="loader" size={32} className="mx-auto mb-3 text-stone-400 animate-spin"/><p className="text-sm text-stone-600">Loading AMS Floors Command Center…</p>{syncing&&<p className="text-xs text-stone-500 mt-1">Setting up database for first time…</p>}</div>
  </div>
 );
 return (
  <div className="min-h-screen bg-stone-100">
   {}
   <header className="bg-white border-b border-stone-200 sticky top-0 z-30">
    <div className="px-5 py-3 flex items-center gap-4 flex-wrap">
     <div className="flex items-center gap-2">
      <div className="w-7 h-7 bg-stone-900 text-white flex items-center justify-center font-serif text-sm">A</div>
      <div><div className="font-serif text-lg leading-none text-stone-900">AMS Floors</div><div className="text-[10px] uppercase tracking-widest text-stone-500 leading-none mt-0.5">Command Center</div></div>
     </div>
     <nav className="flex items-center gap-1 flex-1 flex-wrap">
      {navItems.map(item=>{
       const active=view===item.id;
       return <button key={item.id} onClick={()=>{setView(item.id);setSelectedGC(null);}} className={`text-sm px-3 py-1.5 rounded-sm inline-flex items-center gap-1.5 transition-colors ${active?'bg-stone-900 text-white':'text-stone-700 hover:bg-stone-100'}`}><Ico n={item.icon} size={13}/>{item.label}{item.badge>0&&<span className={`text-[10px] px-1.5 py-0.5 rounded-full font-bold ${active?'bg-rose-300 text-rose-900':'bg-rose-100 text-rose-700'}`}>{item.badge}</span>}</button>;
      })}
     </nav>
     <div className="flex items-center gap-2 ml-auto">
      <div className={`flex items-center gap-1 text-[10px] font-medium ${online?'text-emerald-700':'text-stone-400'}`} title={online?'Connected — changes sync live':'Offline — working locally'}>
       <Ico n={online?'wifi':'wifiOff'} size={12}/><span className="hidden sm:inline">{online?'Live sync':'Offline'}</span>
      </div>
      <YearFilter proposals={proposals} value={settings.yearFilter} onChange={v=>setSettings({...settings,yearFilter:v})}/>
      <button onClick={()=>setShowNewProject(true)} className="inline-flex items-center gap-1.5 bg-orange-800 hover:bg-orange-900 text-white text-sm px-3 py-1.5 rounded-sm font-medium whitespace-nowrap"><Ico n="plus" size={13}/>New Project</button>
     </div>
    </div>
   </header>
   {}
   <main className="px-5 py-5" style={{maxWidth:'1600px',margin:'0 auto'}}>
    {view==='dashboard'&&<DashboardView proposals={proposals} settings={settings} gcStats={gcStats} onSelectProposal={setSelectedId} onSelectGC={g=>{setView('gcs');setSelectedGC(g);}} onNavigate={v=>{setView(v);setSelectedGC(null);}}/>}
    {view==='pipeline'&&<PipelineView proposals={proposals} onSelectProposal={setSelectedId} onSelectGC={g=>{setView('gcs');setSelectedGC(g);}} settings={settings} onSaveProposal={saveProposal}/>}
    {view==='followups'&&<FollowUpsView proposals={proposals} settings={settings} gcStats={gcStats} onSelectProposal={setSelectedId} onSelectGC={g=>{setView('gcs');setSelectedGC(g);}} onMarkContacted={markContacted} onSaveProposal={saveProposal}/>}
    {view==='gcs'&&!selectedGC&&<GCIntelView gcStats={gcStats} proposals={proposals} onSelectGC={setSelectedGC} settings={settings}/>}
    {view==='gcs'&&selectedGC&&<GCDetailView gc={selectedGC} proposals={proposals} gcStats={gcStats} onBack={()=>setSelectedGC(null)} onSelectProposal={setSelectedId} settings={settings}/>}
    {view==='active'&&<ActiveJobsView proposals={proposals} onSelectProposal={setSelectedId} onSelectGC={g=>{setView('gcs');setSelectedGC(g);}} settings={settings} onSaveProposal={saveProposal}/>}
    {view==='settings'&&<SettingsView proposals={proposals} lineItemsAll={lineItems} settings={settings} onSaveSettings={saveSettings} onExport={handleExport} setShowNewProject={setShowNewProject} onSaveProposal={saveProposal} sb={sb} onImported={async()=>{
     const [{data:fP},{data:fE},{data:fI}]=await Promise.all([
      sb.from('proposals').select('*').order('submitted',{ascending:false}),
      sb.from('estimates').select('*'),
      sb.from('estimate_items').select('*'),
     ]);
     if(fP)setProposals(fP.map(p=>({...p,bidAmount:Number(p.bidAmount)||0,estMaterial:Number(p.estMaterial)||0,estLabor:Number(p.estLabor)||0})));
     if(fE)setEstimates(fE);
     if(fI)setEstimateItems(fI);
    }}/>}
    {view==='intelligence'&&<IntelligenceView proposals={proposals} gcStats={gcStats} estimateItems={estimateItems} settings={settings} onSelectGC={g=>{setSelectedGC(g);setView('gcs');}} onNavigate={v=>{setView(v);setSelectedGC(null);}} onSaveProposal={saveProposal}/>}
   </main>
   {selectedProposal&&<ProjectDrawer
    proposal={selectedProposal}
    lineItems={selectedLineItems}
    onClose={()=>setSelectedId(null)}
    onSave={saveProposal}
    onAddLineItem={addLineItem}
    onUpdateLineItem={updateLineItem}
    onDeleteLineItem={deleteLineItem}
    onAddNote={addNote}
    onSelectGC={g=>{setSelectedId(null);setView('gcs');setSelectedGC(g);}}
    estimate={selectedEstimate}
    estimateItems={selectedEstimateItems}
    allEstimateItems={estimateItems}
    onSaveEstimate={saveEstimate}
    onAddEstimateItem={addEstimateItem}
    onUpdateEstimateItem={updateEstimateItem}
    onDeleteEstimateItem={deleteEstimateItem}
    onAddVEAlternative={addVEAlternative}
    suppliers={suppliers}
    installers={installers}
    allGCs={allGCNames}
    gcs={gcs}
    gcStats={gcStats}
   />}
   {showNewProject&&<NewProjectModal onClose={()=>setShowNewProject(false)} onSave={addNewProject} allGCs={Array.from(new Set(proposals.map(p=>p.gc).filter(Boolean))).sort()} proposals={proposals}/>}
  </div>
 );
}
