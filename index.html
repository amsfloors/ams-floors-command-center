/* ── Year Filter ──────────────────────────────────────────── */
const YearFilter=({proposals,value,onChange})=>{
  const years=useMemo(()=>{const s=new Set();proposals.forEach(p=>{if(p.submitted)s.add(p.submitted.slice(0,4));});return['All',...Array.from(s).sort().reverse()];},[proposals]);
  return <select value={value} onChange={e=>onChange(e.target.value)} className="text-xs border border-stone-300 bg-white px-2 py-1 rounded-sm focus:outline-none">{years.map(y=><option key={y} value={y}>{y==='All'?'All years':y}</option>)}</select>;
};

/* ── Import helpers ───────────────────────────────────────── */
const parseDate=v=>{if(!v)return null;if(v instanceof Date)return v.toISOString().slice(0,10);const d=new Date(v);return isNaN(d)?null:d.toISOString().slice(0,10);};
const parseNumber=v=>{if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return v;const n=Number(String(v).replace(/[$,]/g,''));return isNaN(n)?null:n;};
const mapStatus=s=>{if(!s)return 'Submitted';const m={'cold lead':'Lead','qualified':'Lead','bidding':'Bidding','submitted':'Submitted','follow-up':'Negotiating','discussing':'Negotiating','awarded':'Won','closed won':'Won','active':'Active','in progress':'Active','completed':'Complete','lost':'Lost','closed lost':'Lost','dead':'Dead','on hold':'Hold'};return m[String(s).toLowerCase().trim()]||String(s);};
const cleanProject=val=>{if(!val||String(val).trim()==='nan')return'';let s=String(val);s=s.replace(/https?:\/\/\S+/g,'');s=s.replace(/\u00a0/g,' ');s=s.replace(/;\s*$/,'').trim();return s;};

/* ══════════════════════════════════════════════════════════
   ROOT APP
════════════════════════════════════════════════════════════ */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [syncing, setSyncing] = useState(false);
  const [online, setOnline] = useState(true);
  const [proposals, setProposals] = useState([]);
  const [lineItems, setLineItems] = useState([]);
  const [estimates, setEstimates] = useState([]);
  const [estimateItems, setEstimateItems] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [installers, setInstallers] = useState([]);
  const [gcs, setGcs] = useState([]);
  const [settings, setSettings] = useState({slaSubmitted:14,slaNegotiating:7,targetMargin:0.18,riskMarginFloor:0.05,yearFilter:'All'});
  const [view, setView] = useState('dashboard');
  const [selectedId, setSelectedId] = useState(null);
  const [selectedGC, setSelectedGC] = useState(null);
  const [showNewProject, setShowNewProject] = useState(false);
  const [importStatus, setImportStatus] = useState(null);

  /* ── Initial load ────────────────────────────────────── */
  useEffect(()=>{
    (async()=>{
      try {
        const {data:props,error}=await sb.from('proposals').select('*').order('submitted',{ascending:false});
        if(error) throw error;
        if(!props||props.length===0){
          // First run — seed the database
          setSyncing(true);
          const chunks=[];
          for(let i=0;i<SEED_PROPOSALS.length;i+=50) chunks.push(SEED_PROPOSALS.slice(i,i+50));
          for(const chunk of chunks){await sb.from('proposals').insert(chunk.map(p=>({...p,id:String(p.id)})));}
          setProposals(SEED_PROPOSALS.map(p=>({...p,id:String(p.id)})));
          setSyncing(false);
        } else {
          setProposals(props.map(p=>({...p,id:p.id,bidAmount:Number(p.bidAmount)||0})));
        }
        const {data:li}=await sb.from('line_items').select('*');
        if(li) setLineItems(li);
        const {data:st}=await sb.from('app_settings').select('*').eq('id',1).single();
        if(st) setSettings(prev=>({...prev,...st}));
        // Phase 1: load estimates and catalog
        const {data:est}=await sb.from('estimates').select('*');
        if(est) setEstimates(est);
        const {data:estIt}=await sb.from('estimate_items').select('*').order('sortOrder',{ascending:true});
        if(estIt) setEstimateItems(estIt);
        const {data:sup}=await sb.from('suppliers').select('*').order('name');
        if(sup) setSuppliers(sup);
        const {data:ins}=await sb.from('installers').select('*').order('name');
        if(ins) setInstallers(ins);
        const {data:gc}=await sb.from('gcs').select('*').order('name');
        if(gc) setGcs(gc);
      } catch(e){
        console.error('Load error:',e);
        // Fallback to seed data if DB unreachable
        setProposals(SEED_PROPOSALS.map(p=>({...p,id:String(p.id)})));
        setOnline(false);
      }
      setLoaded(true);
    })();
  },[]);

  /* ── Real-time subscription ──────────────────────────── */
  useEffect(()=>{
    if(!loaded) return;
    const channel=sb.channel('ams_changes')
      .on('postgres_changes',{event:'*',schema:'public',table:'proposals'},payload=>{
        if(payload.eventType==='INSERT') setProposals(ps=>{const exists=ps.find(p=>p.id===payload.new.id);return exists?ps:[payload.new,...ps];});
        else if(payload.eventType==='UPDATE') setProposals(ps=>ps.map(p=>p.id===payload.new.id?{...payload.new,bidAmount:Number(payload.new.bidAmount)||0}:p));
        else if(payload.eventType==='DELETE') setProposals(ps=>ps.filter(p=>p.id!==payload.old.id));
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'line_items'},payload=>{
        if(payload.eventType==='INSERT') setLineItems(ls=>{const ex=ls.find(l=>l.id===payload.new.id);return ex?ls:[...ls,payload.new];});
        else if(payload.eventType==='UPDATE') setLineItems(ls=>ls.map(l=>l.id===payload.new.id?payload.new:l));
        else if(payload.eventType==='DELETE') setLineItems(ls=>ls.filter(l=>l.id!==payload.old.id));
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'estimates'},payload=>{
        if(payload.eventType==='INSERT') setEstimates(es=>{const ex=es.find(e=>e.id===payload.new.id);return ex?es:[...es,payload.new];});
        else if(payload.eventType==='UPDATE') setEstimates(es=>es.map(e=>e.id===payload.new.id?payload.new:e));
        else if(payload.eventType==='DELETE') setEstimates(es=>es.filter(e=>e.id!==payload.old.id));
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'estimate_items'},payload=>{
        if(payload.eventType==='INSERT') setEstimateItems(eis=>{const ex=eis.find(i=>i.id===payload.new.id);return ex?eis:[...eis,payload.new];});
        else if(payload.eventType==='UPDATE') setEstimateItems(eis=>eis.map(i=>i.id===payload.new.id?payload.new:i));
        else if(payload.eventType==='DELETE') setEstimateItems(eis=>eis.filter(i=>i.id!==payload.old.id));
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'suppliers'},payload=>{
        if(payload.eventType==='INSERT') setSuppliers(s=>{const ex=s.find(x=>x.id===payload.new.id);return ex?s:[...s,payload.new];});
        else if(payload.eventType==='UPDATE') setSuppliers(s=>s.map(x=>x.id===payload.new.id?payload.new:x));
        else if(payload.eventType==='DELETE') setSuppliers(s=>s.filter(x=>x.id!==payload.old.id));
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'gcs'},payload=>{
        if(payload.eventType==='INSERT') setGcs(s=>{const ex=s.find(x=>x.id===payload.new.id);return ex?s:[...s,payload.new];});
        else if(payload.eventType==='UPDATE') setGcs(s=>s.map(x=>x.id===payload.new.id?payload.new:x));
        else if(payload.eventType==='DELETE') setGcs(s=>s.filter(x=>x.id!==payload.old.id));
      })
      .subscribe(status=>{setOnline(status==='SUBSCRIBED');});
    return()=>sb.removeChannel(channel);
  },[loaded]);

  /* ── Computed ────────────────────────────────────────── */
  const gcStats=useMemo(()=>computeGCStats(proposals),[proposals]);
  const selectedProposal=useMemo(()=>proposals.find(p=>p.id===selectedId)||null,[proposals,selectedId]);
  const selectedLineItems=useMemo(()=>lineItems.filter(l=>l.proposalId===selectedId),[lineItems,selectedId]);

  /* ── Actions ─────────────────────────────────────────── */
  const saveProposal=async(next)=>{
    const updated={...next,updatedAt:new Date().toISOString()};
    setProposals(ps=>ps.map(p=>p.id===next.id?updated:p));
    await sb.from('proposals').upsert({...updated,id:String(updated.id)});
  };

  const addNewProject=async(rec)=>{
    const key=`${(rec.project||'').toLowerCase().trim()}|${(rec.gc||'').toLowerCase().trim()}`;
    const dup=proposals.find(p=>`${(p.project||'').toLowerCase().trim()}|${(p.gc||'').toLowerCase().trim()}`===key);
    if(dup) return;
    const r={...rec,id:String(rec.id)};
    setProposals(ps=>[r,...ps]);
    await sb.from('proposals').insert(r);
  };

  const markContacted=async(id,note)=>{
    const stamp=todayStr();
    const entry=note?`[${stamp}] ${note}`:`[${stamp}] Called / contacted`;
    setProposals(ps=>ps.map(p=>{if(p.id!==id)return p;const updated={...p,lastTouched:stamp,notes:p.notes?`${entry}\n${p.notes}`:entry};sb.from('proposals').upsert({...updated,id:String(updated.id)});return updated;}));
  };

  const addNote=async(id,text)=>{
    const stamp=todayStr();
    const entry=`[${stamp}] ${text}`;
    setProposals(ps=>ps.map(p=>{if(p.id!==id)return p;const updated={...p,lastTouched:stamp,notes:p.notes?`${entry}\n${p.notes}`:entry};sb.from('proposals').upsert({...updated,id:String(updated.id)});return updated;}));
  };

  const addLineItem=async(proposalId,type)=>{
    const li={id:`li_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,proposalId:String(proposalId),type,item:'',vendor:'',qty:null,unit:'',estUnit:null,estTotal:null,actUnit:null,actTotal:null,status:'Pending'};
    setLineItems(ls=>[...ls,li]);
    await sb.from('line_items').insert(li);
  };

  const updateLineItem=async(next)=>{
    setLineItems(ls=>ls.map(l=>l.id===next.id?next:l));
    await sb.from('line_items').upsert(next);
  };

  const deleteLineItem=async(id)=>{
    setLineItems(ls=>ls.filter(l=>l.id!==id));
    await sb.from('line_items').delete().eq('id',id);
  };

  const saveSettings=async(next)=>{
    setSettings(next);
    await sb.from('app_settings').upsert({id:1,...next});
  };

  /* ── Phase 1: Estimate actions ───────────────────────────── */
  // Get-or-create an estimate for the selected proposal
  const selectedEstimate = useMemo(() => {
    if (!selectedId) return null;
    return estimates.find(e => e.proposalId === selectedId) || null;
  }, [estimates, selectedId]);

  const selectedEstimateItems = useMemo(() => {
    if (!selectedEstimate) return [];
    return estimateItems.filter(i => i.estimateId === selectedEstimate.id);
  }, [estimateItems, selectedEstimate]);

  // Auto-create estimate when user opens estimate tab and none exists
  useEffect(() => {
    if (!selectedId) return;
    const existing = estimates.find(e => e.proposalId === selectedId);
    if (existing) return;
    const p = proposals.find(p => p.id === selectedId);
    if (!p) return;
    const newEst = {
      id: `est_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      proposalId: String(selectedId),
      proposalNumber: String(selectedId),
      projectName: p.project || '',
      projectAddressLine1: p.location || '',
      gcName: p.gc || '',
      gcContactName: p.contact || '',
      gcContactEmail: p.email || '',
      gcContactPhone: p.phone || '',
      taxRate: 0.07,
      markupRate: 0.20,
      preparedByName: 'Peter Laitres',
      preparedByEmail: 'peter@amsfloors.com',
      preparedByPhone: '9417401555',
    };
    setEstimates(es => [...es, newEst]);
    sb.from('estimates').insert(newEst).then(({ error }) => {
      if (error) console.error('Failed to create estimate:', error);
    });
  }, [selectedId, proposals]);

  const saveEstimate = async (next) => {
    const updated = { ...next, updatedAt: new Date().toISOString() };
    setEstimates(es => es.map(e => e.id === next.id ? updated : e));
    await sb.from('estimates').upsert(updated);
  };

  const addEstimateItem = async (sectionCode, sectionName, isAlternate = false) => {
    if (!selectedEstimate) return;
    const newItem = {
      id: `ei_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      estimateId: selectedEstimate.id,
      proposalId: String(selectedId),
      sectionCode: sectionCode || '',
      sectionName: sectionName || '',
      isAlternate: isAlternate,
      sortOrder: estimateItems.filter(i => i.estimateId === selectedEstimate.id).length,
      itemCode: '',
      size: '',
      manufacturer: '',
      description: '',
      color: '',
      qty: 0,
      unit: 'SF',
      costPerUnit: 0,
      freight: 0,
      laborRate: 0,
      displayMode: 'full',
    };
    setEstimateItems(eis => [...eis, newItem]);
    await sb.from('estimate_items').insert(newItem);
  };

  const updateEstimateItem = async (next) => {
    const updated = { ...next, updatedAt: new Date().toISOString() };
    setEstimateItems(eis => eis.map(i => i.id === next.id ? updated : i));
    await sb.from('estimate_items').upsert(updated);
  };

  const deleteEstimateItem = async (id) => {
    // Also delete any VE children
    const children = estimateItems.filter(i => i.parentItemId === id);
    for (const child of children) {
      setEstimateItems(eis => eis.filter(i => i.id !== child.id));
      await sb.from('estimate_items').delete().eq('id', child.id);
    }
    setEstimateItems(eis => eis.filter(i => i.id !== id));
    await sb.from('estimate_items').delete().eq('id', id);
  };

  const addVEAlternative = async (parentId) => {
    const parent = estimateItems.find(i => i.id === parentId);
    if (!parent) return;
    const newItem = {
      id: `ei_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
      estimateId: parent.estimateId,
      proposalId: parent.proposalId,
      parentItemId: parentId,
      sectionCode: parent.sectionCode,
      sectionName: parent.sectionName,
      isAlternate: parent.isAlternate,
      isVeAlternative: true,
      sortOrder: parent.sortOrder + 0.5,
      itemCode: parent.itemCode + '-VE',
      size: parent.size,
      manufacturer: '',
      description: 'VE: ' + (parent.description || ''),
      color: '',
      qty: parent.qty,
      unit: parent.unit,
      costPerUnit: 0,
      freight: 0,
      laborRate: parent.laborRate,
      displayMode: 'full',
      veNote: 'Same scope, value-engineered alternative',
    };
    setEstimateItems(eis => [...eis, newItem]);
    await sb.from('estimate_items').insert(newItem);
  };

  // Sync estimate total back to proposal.bidAmount when estimate items change
  useEffect(() => {
    if (!selectedEstimate) return;
    const baseTotal = selectedEstimateItems.reduce((s, item) => {
      if (item.isVeAlternative || item.isAlternate) return s;
      const c = calcEstimateItem(item, selectedEstimate.taxRate || 0.07, selectedEstimate.markupRate || 0.20);
      return s + c.total;
    }, 0);
    if (baseTotal > 0) {
      const prop = proposals.find(p => p.id === selectedId);
      if (prop && Math.abs((prop.bidAmount || 0) - baseTotal) > 0.5) {
        const updated = { ...prop, bidAmount: baseTotal };
        setProposals(ps => ps.map(p => p.id === selectedId ? updated : p));
        sb.from('proposals').update({ bidAmount: baseTotal }).eq('id', String(selectedId));
      }
    }
  }, [selectedEstimateItems, selectedEstimate]);

  // All GC names for autocomplete
  const allGCNames = useMemo(() => Array.from(new Set(proposals.map(p => p.gc).filter(Boolean))).sort(), [proposals]);


  /* ── Import ──────────────────────────────────────────── */
  const handleImport=async(file)=>{
    setImportStatus({ok:true,message:'Reading…'});
    try{
      const buf=await file.arrayBuffer();
      const wb=window.XLSX.read(buf,{type:'array',cellDates:true});
      let added=0,updated=0;
      const maxId=Math.max(0,...proposals.map(p=>parseInt(p.id)||0));
      let nextId=maxId+1;
      const existingIds=new Set(proposals.map(p=>String(p.id)));
      const existingKeys=new Set(proposals.map(p=>`${(p.project||'').toLowerCase().trim()}|${(p.gc||'').toLowerCase().trim()}`));
      const newRecs=[];
      for(const sheetName of wb.SheetNames){
        const rows=window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{defval:null,raw:false});
        for(const r of rows){
          const norm={};Object.keys(r).forEach(k=>{norm[k.toLowerCase().trim()]=r[k];});
          const rawProj=norm['project']??norm['project name']??norm['name']??'';
          const project=cleanProject(rawProj);
          const gc=String(norm['gc']??norm['client']??norm['gc / client']??'').trim();
          if(!project&&!gc) continue;
          const idVal=norm['#']??norm['id']??norm['proposal #']??norm['proposal#'];
          let id=idVal?String(Number(String(idVal).replace(/\D/g,''))||''):'';;
          if(id&&existingIds.has(id)){
            // Update
            const rec={id,project,gc,contact:String(norm['contact']??norm['contact name']??'').trim(),email:String(norm['email']??'').trim(),phone:String(norm['phone']??'').trim(),submitted:parseDate(norm['submitted']??norm['date']),bidAmount:parseNumber(norm['bid amount']??norm['bid']??norm['amount'])??0,contractAmount:parseNumber(norm['contract amt']??norm['contract amount']),status:norm['status']?mapStatus(norm['status']):'Submitted',owner:String(norm['owner']??'Paul').trim(),notes:String(norm['notes']??'').trim()};
            newRecs.push({...rec,_action:'update'});updated++;continue;
          }
          const key=`${project.toLowerCase()}|${gc.toLowerCase()}`;
          if(existingKeys.has(key)) continue;
          existingKeys.add(key);
          if(!id||id==='0') id=String(nextId++);
          const rec={id,project,gc,contact:String(norm['contact']??norm['contact name']??'').trim(),email:String(norm['email']??'').trim(),phone:String(norm['phone']??'').trim(),submitted:parseDate(norm['submitted']??norm['date']),bidAmount:parseNumber(norm['bid amount']??norm['bid']??norm['amount'])??0,contractAmount:null,status:norm['status']?mapStatus(norm['status']):'Lead',owner:String(norm['owner']??'Paul').trim(),notes:String(norm['notes']??'').trim(),retainage:0.1,estMaterial:null,estLabor:null,estOther:null,actMaterial:null,actLabor:null,actOther:null};
          newRecs.push({...rec,_action:'insert'});added++;
        }
      }
      if(newRecs.length){
        const inserts=newRecs.filter(r=>r._action==='insert').map(({_action,...r})=>r);
        const updates=newRecs.filter(r=>r._action==='update').map(({_action,...r})=>r);
        if(inserts.length){for(let i=0;i<inserts.length;i+=50)await sb.from('proposals').insert(inserts.slice(i,i+50));}
        if(updates.length){for(const u of updates)await sb.from('proposals').upsert(u);}
        const {data}=await sb.from('proposals').select('*').order('submitted',{ascending:false});
        if(data) setProposals(data.map(p=>({...p,bidAmount:Number(p.bidAmount)||0})));
        setImportStatus({ok:true,message:`Import complete — ${added} new, ${updated} updated.`});
      } else {
        setImportStatus({ok:false,message:'Nothing new to import. All rows already exist or no Project/GC columns found.'});
      }
    }catch(e){setImportStatus({ok:false,message:`Import failed: ${e.message}`});}
  };

  /* ── Export ──────────────────────────────────────────── */
  const handleExport=()=>{
    const wb=window.XLSX.utils.book_new();
    const ws1=window.XLSX.utils.json_to_sheet(proposals.map(p=>({'#':p.id,'Project':p.project,'Location':p.location,'GC':p.gc,'Contact':p.contact,'Email':p.email,'Phone':p.phone,'Submitted':p.submitted,'Bid Amount':p.bidAmount,'Contract Amt':p.contractAmount,'Status':p.status,'Owner':p.owner,'Notes':p.notes})));
    window.XLSX.utils.book_append_sheet(wb,ws1,'Pipeline');
    if(lineItems.length){const ws2=window.XLSX.utils.json_to_sheet(lineItems.map(l=>({'Proposal #':l.proposalId,'Type':l.type,'Item':l.item,'Vendor':l.vendor,'Qty':l.qty,'Unit':l.unit,'Est $/Unit':l.estUnit,'Est Total':l.estTotal,'Act $/Unit':l.actUnit,'Act Total':l.actTotal,'Status':l.status})));window.XLSX.utils.book_append_sheet(wb,ws2,'Line Items');}
    const ws3=window.XLSX.utils.json_to_sheet(gcStats.map(g=>({'GC':g.gc,'# Bids':g.proposals,'Total Volume':g.totalVolume,'Open Value':g.openValue,'Won':g.won,'Won Value':g.wonValue,'Lost':g.lost,'Win Rate':g.winRate,'Last Bid':g.lastSubmit})));
    window.XLSX.utils.book_append_sheet(wb,ws3,'GC Intel');
    window.XLSX.writeFile(wb,`AMS_Floors_${new Date().toISOString().slice(0,10)}.xlsx`);
  };

  /* ── Nav ─────────────────────────────────────────────── */
  const overdueCount=proposals.filter(p=>OPEN_STATUSES.includes(p.status)&&(overdueDays(p,settings)||0)>0).length;
  const navItems=[{id:'dashboard',label:'Dashboard',icon:'barChart'},{id:'followups',label:'Follow-Ups',icon:'phone',badge:overdueCount},{id:'pipeline',label:'Pipeline',icon:'listFilter'},{id:'active',label:'Active Jobs',icon:'flame'},{id:'gcs',label:'GC Intel',icon:'building2'},{id:'settings',label:'Settings',icon:'settings'}];

  if(!loaded) return (
    <div className="min-h-screen flex items-center justify-center bg-stone-100">
      <div className="text-center"><Ico n="loader" size={32} className="mx-auto mb-3 text-stone-400 animate-spin"/><p className="text-sm text-stone-600">Loading AMS Floors Command Center…</p>{syncing&&<p className="text-xs text-stone-500 mt-1">Setting up database for first time…</p>}</div>
    </div>
  );

  return (
    <div className="min-h-screen bg-stone-100">
      {/* Header */}
      <header className="bg-white border-b border-stone-200 sticky top-0 z-30">
        <div className="px-5 py-3 flex items-center gap-4 flex-wrap">
          <div className="flex items-center gap-2">
            <div className="w-7 h-7 bg-stone-900 text-white flex items-center justify-center font-serif text-sm">A</div>
            <div><div className="font-serif text-lg leading-none text-stone-900">AMS Floors</div><div className="text-[10px] uppercase tracking-widest text-stone-500 leading-none mt-0.5">Command Center</div></div>
          </div>
          <nav className="flex items-center gap-1 flex-1 flex-wrap">
            {navItems.map(item=>{
              const active=view===item.id;
              return <button key={item.id} onClick={()=>{setView(item.id);setSelectedGC(null);}} className={`text-sm px-3 py-1.5 rounded-sm inline-flex items-center gap-1.5 transition-colors ${active?'bg-stone-900 text-white':'text-stone-700 hover:bg-stone-100'}`}><Ico n={item.icon} size={13}/>{item.label}{item.badge>0&&<span className={`text-[10px] px-1.5 py-0.5 rounded-full font-bold ${active?'bg-rose-300 text-rose-900':'bg-rose-100 text-rose-700'}`}>{item.badge}</span>}</button>;
            })}
          </nav>
          <div className="flex items-center gap-2 ml-auto">
            <div className={`flex items-center gap-1 text-[10px] font-medium ${online?'text-emerald-700':'text-stone-400'}`} title={online?'Connected — changes sync live':'Offline — working locally'}>
              <Ico n={online?'wifi':'wifiOff'} size={12}/><span className="hidden sm:inline">{online?'Live sync':'Offline'}</span>
            </div>
            <YearFilter proposals={proposals} value={settings.yearFilter} onChange={v=>setSettings({...settings,yearFilter:v})}/>
            <button onClick={()=>setShowNewProject(true)} className="inline-flex items-center gap-1.5 bg-orange-800 hover:bg-orange-900 text-white text-sm px-3 py-1.5 rounded-sm font-medium whitespace-nowrap"><Ico n="plus" size={13}/>New Project</button>
          </div>
        </div>
      </header>

      {/* Main */}
      <main className="px-5 py-5" style={{maxWidth:'1600px',margin:'0 auto'}}>
        {view==='dashboard'&&<DashboardView proposals={proposals} settings={settings} gcStats={gcStats} onSelectProposal={setSelectedId} onSelectGC={g=>{setView('gcs');setSelectedGC(g);}} onNavigate={v=>{setView(v);setSelectedGC(null);}}/>}
        {view==='pipeline'&&<PipelineView proposals={proposals} onSelectProposal={setSelectedId} onSelectGC={g=>{setView('gcs');setSelectedGC(g);}} settings={settings}/>}
        {view==='followups'&&<FollowUpsView proposals={proposals} settings={settings} gcStats={gcStats} onSelectProposal={setSelectedId} onSelectGC={g=>{setView('gcs');setSelectedGC(g);}} onMarkContacted={markContacted}/>}
        {view==='gcs'&&!selectedGC&&<GCIntelView gcStats={gcStats} proposals={proposals} onSelectGC={setSelectedGC} settings={settings}/>}
        {view==='gcs'&&selectedGC&&<GCDetailView gc={selectedGC} proposals={proposals} gcStats={gcStats} onBack={()=>setSelectedGC(null)} onSelectProposal={setSelectedId} settings={settings}/>}
        {view==='active'&&<ActiveJobsView proposals={proposals} onSelectProposal={setSelectedId} onSelectGC={g=>{setView('gcs');setSelectedGC(g);}} settings={settings}/>}
        {view==='settings'&&<SettingsView proposals={proposals} lineItemsAll={lineItems} settings={settings} onSaveSettings={saveSettings} onImport={handleImport} onExport={handleExport} importStatus={importStatus} setShowNewProject={setShowNewProject}/>}
      </main>

      {selectedProposal&&<ProjectDrawer
        proposal={selectedProposal}
        lineItems={selectedLineItems}
        onClose={()=>setSelectedId(null)}
        onSave={saveProposal}
        onAddLineItem={addLineItem}
        onUpdateLineItem={updateLineItem}
        onDeleteLineItem={deleteLineItem}
        onAddNote={addNote}
        onSelectGC={g=>{setSelectedId(null);setView('gcs');setSelectedGC(g);}}
        estimate={selectedEstimate}
        estimateItems={selectedEstimateItems}
        allEstimateItems={estimateItems}
        onSaveEstimate={saveEstimate}
        onAddEstimateItem={addEstimateItem}
        onUpdateEstimateItem={updateEstimateItem}
        onDeleteEstimateItem={deleteEstimateItem}
        onAddVEAlternative={addVEAlternative}
        suppliers={suppliers}
        installers={installers}
        allGCs={allGCNames}
        gcs={gcs}
      />}
      {showNewProject&&<NewProjectModal onClose={()=>setShowNewProject(false)} onSave={addNewProject} allGCs={Array.from(new Set(proposals.map(p=>p.gc).filter(Boolean))).sort()} proposals={proposals}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
